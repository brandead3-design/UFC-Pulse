name: Build UFC Pulse Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Debug APK
        run: ./gradlew assembleDebug --no-daemon -Pandroid.useAndroidX=true -Pandroid.nonTransitiveRClass=true
        continue-on-error: true

      - name: Alternative Compile (Global Gradle)
        run: gradle assembleDebug --no-daemon -Pandroid.useAndroidX=true -Pandroid.nonTransitiveRClass=true

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: UFC-Pulse-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
