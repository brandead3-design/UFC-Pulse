          } catch (_: Throwable) { fb }

          object UfcImageLoader {
              private val cache = object : LruCache<String, ImageBitmap>(80) {}
              private val failed = mutableSetOf<String>()
              private fun conn(u: String) = (URL(u).openConnection() as HttpURLConnection).apply {
                  instanceFollowRedirects = true; connectTimeout = 6000; readTimeout = 6000
                  setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 17; SM-F971B) Chrome/131.0.0.0 Mobile")
              }
              suspend fun load(name: String): ImageBitmap? = withContext(Dispatchers.IO) {
                  val k = name.trim().lowercase()
                  cache.get(k)?.let { return@withContext it }
                  if (k in failed) return@withContext null
                  var url = ""
                  try {
                      val slug = k.replace("'", "").replace(".", "").replace(Regex("[^a-z0-9]+"), "-").trim('-')
                      val c = conn("https://www.ufc.com/athlete/$slug")
                      if (c.responseCode in 200..299) {
                          val h = c.inputStream.bufferedReader().use { it.readText() }
                          url = Regex("""https://[^"'\s>]+(?:event_results_athlete_headshot|athlete_bio_full_body)[^"'\s>]+\.png""").find(h)?.value
                              ?: Regex("""property=["']og:image["']\s+content=["'](https://[^"']+)["']""").find(h)?.groupValues?.getOrNull(1) ?: ""
                      }
                      c.disconnect()
                  } catch (_: Throwable) {}
                  if (url.isBlank()) try {
                      val c = conn("https://site.web.api.espn.com/apis/common/v3/search?query=${URLEncoder.encode(name, "UTF-8")}&limit=1&type=player")
                      if (c.responseCode in 200..299) {
                          val it = JSONObject(c.inputStream.bufferedReader().use { r -> r.readText() }).optJSONArray("items")?.optJSONObject(0)
                          url = it?.optJSONObject("image")?.optString("default") ?: it?.optJSONArray("images")?.optJSONObject(0)?.optString("url") ?: ""
                      }
                      c.disconnect()
                  } catch (_: Throwable) {}
                  if (url.isNotBlank()) try {
                      val c = conn(url)
                      if (c.responseCode in 200..299) {
                          val bmp = BitmapFactory.decodeStream(c.inputStream)?.asImageBitmap()
                          c.disconnect()
                          if (bmp != null) { cache.put(k, bmp); return@withContext bmp }
                      }
                      c.disconnect()
                  } catch (_: Throwable) {}
                  failed.add(k); null
              }
          }

          @Composable
          fun FighterAvatar(name: String, size: Dp = 48.dp, isChamp: Boolean = false) {
              var bmp by remember(name) { mutableStateOf<ImageBitmap?>(null) }
              LaunchedEffect(name) { bmp = UfcImageLoader.load(name) }
              val init = name.split(" ").mapNotNull { it.firstOrNull()?.uppercase() }.take(2).joinToString("")
              Box(Modifier.size(size).clip(CircleShape).background(Color(0xFF252530)).border(if (isChamp) 2.dp else 1.dp, if (isChamp) Color(0xFFFFD700) else Color(0xFFD20A0A), CircleShape), Alignment.Center) {
                  if (bmp != null) Image(bmp!!, name, Modifier.fillMaxSize(), contentScale = ContentScale.Crop)
                  else Text(init, color = Color.White, fontSize = (size.value * 0.32f).sp, fontWeight = FontWeight.Black)
              }
          }

