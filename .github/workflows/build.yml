          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Calendar
          import kotlin.math.sqrt

          private val Bg = Color(0xFF080810)
          private val Surface = Color(0xFF14141E)
          private val CardBg = Color(0xFF1A1A28)
          private val Red = Color(0xFFFF1744)
          private val Green = Color(0xFF00E676)
          private val Gold = Color(0xFFFFD700)
          private val Muted = Color(0xFF9A9AA8)
          private val Line = Color(0xFF2A2A38)

          data class Bout(
              val a: String,
              val b: String,
              val idA: String,
              val idB: String,
              val recA: String,
              val recB: String,
              val oa: String,
              val ob: String,
              val round: Int,
              val time: String,
              val weight: String,
              val stats: String
          )

          data class Event(
              val id: String,
              val name: String,
              val date: String,
              val venue: String,
              val bouts: List<Bout>,
              val done: Boolean,
              val live: Boolean
          )

          data class RankedFighter(val rank: Int, val name: String, val record: String, val id: String)
          data class RankingGroup(val name: String, val fighters: List<RankedFighter>)

          object Repo {
              var events by mutableStateOf(listOf<Event>())
              var rankings by mutableStateOf(listOf<RankingGroup>())
              var status by mutableStateOf("Syncing UFC data...")

              fun sync() {
                  CoroutineScope(Dispatchers.IO).launch {
                      try {
                          val odds = loadOdds()
                          val ev = loadEvents(odds)
                          val ranks = loadRankings()
                          withContext(Dispatchers.Main) {
                              events = ev
                              rankings = ranks
                              status = "Updated"
                          }
                      } catch (ex: Exception) {
                          withContext(Dispatchers.Main) {
                              status = "Sync failed"
                          }
                      }
                  }
              }

              private fun http(url: String): String {
                  val conn = URL(url).openConnection() as HttpURLConnection
                  conn.requestMethod = "GET"
                  conn.connectTimeout = 20000
                  conn.readTimeout = 20000
                  conn.setRequestProperty("User-Agent", "MMAPulse/1.0")
                  val code = conn.responseCode
                  val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                  val text = stream.bufferedReader().readText()
                  conn.disconnect()
                  if (code !in 200..299) throw RuntimeException("HTTP " + code)
                  return text
              }

              private fun ymd(cal: Calendar): String {
                  val y = cal.get(Calendar.YEAR).toString()
                  val m = cal.get(Calendar.MONTH) + 1
                  val d = cal.get(Calendar.DAY_OF_MONTH)
                  val ms = if (m < 10) "0" + m else m.toString()
                  val ds = if (d < 10) "0" + d else d.toString()
                  return y + ms + ds
              }

              private fun loadOdds(): Map<String, Pair<String, String>> {
                  val key = "2092f68cd7ae933cb12006094338703b"
                  val url = "https://api.the-odds-api.com/v4/sports/mma_mixed_martial_arts/odds?regions=eu,uk,us&markets=h2h&oddsFormat=american&apiKey=" + key
                  val arr = JSONArray(http(url))
                  val map = HashMap<String, Pair<String, String>>()
                  for (i in 0 until arr.length()) {
                      val ev = arr.getJSONObject(i)
                      val home = ev.optString("home_team")
                      val away = ev.optString("away_team")
                      var oa = ""
                      var ob = ""
                      val books = ev.optJSONArray("bookmakers") ?: continue
                      for (j in 0 until books.length()) {
                          val markets = books.getJSONObject(j).optJSONArray("markets") ?: continue
                          for (k in 0 until markets.length()) {
                              val market = markets.getJSONObject(k)
                              if (market.optString("key") != "h2h") continue
                              val outs = market.optJSONArray("outcomes") ?: continue
                              for (o in 0 until outs.length()) {
                                  val oc = outs.getJSONObject(o)
                                  val price = oc.optInt("price")
                                  val am = if (price > 0) "+" + price else price.toString()
                                  val nm = oc.optString("name")
                                  if (nm.equals(home, true)) oa = am
                                  if (nm.equals(away, true)) ob = am
                              }
                          }
                      }
                      if (oa.isNotEmpty() && ob.isNotEmpty()) {
                          map[home.lowercase() + " vs " + away.lowercase()] = Pair(oa, ob)
                          map[away.lowercase() + " vs " + home.lowercase()] = Pair(ob, oa)
                      }
                  }
                  return map
              }

              private fun loadEvents(odds: Map<String, Pair<String, String>>): List<Event> {
                  val start = Calendar.getInstance()
                  start.add(Calendar.DAY_OF_YEAR, -2)
                  val end = Calendar.getInstance()
                  end.add(Calendar.DAY_OF_YEAR, 120)
                  val range = ymd(start) + "-" + ymd(end)
                  val urls = listOf(
                      "https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard",
                      "https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard?dates=" + range
                  )
                  val seen = HashSet<String>()
                  val out = ArrayList<Event>()
                  for (u in urls) {
                      val root = JSONObject(http(u))
                      val arr = root.optJSONArray("events") ?: continue
                      for (i in 0 until arr.length()) {
                          val ev = arr.getJSONObject(i)
                          val id = ev.optString("id")
                          if (id.isBlank() || !seen.add(id)) continue
                          val state = ev.optJSONObject("status")?.optJSONObject("type")?.optString("state") ?: "pre"
                          val venueObj = ev.optJSONArray("venues")?.optJSONObject(0)
                              ?: ev.optJSONArray("competitions")?.optJSONObject(0)?.optJSONObject("venue")
                          val city = venueObj?.optJSONObject("address")?.optString("city") ?: ""
                          val venueName = venueObj?.optString("fullName") ?: ""
                          val venue = if (city.isBlank()) venueName else venueName + ", " + city
                          val bouts = ArrayList<Bout>()
                          val comps = ev.optJSONArray("competitions") ?: continue
                          for (j in 0 until comps.length()) {
                              val c = comps.getJSONObject(j)
                              val cs = c.optJSONArray("competitors") ?: continue
                              if (cs.length() < 2) continue
                              val c0 = cs.getJSONObject(0)
                              val c1 = cs.getJSONObject(1)
                              val n0 = c0.optJSONObject("athlete")?.optString("displayName") ?: ""
                              val n1 = c1.optJSONObject("athlete")?.optString("displayName") ?: ""
                              val pair = odds[n0.lowercase() + " vs " + n1.lowercase()]
                              val st = c.optJSONObject("status")
                              bouts.add(
                                  Bout(
                                      a = n0,
                                      b = n1,
                                      idA = c0.optString("id"),
                                      idB = c1.optString("id"),
                                      recA = c0.optJSONArray("records")?.optJSONObject(0)?.optString("summary") ?: "",
                                      recB = c1.optJSONArray("records")?.optJSONObject(0)?.optString("summary") ?: "",
                                      oa = pair?.first ?: "",
                                      ob = pair?.second ?: "",
                                      round = st?.optInt("period") ?: 0,
                                      time = st?.optString("displayClock") ?: "",
                                      weight = c.optJSONObject("type")?.optString("abbreviation") ?: "MMA",
                                      stats = statLine(c0, n0) + statLine(c1, n1)
                                  )
                              )
                          }
                          bouts.reverse()
                          out.add(
                              Event(
                                  id = id,
                                  name = ev.optString("name"),
                                  date = ev.optString("date"),
                                  venue = venue,
                                  bouts = bouts,
                                  done = state == "post",
                                  live = state == "in"
                              )
                          )
                      }
                  }
                  out.sortBy { it.date }
                  return out
              }

              private fun statLine(comp: JSONObject, name: String): String {
                  val arr = comp.optJSONArray("statistics") ?: return ""
                  val bits = ArrayList<String>()
                  for (i in 0 until arr.length()) {
                      val s = arr.getJSONObject(i)
                      val label = s.optString("displayName").ifBlank { s.optString("name") }
                      val value = s.optString("displayValue")
                      if (label.isNotBlank() && value.isNotBlank()) bits.add(label + " " + value)
                  }
                  if (bits.isEmpty()) return ""
                  return name + ": " + bits.joinToString(", ") + "  "
              }

              private fun loadRankings(): List<RankingGroup> {
                  val root = JSONObject(http("https://site.api.espn.com/apis/site/v2/sports/mma/ufc/rankings"))
                  val arr = root.optJSONArray("rankings") ?: return emptyList()
                  val groups = ArrayList<RankingGroup>()
                  for (i in 0 until arr.length()) {
                      val g = arr.getJSONObject(i)
                      val rawName = g.optString("name")
                      if (rawName.contains("Champions")) continue
                      val fighters = ArrayList<RankedFighter>()
                      val ranks = g.optJSONArray("ranks") ?: continue
                      for (j in 0 until ranks.length()) {
                          val r = ranks.getJSONObject(j)
                          val athlete = r.optJSONObject("athlete") ?: continue
                          val name = athlete.optString("displayName")
                          if (name.isBlank()) continue
                          fighters.add(
                              RankedFighter(
                                  rank = r.optInt("current"),
                                  name = name,
                                  record = r.optString("recordSummary"),
                                  id = athlete.optString("id")
                              )
                          )
                      }
                      if (fighters.isNotEmpty()) {
                          val label = rawName
                              .replace(" Division Rankings", "")
                              .replace(" Rankings", "")
                          groups.add(RankingGroup(label, fighters))
                      }
                  }
                  return groups
              }
          }

          object AI {
              fun analyze(oa: String, ob: String): Pair<Int, Int> {
                  fun p(o: String): Double {
                      if (o.isBlank()) return 0.5
                      val n = o.replace("+", "").toIntOrNull() ?: return 0.5
                      return if (n > 0) 100.0 / (n + 100) else (-n).toDouble() / ((-n) + 100)
                  }
                  val pa = p(oa)
                  val pb = p(ob)
                  val t = pa + pb
                  val wa = ((pa / t) * 100).toInt().coerceIn(8, 92)
                  return Pair(wa, 100 - wa)
              }
          }

          object Faces {
              private val cache = object : LruCache<String, ImageBitmap>(240) {}

              suspend fun load(id: String): ImageBitmap? = withContext(Dispatchers.IO) {
                  if (id.isBlank()) return@withContext null
                  cache.get(id)?.let { return@withContext it }
                  try {
                      val url = "https://a.espncdn.com/i/headshots/mma/players/full/" + id + ".png"
                      val conn = URL(url).openConnection() as HttpURLConnection
                      conn.connectTimeout = 8000
                      conn.readTimeout = 8000
                      conn.instanceFollowRedirects = true
                      if (conn.responseCode !in 200..299) {
                          conn.disconnect()
                          return@withContext null
                      }
                      val bmp = BitmapFactory.decodeStream(conn.inputStream)
                      conn.disconnect()
                      if (bmp == null) return@withContext null
                      val img = bmp.asImageBitmap()
                      cache.put(id, img)
                      img
                  } catch (_: Exception) {
                      null
                  }
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { App() }
              }
          }

          @Composable
          fun ECGLogo() {
              val infinite = rememberInfiniteTransition()
              val chase by infinite.animateFloat(
                  0f,
                  1f,
                  infiniteRepeatable(tween(2200, easing = LinearEasing), RepeatMode.Restart)
              )
              val beat by infinite.animateFloat(
                  0f,
                  1f,
                  infiniteRepeatable(tween(900, easing = LinearEasing), RepeatMode.Reverse)
              )
              Canvas(Modifier.size(56.dp)) {
                  val w = size.width
                  val h = size.height
                  val pts = listOf(
                      Offset(0f, h * 0.55f),
                      Offset(w * 0.16f, h * 0.55f),
                      Offset(w * 0.24f, h * 0.22f),
                      Offset(w * 0.34f, h * 0.82f),
                      Offset(w * 0.46f, h * 0.10f),
                      Offset(w * 0.56f, h * 0.90f),
                      Offset(w * 0.66f, h * 0.38f),
                      Offset(w * 0.76f, h * 0.55f),
                      Offset(w, h * 0.55f)
                  )
                  val red = Path().apply {
                      moveTo(pts[0].x, pts[0].y)
                      for (i in 1 until pts.size) lineTo(pts[i].x, pts[i].y)
                  }
                  drawPath(
                      red,
                      Red,
                      style = Stroke(width = 2.2f + beat * 2.2f, cap = StrokeCap.Round, join = StrokeJoin.Round)
                  )
                  val lens = ArrayList<Float>()
                  var total = 0f
                  for (i in 0 until pts.size - 1) {
                      val dx = pts[i + 1].x - pts[i].x
                      val dy = pts[i + 1].y - pts[i].y
                      val len = sqrt(dx * dx + dy * dy)
                      lens.add(len)
                      total += len
                  }
                  val target = chase * total
                  val white = Path()
                  var remain = target
                  white.moveTo(pts[0].x, pts[0].y)
                  for (i in lens.indices) {
                      val a = pts[i]
                      val b = pts[i + 1]
                      if (remain >= lens[i]) {
                          white.lineTo(b.x, b.y)
                          remain -= lens[i]
                      } else {
                          val f = if (lens[i] == 0f) 0f else remain / lens[i]
                          val x = a.x + (b.x - a.x) * f
                          val y = a.y + (b.y - a.y) * f
                          white.lineTo(x, y)
                          drawCircle(Color.White, radius = 3.4f, center = Offset(x, y))
                          break
                      }
                  }
                  drawPath(white, Color.White, style = Stroke(width = 2.4f, cap = StrokeCap.Round, join = StrokeJoin.Round))
              }
          }

          @Composable
          fun App() {
              var tab by remember { mutableStateOf(0) }
              var selected by remember { mutableStateOf<Event?>(null) }
              val tabs = listOf("Live", "Cards", "Roster", "Predict")
              LaunchedEffect(Unit) {
                  Repo.sync()
                  while (true) {
                      delay(40000)
                      Repo.sync()
                  }
              }
              BoxWithConstraints(Modifier.fillMaxSize().background(Bg)) {
                  val wide = maxWidth > 720.dp
                  Scaffold(
                      containerColor = Bg,
                      topBar = {
                          Column {
                              Row(
                                  Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 8.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  if (selected != null) {
                                      TextButton(onClick = { selected = null }) { Text("Back", color = Red) }
                                      Text(
                                          selected!!.name,
                                          color = Color.White,
                                          fontWeight = FontWeight.Bold,
                                          maxLines = 1,
                                          overflow = TextOverflow.Ellipsis,
                                          modifier = Modifier.weight(1f)
                                      )
                                  } else {
                                      ECGLogo()
                                      Spacer(Modifier.width(8.dp))
                                      Text("MMA PULSE", color = Red, fontWeight = FontWeight.Bold, fontSize = 20.sp)
                                      Spacer(Modifier.weight(1f))
                                      Button(
                                          onClick = { Repo.sync() },
                                          colors = ButtonDefaults.buttonColors(containerColor = Red),
                                          shape = RoundedCornerShape(20.dp)
                                      ) { Text("Sync", color = Color.White) }
                                  }
                              }
                              HorizontalDivider(color = Line)
                          }
                      },
                      bottomBar = {
                          Column {
                              if (!wide && selected == null) {
                                  NavigationBar(containerColor = Color(0xFF101018)) {
                                      tabs.forEachIndexed { i, t ->
                                          NavigationBarItem(
                                              selected = tab == i,
                                              onClick = { tab = i },
                                              icon = {},
                                              label = { Text(t, fontSize = 12.sp) }
                                          )
                                      }
                                  }
                              }
                              Text(
                                  "© 2026 MMA Pulse",
                                  color = Muted,
                                  fontSize = 11.sp,
                                  textAlign = TextAlign.Center,
                                  modifier = Modifier.fillMaxWidth().padding(bottom = 6.dp, top = 4.dp)
                              )
                          }
                      }
                  ) { pad ->
                      Row(Modifier.fillMaxSize().padding(pad)) {
                          if (wide && selected == null) {
                              Column(
                                  Modifier.width(140.dp).fillMaxHeight().background(Color(0xFF101018)).padding(8.dp),
                                  verticalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  tabs.forEachIndexed { i, t ->
                                      val on = tab == i
                                      Text(
                                          t,
                                          color = if (on) Red else Muted,
                                          fontWeight = if (on) FontWeight.Bold else FontWeight.Medium,
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .clip(RoundedCornerShape(12.dp))
                                              .background(if (on) Color(0xFF2A1218) else Color.Transparent)
                                              .clickable { tab = i }
                                              .padding(vertical = 14.dp, horizontal = 10.dp)
                                      )
                                  }
                              }
                          }
                          Box(Modifier.weight(1f).fillMaxHeight()) {
                              if (selected != null) EventDetail(selected!!)
                              else when (tab) {
                                  0 -> Live(wide)
                                  1 -> Cards(wide) { selected = it }
                                  2 -> Roster()
                                  else -> Predict()
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun Face(id: String, name: String, px: Int) {
              var img by remember(id) { mutableStateOf<ImageBitmap?>(null) }
              LaunchedEffect(id) { img = Faces.load(id) }
              if (img != null) {
                  Image(
                      img!!,
                      contentDescription = name,
                      modifier = Modifier.size(px.dp).clip(CircleShape),
                      contentScale = ContentScale.Crop
                  )
              } else {
                  Box(
                      Modifier.size(px.dp).clip(CircleShape).background(Line),
                      contentAlignment = Alignment.Center
                  ) {
                      Text(name.take(1), color = Color.White, fontWeight = FontWeight.Bold)
                  }
              }
          }

          @Composable
          fun BoutCard(b: Bout) {
              val (wa, wb) = AI.analyze(b.oa, b.ob)
              Card(
                  Modifier.fillMaxWidth().padding(vertical = 6.dp),
                  colors = CardDefaults.cardColors(containerColor = CardBg),
                  shape = RoundedCornerShape(18.dp)
              ) {
                  Column(Modifier.padding(14.dp)) {
                      Text(b.weight, color = Gold, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                      Spacer(Modifier.height(8.dp))
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Face(b.idA, b.a, 64)
                          Spacer(Modifier.width(10.dp))
                          Column(Modifier.weight(1f)) {
                              Text(b.a, color = Color.White, fontWeight = FontWeight.Bold, maxLines = 2, overflow = TextOverflow.Ellipsis)
                              if (b.recA.isNotBlank()) Text(b.recA, color = Muted, fontSize = 12.sp)
                              Text(wa.toString() + "%", color = Red, fontWeight = FontWeight.Bold)
                          }
                          Text("VS", color = Red, fontWeight = FontWeight.Bold, modifier = Modifier.padding(horizontal = 6.dp))
                          Column(Modifier.weight(1f), horizontalAlignment = Alignment.End) {
                              Text(b.b, color = Color.White, fontWeight = FontWeight.Bold, textAlign = TextAlign.End, maxLines = 2, overflow = TextOverflow.Ellipsis)
                              if (b.recB.isNotBlank()) Text(b.recB, color = Muted, fontSize = 12.sp)
                              Text(wb.toString() + "%", color = Green, fontWeight = FontWeight.Bold)
                          }
                          Spacer(Modifier.width(10.dp))
                          Face(b.idB, b.b, 64)
                      }
                      if (b.round > 0) {
                          Text(
                              "Round " + b.round + if (b.time.isBlank()) "" else "  ·  " + b.time,
                              color = Green,
                              fontSize = 13.sp,
                              modifier = Modifier.padding(top = 8.dp)
                          )
                      }
                      if (b.stats.isNotBlank()) {
                          Text(b.stats.trim(), color = Color.White, fontSize = 12.sp, modifier = Modifier.padding(top = 6.dp))
                      }
                      LinearProgressIndicator(
                          progress = { wa / 100f },
                          modifier = Modifier.fillMaxWidth().height(8.dp).padding(top = 8.dp).clip(RoundedCornerShape(8.dp)),
                          color = Red,
                          trackColor = Green
                      )
                      if (b.oa.isNotEmpty()) {
                          Text(
                              b.a + "  " + b.oa + "    |    " + b.b + "  " + b.ob,
                              color = Gold,
                              fontSize = 12.sp,
                              modifier = Modifier.padding(top = 6.dp)
                          )
                      }
                  }
              }
          }

          @Composable
          fun Live(wide: Boolean) {
              val live = Repo.events.filter { it.live }
              val next = Repo.events.firstOrNull { !it.done && !it.live }
              LazyColumn(Modifier.fillMaxSize().padding(16.dp)) {
                  item {
                      Text("LIVE", color = Red, fontWeight = FontWeight.Bold, fontSize = 22.sp)
                      Text(Repo.status, color = Muted, fontSize = 12.sp)
                      Spacer(Modifier.height(8.dp))
                  }
                  if (live.isEmpty()) {
                      item { Text("No UFC fight is live right now.", color = Muted) }
                  } else {
                      items(live) { ev ->
                          Text(ev.name, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                          Text(ev.venue, color = Muted, fontSize = 12.sp)
                          ev.bouts.forEach { BoutCard(it) }
                      }
                  }
                  if (next != null) {
                      item {
                          Spacer(Modifier.height(18.dp))
                          Text("NEXT", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 18.sp)
                          Text(next.name, color = Color.White, fontWeight = FontWeight.SemiBold)
                          Text(prettyDate(next.date) + "  ·  " + next.venue, color = Muted, fontSize = 12.sp)
                          Spacer(Modifier.height(6.dp))
                      }
                      items(if (wide) next.bouts else next.bouts.take(3)) { BoutCard(it) }
                  }
              }
          }

          @Composable
          fun Cards(wide: Boolean, onSelect: (Event) -> Unit) {
              val list = Repo.events
              LazyColumn(Modifier.fillMaxSize().padding(16.dp)) {
                  item {
                      Text("UFC CARDS", color = Red, fontWeight = FontWeight.Bold, fontSize = 22.sp)
                      Spacer(Modifier.height(8.dp))
                  }
                  if (list.isEmpty()) {
                      item { Text("No cards loaded yet.", color = Muted) }
                  }
                  items(list) { e ->
                      Card(
                          Modifier.fillMaxWidth().padding(vertical = 6.dp).clickable { onSelect(e) },
                          colors = CardDefaults.cardColors(containerColor = CardBg),
                          shape = RoundedCornerShape(16.dp)
                      ) {
                          Column(Modifier.padding(16.dp)) {
                              Text(
                                  if (e.live) "LIVE" else if (e.done) "FINAL" else "UPCOMING",
                                  color = if (e.live) Green else if (e.done) Muted else Gold,
                                  fontSize = 11.sp,
                                  fontWeight = FontWeight.Bold
                              )
                              Text(e.name, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                              Text(prettyDate(e.date), color = Color.White, fontSize = 13.sp)
                              Text(e.venue, color = Muted, fontSize = 13.sp)
                              Text(e.bouts.size.toString() + " bouts", color = Green, fontSize = 12.sp, modifier = Modifier.padding(top = 4.dp))
                              val main = e.bouts.firstOrNull()
                              if (main != null) {
                                  Spacer(Modifier.height(8.dp))
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Face(main.idA, main.a, 40)
                                      Text(
                                          main.a + "  vs  " + main.b,
                                          color = Gold,
                                          fontSize = 13.sp,
                                          modifier = Modifier.weight(1f).padding(horizontal = 8.dp),
                                          maxLines = 2
                                      )
                                      Face(main.idB, main.b, 40)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun EventDetail(event: Event) {
              LazyColumn(Modifier.fillMaxSize().padding(16.dp)) {
                  item {
                      Text(if (event.live) "LIVE" else if (event.done) "FINAL" else "UPCOMING", color = if (event.live) Green else Gold, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                      Text(event.name, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 20.sp)
                      Text(prettyDate(event.date), color = Color.White, fontSize = 14.sp)
                      Text(event.venue, color = Muted, fontSize = 14.sp)
                      Spacer(Modifier.height(8.dp))
                  }
                  items(event.bouts) { BoutCard(it) }
              }
          }

          @Composable
          fun Roster() {
              LazyColumn(Modifier.fillMaxSize().padding(16.dp)) {
                  item {
                      Text("UFC ROSTER", color = Red, fontWeight = FontWeight.Bold, fontSize = 22.sp)
                      Text("Pound-for-pound, then every weight class.", color = Muted, fontSize = 13.sp)
                  }
                  if (Repo.rankings.isEmpty()) {
                      item { Text("Rankings not loaded yet.", color = Muted, modifier = Modifier.padding(top = 12.dp)) }
                  }
                  items(Repo.rankings) { group ->
                      Text(group.name, color = Green, fontWeight = FontWeight.Bold, fontSize = 17.sp, modifier = Modifier.padding(top = 16.dp, bottom = 8.dp))
                      group.fighters.forEach { f ->
                          Row(
                              Modifier.fillMaxWidth().padding(vertical = 5.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(f.rank.toString(), color = Red, fontWeight = FontWeight.Bold, modifier = Modifier.width(28.dp))
                              Face(f.id, f.name, 46)
                              Spacer(Modifier.width(10.dp))
                              Column {
                                  Text(f.name, color = Color.White, fontWeight = FontWeight.Medium)
                                  Text(f.record, color = Muted, fontSize = 12.sp)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun Predict() {
              val upcoming = Repo.events.filter { !it.done }.flatMap { it.bouts }
              LazyColumn(Modifier.fillMaxSize().padding(16.dp)) {
                  item {
                      Text("PREDICTIONS", color = Red, fontWeight = FontWeight.Bold, fontSize = 22.sp)
                      Text("Win chance from current EU book odds.", color = Muted, fontSize = 13.sp)
                      Spacer(Modifier.height(8.dp))
                  }
                  if (upcoming.isEmpty()) {
                      item { Text("No upcoming bouts with a loaded card.", color = Muted) }
                  }
                  items(upcoming) { BoutCard(it) }
              }
          }

          private fun prettyDate(iso: String): String {
              if (iso.length < 10) return iso
              return iso.substring(0, 10)
          }
          END_KOTLIN
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MMA-Pulse-APK
          path: app/build/outputs/apk/debug/app-debug.apk
