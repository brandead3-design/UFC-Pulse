          object PulseAiEngine {
              private fun parseWL(rec: String): Pair<Int, Int> {
                  val p = rec.split("-").mapNotNull { it.trim().takeWhile { c -> c.isDigit() }.toIntOrNull() }
                  return Pair(p.getOrElse(0) { 12 }, p.getOrElse(1) { 3 })
              }
              fun analyzeBout(fighterA: String, recA: String, fighterB: String, recB: String, oddsText: String, weightClass: String): Triple<Int, Int, String> {
                  val (wA, lA) = parseWL(recA); val (wB, lB) = parseWL(recB)
                  val rA = wA.toDouble() / (wA + lA).coerceAtLeast(1)
                  val rB = wB.toDouble() / (wB + lB).coerceAtLeast(1)
                  var probA = ((rA / (rA + rB).coerceAtLeast(0.1)) * 100.0).roundToInt().coerceIn(32, 68)
                  val num = Regex("""([+-]\d{3,4})""").find(oddsText)?.groupValues?.getOrNull(1)?.toIntOrNull()
                  if (num != null) {
                      val imp = if (num < 0) (-num.toDouble()) / (-num + 100.0) else 100.0 / (num + 100.0)
                      val lAName = fighterA.substringAfterLast(" ").lowercase()
                      val lBName = fighterB.substringAfterLast(" ").lowercase()
                      val favA = oddsText.lowercase().contains(lAName) || (!oddsText.lowercase().contains(lBName) && num < 0)
                      val rawA = if (favA) (imp * 100).roundToInt() else (100 - (imp * 100).roundToInt())
                      probA = ((rawA * 0.75) + (probA * 0.25)).roundToInt().coerceIn(18, 86)
                  }
                  val probB = 100 - probA
                  val pick = if (probA >= probB) fighterA else fighterB
                  val best = maxOf(probA, probB)
                  val method = when {
                      best >= 68 && (weightClass.contains("Heavy", true) || weightClass.contains("Middle", true)) -> "KO/TKO"
                      best >= 65 -> "TKO or Submission"
                      else -> "Decision / Late Finish"
                  }
                  return Triple(probA, probB, "Pulse AI v2: $pick via $method ($best%)")
              }

              fun predictUpcomingBoutRounds(b: BoutDetail): List<RoundStat> {
                  val totalRounds = if (b.placement == "MAIN EVENT" || b.weightClass.contains("Title", true)) 5 else 3
                  val favIsA = b.probA >= b.probB
                  val favName = if (favIsA) b.fighterA else b.fighterB
                  val dogName = if (favIsA) b.fighterB else b.fighterA
                  val bestProb = maxOf(b.probA, b.probB)
                  val seed = abs((b.fighterA + b.fighterB + b.weightClass).hashCode())
                  val finishRound = if (bestProb >= 70) (totalRounds - 1).coerceAtLeast(2) else 0

                  return (1..totalRounds).map { r ->
                      val dogWinsSwingRound = (r == 2 && bestProb < 64)
                      val aWinsRd = if (dogWinsSwingRound) !favIsA else favIsA
                      val sigA = (if (aWinsRd) 21 else 15) + ((seed + r * 5) % 10)
                      val sigB = (if (!aWinsRd) 20 else 14) + ((seed + r * 9) % 10)
                      val attA = sigA + 18 + ((seed + r * 3) % 12)
                      val attB = sigB + 19 + ((seed + r * 7) % 12)
                      val tdA = if (aWinsRd && (seed + r) % 2 == 0) 1 + ((seed + r) % 2) else 0
                      val tdB = if (!aWinsRd && (seed + r) % 2 == 1) 1 else 0
                      val cSecA = if (aWinsRd) 85 + ((seed + r * 17) % 70) else 40 + ((seed + r * 11) % 45)
                      val cSecB = (230 - cSecA).coerceAtLeast(20)
                      val note = when {
                          finishRound > 0 && r == finishRound -> "AI FINISH WINDOW: $favName via TKO/Sub"
                          finishRound > 0 && r > finishRound -> "If Distance: 10 - 9 $favName"
                          dogWinsSwingRound -> "Projected 10 - 9 $dogName (Swing Rd)"
                          else -> "Projected 10 - 9 $favName"
                      }
                      RoundStat(
                          r, note, sigA, attA, sigB, attB, sigA + 9, sigB + 8, tdA, tdB,
                          "${cSecA / 60}:${(cSecA % 60).toString().padStart(2, '0')}",
                          "${cSecB / 60}:${(cSecB % 60).toString().padStart(2, '0')}"
                      )
                  }
              }

              fun buildRoundStats(fighter: String, pf: PastFight): List<RoundStat> {
                  val rMax = pf.round.coerceIn(1, 5)
                  val isWin = pf.result == "WIN"
                  val isKo = pf.method.contains("KO", true) || pf.method.contains("TKO", true)
                  val isSub = pf.method.contains("SUB", true)
                  val seed = abs((fighter + pf.opponent + pf.event + pf.dateYear).hashCode())
                  return (1..rMax).map { r ->
                      val isFinalFinish = (r == rMax) && (isKo || isSub)
                      val baseA = 15 + ((seed + r * 7) % 19) + (if (isWin) 7 else 0)
                      val baseB = 13 + ((seed + r * 11) % 17) + (if (!isWin) 7 else 0)
                      val attA = baseA + 14 + ((seed + r * 3) % 15)
                      val attB = baseB + 15 + ((seed + r * 5) % 15)
                      val tdA = if (isSub && isWin && r == rMax) 2 else ((seed + r) % 3)
                      val tdB = if (isSub && !isWin && r == rMax) 2 else ((seed + r * 2) % 2)
                      val cSecA = if (isWin) 92 + ((seed + r * 19) % 88) else 34 + ((seed + r * 13) % 58)
                      val cSecB = (240 - cSecA).coerceAtLeast(15)
                      val note = when {
                          isFinalFinish -> "STOPPAGE (${pf.method} • ${pf.time})"
                          isWin -> "10 - 9 $fighter"
                          pf.result == "LOSS" -> "10 - 9 ${pf.opponent}"
                          else -> "10 - 10 Even"
                      }
                      RoundStat(
                          r, note, baseA, attA, baseB, attB, baseA + 8, baseB + 7, tdA, tdB,
                          "${cSecA / 60}:${(cSecA % 60).toString().padStart(2, '0')}",
                          "${cSecB / 60}:${(cSecB % 60).toString().padStart(2, '0')}"
                      )
                  }
              }
          }

          object FaceImageLoader {
              private val cache = object : LruCache<String, ImageBitmap>(250) {}
              private val urlHints = mutableMapOf<String, String>()
              private val failed = mutableSetOf<String>()

              fun registerHint(name: String, id: String = "", url: String = "") {
                  val k = name.trim().lowercase()
                  if (url.isNotBlank()) urlHints[k] = url
                  else if (id.isNotBlank() && id != "0") urlHints[k] = "https://a.espncdn.com/i/headshots/mma/players/full/$id.png"
              }

              private fun conn(u: String) = (URL(u).openConnection() as HttpURLConnection).apply {
                  instanceFollowRedirects = true; connectTimeout = 6000; readTimeout = 6000
                  setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 17; SM-F971B) Chrome/131.0.0.0 Mobile")
              }

              private fun cropToFace(src: Bitmap): Bitmap {
                  val w = src.width; val h = src.height
                  if (w < 32 || h < 32) return src
                  var topY = 0; var foundTop = false
                  for (y in 0 until (h / 2) step 3) {
                      for (x in (w / 5) until (w * 4 / 5) step 4) {
                          if (((src.getPixel(x, y) ushr 24) and 0xFF) > 45) { topY = y; foundTop = true; break }
                      }
                      if (foundTop) break
                  }
                  val visH = (h - topY).coerceAtLeast(32)
                  val box = when {
                      h > (w * 1.15f) -> (visH * 0.33f).toInt()
                      w > (h * 1.15f) -> (visH * 0.74f).toInt()
                      else -> (visH * 0.68f).toInt()
                  }.coerceIn(40, minOf(w, h))
                  val sampleY = (topY + (box * 0.35f).toInt()).coerceIn(0, h - 1)
                  var sumX = 0L; var cntX = 0
                  for (x in 0 until w step 4) {
                      if (((src.getPixel(x, sampleY) ushr 24) and 0xFF) > 45) { sumX += x; cntX++ }
                  }
                  val cx = if (cntX > 4) (sumX / cntX).toInt() else (w / 2)
                  val cropX = (cx - (box / 2)).coerceIn(0, (w - box).coerceAtLeast(0))
                  val cropY = (topY - (box * 0.08f).toInt()).coerceIn(0, (h - box).coerceAtLeast(0))
                  return Bitmap.createBitmap(src, cropX, cropY, box, box)
              }

              suspend fun load(name: String): ImageBitmap? = withContext(Dispatchers.IO) {
                  val k = name.trim().lowercase()
                  cache.get(k)?.let { return@withContext it }
                  if (k in failed) return@withContext null
                  val urls = mutableListOf<String>()
                  urlHints[k]?.let { urls.add(it) }
                  try {
                      val c = conn("https://site.web.api.espn.com/apis/common/v3/search?query=${URLEncoder.encode(name, "UTF-8")}&limit=1&type=player&sport=mma")
                      if (c.responseCode in 200..299) {
                          val it = JSONObject(c.inputStream.bufferedReader().use { r -> r.readText() }).optJSONArray("items")?.optJSONObject(0)
                          val pid = it?.optString("id") ?: ""
                          if (pid.isNotBlank()) urls.add("https://a.espncdn.com/i/headshots/mma/players/full/$pid.png")
                          val img = it?.optJSONObject("image")?.optString("default") ?: ""
                          if (img.isNotBlank()) urls.add(img)
                      }
                      c.disconnect()
                  } catch (_: Throwable) {}
                  for (u in urls.distinct()) {
                      try {
                          val c = conn(u)
                          if (c.responseCode in 200..299) {
                              val raw = BitmapFactory.decodeStream(c.inputStream)
                              c.disconnect()
                              if (raw != null) {
                                  val face = cropToFace(raw).asImageBitmap()
                                  cache.put(k, face); return@withContext face
                              }
                          }
                          c.disconnect()
                      } catch (_: Throwable) {}
                  }
                  failed.add(k); null
              }
          }

          @Composable
          fun FighterAvatar(name: String, size: Dp = 56.dp, isChamp: Boolean = false) {
              var bmp by remember(name) { mutableStateOf<ImageBitmap?>(null) }
              LaunchedEffect(name) { bmp = FaceImageLoader.load(name) }
              val init = name.split(" ").mapNotNull { it.firstOrNull()?.uppercase() }.take(2).joinToString("")
              Box(
                  modifier = Modifier
                      .size(size)
                      .clip(CircleShape)
                      .background(Brush.radialGradient(listOf(Color(0xFF342438), Color(0xFF171722))))
                      .border(if (isChamp) 2.5.dp else 1.5.dp, if (isChamp) GoldGrad else CrimsonGrad, CircleShape),
                  contentAlignment = Alignment.Center
              ) {
                  if (bmp != null) Image(bmp!!, name, Modifier.fillMaxSize(), alignment = Alignment.Center, contentScale = ContentScale.Crop)
                  else Text(init, color = Color.White, fontSize = (size.value * 0.33f).sp, fontWeight = FontWeight.Black)
              }
          }

          @Composable
          fun AnimatedMmaPulseLogo() {
              val inf = rememberInfiniteTransition(label = "ecg_line_pulse")
              val ecgGlow by inf.animateFloat(
                  initialValue = 0.25f,
                  targetValue = 1.0f,
                  animationSpec = infiniteRepeatable(tween(650, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                  label = "ecg_glow"
              )
              val wavePhase by inf.animateFloat(
                  initialValue = 0f,
                  targetValue = 1f,
                  animationSpec = infiniteRepeatable(tween(1350, easing = LinearEasing), RepeatMode.Restart),
                  label = "ecg_wave"
              )

              Row(
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.Center,
                  modifier = Modifier
                      .clip(RoundedCornerShape(50))
                      .background(Brush.horizontalGradient(listOf(Color(0xFF28101A), Color(0xFF151524), Color(0xFF28101A))))
                      .border(1.2.dp, Color(0xFFFF1744).copy(alpha = 0.55f), RoundedCornerShape(50))
                      .padding(horizontal = 18.dp, vertical = 7.dp)
              ) {
                  Canvas(modifier = Modifier.size(44.dp, 22.dp)) {
                      val w = size.width; val h = size.height; val mid = h / 2f
                      val pts = listOf(
                          Offset(0f, mid),
                          Offset(w * 0.18f, mid),
                          Offset(w * 0.30f, h * 0.14f),
                          Offset(w * 0.44f, h * 0.88f),
                          Offset(w * 0.58f, h * 0.05f),
                          Offset(w * 0.72f, h * 0.78f),
                          Offset(w * 0.84f, mid),
                          Offset(w, mid)
                      )
                      val path = Path().apply {
                          moveTo(pts.first().x, pts.first().y)
                          pts.drop(1).forEach { lineTo(it.x, it.y) }
                      }
                      drawPath(path, color = Color(0xFFFF1744).copy(alpha = ecgGlow * 0.55f), style = Stroke(width = 4f + (ecgGlow * 7f), cap = StrokeCap.Round, join = StrokeJoin.Round))
                      drawPath(path, color = lerp(Color(0xFFFF1744), Color(0xFFFFD700), ecgGlow * 0.35f), style = Stroke(width = 3.5f + (ecgGlow * 2f), cap = StrokeCap.Round, join = StrokeJoin.Round))

                      val segCount = pts.size - 1
                      val exactPos = wavePhase * segCount
                      val idx = exactPos.toInt().coerceIn(0, segCount - 1)
                      val frac = exactPos - idx
                      val p1 = pts[idx]; val p2 = pts[idx + 1]
                      val cur = Offset(p1.x + (p2.x - p1.x) * frac, p1.y + (p2.y - p1.y) * frac)
                      drawLine(color = Color(0xFFFFD700), start = p1, end = cur, strokeWidth = 5.5f, cap = StrokeCap.Round)
                      drawCircle(color = Color(0xFFFFD700).copy(alpha = 0.45f), radius = 8f, center = cur)
                      drawCircle(color = Color.White, radius = 3.5f, center = cur)
                  }
                  Spacer(Modifier.width(10.dp))
                  Text("MMA", color = Color.White, fontSize = 19.sp, fontWeight = FontWeight.Black, letterSpacing = 1.sp)
                  Spacer(Modifier.width(4.dp))
                  Text("PULSE", color = Color(0xFFFF1744), fontSize = 19.sp, fontWeight = FontWeight.Black, letterSpacing = 1.sp)
              }
          }

