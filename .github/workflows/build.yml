          data class RoundStat(val roundNum: Int = 1, val scoreNote: String = "", val sigA: Int = 15, val sigAttA: Int = 25, val sigB: Int = 15, val sigAttB: Int = 25, val totA: Int = 20, val totB: Int = 20, val tdA: Int = 0, val tdB: Int = 0, val ctrlA: String = "1:00", val ctrlB: String = "1:00")
          data class UpcomingBooking(val opponent: String = "", val eventTitle: String = "", val dateTime: String = "", val venue: String = "", val weightClass: String = "", val placement: String = "", val liveOdds: String = "", val aiPick: String = "")
          data class FighterBio(val nationality: String = "", val height: String = "", val reach: String = "", val stance: String = "", val record: String = "", val nickname: String = "", val fights: List<PastFight> = emptyList())
          data class Fighter(
