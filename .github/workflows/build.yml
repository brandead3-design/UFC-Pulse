                                  Card(Modifier.fillMaxWidth().clickable { onSelectPastFight(h) }, shape = RoundedCornerShape(16.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF161622))) {
                                      Row(Modifier.padding(12.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                          Column(Modifier.weight(1f)) {
                                              Text("${h.result}: vs. ${h.opponent}", color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold)
                                              Text("${h.method} • ${h.event} (${h.dateYear})", color = Color(0xFFB0B0C0), fontSize = 11.sp)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

