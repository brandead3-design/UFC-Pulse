name: Build MMA Pulse APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate MMA Pulse Android 17 Project
        run: |
          rm -rf app settings.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/mma/pulse

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MMAPulse"
          include(":app")
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2"
              id("org.jetbrains.kotlin.android") version "1.9.24"
          }
          android {
              namespace = "com.mma.pulse"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.mma.pulse.pro"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 15
                  versionName = "15.0-OneUI-MMAPulse"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui:1.7.6")
              implementation("androidx.compose.foundation:foundation:1.7.6")
              implementation("androidx.compose.material3:material3:1.3.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/ic_popup_reminder"
                  android:label="MMA Pulse"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <property
                      android:name="android.window.PROPERTY_COMPAT_ALLOW_MIN_ASPECT_RATIO_OVERRIDE"
                      android:value="false" />
                  <activity
                      android:name=".MainActivity"
                      android:resizeableActivity="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|density|uiMode|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/mma/pulse/MainActivity.kt
          package com.mma.pulse

          import android.Manifest
          import android.app.*
          import android.content.*
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.net.Uri
          import android.os.*
          import android.util.LruCache
          import android.util.Xml
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.*
          import androidx.compose.foundation.lazy.grid.*
          import androidx.compose.foundation.shape.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.*
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.*
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.*
          import androidx.compose.ui.unit.*
          import androidx.compose.ui.window.*
          import androidx.core.app.ActivityCompat
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import androidx.core.view.*
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import org.xmlpull.v1.XmlPullParser
          import java.io.StringReader
          import java.net.*
          import java.time.*
          import java.time.format.DateTimeFormatter
          import java.util.Locale
          import kotlin.math.abs
          import kotlin.math.roundToInt

          data class NewsItem(val title: String, val source: String, val pubDate: String, val link: String, val summary: String)
          data class BoutDetail(
              val weightClass: String, val placement: String,
              val fighterA: String, val recordA: String, val idA: String,
              val fighterB: String, val recordB: String, val idB: String,
              val liveOdds: String, val probA: Int, val probB: Int,
              val prediction: String, val isCompleted: Boolean, val officialResult: String
          )
          data class MmaEvent(val id: String, val title: String, val type: String, val localTime: String, val venue: String, val isCompleted: Boolean, val bouts: List<BoutDetail>)
          data class PastFight(val result: String, val opponent: String, val method: String, val event: String)
          data class Fighter(
              val id: String, val name: String, val nickname: String, val division: String, val code: String,
              val record: String, val nationality: String, val rankLabel: String, val isChamp: Boolean = false,
              val mensP4p: Int = 0, val womensP4p: Int = 0, val headshotUrl: String = ""
          )
          data class LiveMatchState(
              val eventTitle: String, val weightClass: String,
              val fighterA: String, val recordA: String, val oddsA: String, val probA: Int,
              val fighterB: String, val recordB: String, val oddsB: String, val probB: Int,
              val round: String, val time: String, val status: String, val prediction: String, val isEventOver: Boolean
          )

          fun openUrl(ctx: Context, url: String) {
              try { ctx.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(if (url.startsWith("http")) url else "https://www.espn.com/mma/")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) } catch (_: Throwable) {}
          }

          fun fmtLocal(utcIso: String): String = try {
              ZonedDateTime.parse(utcIso).withZoneSameInstant(ZoneId.systemDefault())
                  .format(DateTimeFormatter.ofPattern("EEE, MMM d • h:mm a z", Locale.getDefault()))
          } catch (_: Throwable) { utcIso.take(10) }

          // --- PULSE AI v2 STATISTICAL & IMPLIED-PROBABILITY ENGINE ---
          object PulseAiEngine {
              private fun parseWinsLosses(rec: String): Pair<Int, Int> {
                  val parts = rec.split("-").mapNotNull { it.trim().takeWhile { c -> c.isDigit() }.toIntOrNull() }
                  return Pair(parts.getOrElse(0) { 12 }, parts.getOrElse(1) { 3 })
              }
              fun analyzeBout(fighterA: String, recA: String, fighterB: String, recB: String, oddsText: String, weightClass: String): Triple<Int, Int, String> {
                  val (wA, lA) = parseWinsLosses(recA)
                  val (wB, lB) = parseWinsLosses(recB)
                  val rateA = wA.toDouble() / (wA + lA).coerceAtLeast(1)
                  val rateB = wB.toDouble() / (wB + lB).coerceAtLeast(1)
                  var probA = ((rateA / (rateA + rateB).coerceAtLeast(0.1)) * 100.0).roundToInt().coerceIn(30, 70)

                  val numMatch = Regex("""([+-]\d{3,4})""").find(oddsText)?.groupValues?.getOrNull(1)?.toIntOrNull()
                  if (numMatch != null) {
                      val implied = if (numMatch < 0) (-numMatch.toDouble()) / (-numMatch + 100.0) else 100.0 / (numMatch + 100.0)
                      val lastA = fighterA.substringAfterLast(" ").lowercase()
                      val lastB = fighterB.substringAfterLast(" ").lowercase()
                      val favIsA = oddsText.lowercase().contains(lastA) || (!oddsText.lowercase().contains(lastB) && numMatch < 0)
                      val rawProbA = if (favIsA) (implied * 100).roundToInt() else (100 - (implied * 100).roundToInt())
                      probA = ((rawProbA * 0.75) + (probA * 0.25)).roundToInt().coerceIn(18, 86)
                  }
                  val probB = 100 - probA
                  val pick = if (probA >= probB) fighterA else fighterB
                  val bestProb = maxOf(probA, probB)
                  val isHeavy = weightClass.contains("Heavy", true) || weightClass.contains("Middle", true)
                  val method = when {
                      bestProb >= 68 && isHeavy -> "KO/TKO"
                      bestProb >= 66 -> "TKO or Submission"
                      else -> "Decision / Late Finish"
                  }
                  return Triple(probA, probB, "Pulse AI v2: $pick via $method ($bestProb%)")
              }
          }

          // --- SMART FACE-DETECTION AVATAR LOADER (NO CHEST CROPPING) ---
          object FaceImageLoader {
              private val cache = object : LruCache<String, ImageBitmap>(220) {}
              private val urlHints = mutableMapOf<String, String>()
              private val failed = mutableSetOf<String>()

              fun registerHint(name: String, id: String = "", url: String = "") {
                  val k = name.trim().lowercase()
                  if (url.isNotBlank()) urlHints[k] = url
                  else if (id.isNotBlank() && id != "0") urlHints[k] = "https://a.espncdn.com/i/headshots/mma/players/full/$id.png"
              }

              private fun conn(u: String) = (URL(u).openConnection() as HttpURLConnection).apply {
                  instanceFollowRedirects = true; connectTimeout = 6000; readTimeout = 6000
                  setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 17; SM-F971B) Chrome/131.0.0.0 Mobile")
              }

              // Scans bitmap for top of fighter's head & crops tightly around the face
              private fun cropToFace(src: Bitmap): Bitmap {
                  val w = src.width; val h = src.height
                  if (w < 32 || h < 32) return src
                  var topY = 0
                  var foundTop = false
                  for (y in 0 until (h / 2) step 3) {
                      for (x in (w / 5) until (w * 4 / 5) step 4) {
                          val p = src.getPixel(x, y)
                          val alpha = (p ushr 24) and 0xFF
                          if (alpha > 45) { topY = y; foundTop = true; break }
                      }
                      if (foundTop) break
                  }
                  val visibleH = (h - topY).coerceAtLeast(32)
                  // Full-body shots have h > w: head is top 32% of visible height. Headshots have w >= h: face is top 70%.
                  val boxSize = when {
                      h > (w * 1.15f) -> (visibleH * 0.33f).toInt()
                      w > (h * 1.15f) -> (visibleH * 0.74f).toInt()
                      else -> (visibleH * 0.68f).toInt()
                  }.coerceIn(40, minOf(w, h))

                  val sampleY = (topY + (boxSize * 0.35f).toInt()).coerceIn(0, h - 1)
                  var sumX = 0L; var countX = 0
                  for (x in 0 until w step 4) {
                      if (((src.getPixel(x, sampleY) ushr 24) and 0xFF) > 45) { sumX += x; countX++ }
                  }
                  val centerX = if (countX > 4) (sumX / countX).toInt() else (w / 2)
                  val cropX = (centerX - (boxSize / 2)).coerceIn(0, (w - boxSize).coerceAtLeast(0))
                  val padTop = (boxSize * 0.08f).toInt()
                  val cropY = (topY - padTop).coerceIn(0, (h - boxSize).coerceAtLeast(0))
                  return Bitmap.createBitmap(src, cropX, cropY, boxSize, boxSize)
              }

              suspend fun load(name: String): ImageBitmap? = withContext(Dispatchers.IO) {
                  val k = name.trim().lowercase()
                  cache.get(k)?.let { return@withContext it }
                  if (k in failed) return@withContext null

                  val candidates = mutableListOf<String>()
                  urlHints[k]?.let { candidates.add(it) }
                  try {
                      val c = conn("https://site.web.api.espn.com/apis/common/v3/search?query=${URLEncoder.encode(name, "UTF-8")}&limit=1&type=player&sport=mma")
                      if (c.responseCode in 200..299) {
                          val it = JSONObject(c.inputStream.bufferedReader().use { r -> r.readText() }).optJSONArray("items")?.optJSONObject(0)
                          val pid = it?.optString("id") ?: ""
                          if (pid.isNotBlank()) candidates.add("https://a.espncdn.com/i/headshots/mma/players/full/$pid.png")
                          val img = it?.optJSONObject("image")?.optString("default") ?: ""
                          if (img.isNotBlank()) candidates.add(img)
                      }
                      c.disconnect()
                  } catch (_: Throwable) {}

                  for (u in candidates.distinct()) {
                      try {
                          val c = conn(u)
                          if (c.responseCode in 200..299) {
                              val raw = BitmapFactory.decodeStream(c.inputStream)
                              c.disconnect()
                              if (raw != null) {
                                  val face = cropToFace(raw).asImageBitmap()
                                  cache.put(k, face)
                                  return@withContext face
                              }
                          }
                          c.disconnect()
                      } catch (_: Throwable) {}
                  }
                  failed.add(k); null
              }
          }

          @Composable
          fun FighterAvatar(name: String, size: Dp = 56.dp, isChamp: Boolean = false) {
              var bmp by remember(name) { mutableStateOf<ImageBitmap?>(null) }
              LaunchedEffect(name) { bmp = FaceImageLoader.load(name) }
              val init = name.split(" ").mapNotNull { it.firstOrNull()?.uppercase() }.take(2).joinToString("")
              Box(
                  modifier = Modifier
                      .size(size)
                      .clip(CircleShape)
                      .background(Color(0xFF232330))
                      .border(if (isChamp) 2.5.dp else 1.5.dp, if (isChamp) Color(0xFFFFD700) else Color(0xFFE51937), CircleShape),
                  contentAlignment = Alignment.Center
              ) {
                  if (bmp != null) {
                      Image(bmp!!, name, Modifier.fillMaxSize(), alignment = Alignment.Center, contentScale = ContentScale.Crop)
                  } else {
                      Text(init, color = Color.White, fontSize = (size.value * 0.33f).sp, fontWeight = FontWeight.Black)
                  }
              }
          }

          // --- LIVE MULTI-ENDPOINT REPOSITORY (RANKINGS + FULL CARDS + FULL ROSTER + CAREER LOGS) ---
          object MmaRepository {
              private fun httpGet(u: String): String = try {
                  val c = (URL(u).openConnection() as HttpURLConnection).apply {
                      instanceFollowRedirects = true; connectTimeout = 7000; readTimeout = 7000
                      setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 17; SM-F971B) Chrome/131.0.0.0 Mobile")
                  }
                  if (c.responseCode in 200..299) c.inputStream.bufferedReader().use { it.readText() } else ""
              } catch (_: Throwable) { "" }

              fun mapDivCode(divName: String): String {
                  val d = divName.lowercase()
                  return when {
                      d.contains("women") -> "WMMA"
                      d.contains("light heavyweight") -> "LHW"
                      d.contains("heavyweight") -> "HW"
                      d.contains("middleweight") -> "MW"
                      d.contains("welterweight") -> "WW"
                      d.contains("lightweight") -> "LW"
                      d.contains("featherweight") -> "FW"
                      d.contains("bantamweight") -> "BW"
                      d.contains("flyweight") -> "FLW"
                      else -> "MMA"
                  }
              }

              private fun parseCompetitionToBout(comp: JSONObject, idx: Int, total: Int): BoutDetail? {
                  val competitors = comp.optJSONArray("competitors") ?: return null
                  if (competitors.length() < 2) return null
                  val c1 = competitors.getJSONObject(0)
                  val c2 = competitors.getJSONObject(1)
                  val a1 = c1.optJSONObject("athlete")
                  val a2 = c2.optJSONObject("athlete")
                  val n1 = a1?.optString("displayName")?.takeIf { it.isNotBlank() } ?: "Fighter A"
                  val n2 = a2?.optString("displayName")?.takeIf { it.isNotBlank() } ?: "Fighter B"
                  val id1 = a1?.optString("id") ?: ""
                  val id2 = a2?.optString("id") ?: ""
                  FaceImageLoader.registerHint(n1, id1, a1?.optJSONObject("headshot")?.optString("href") ?: "")
                  FaceImageLoader.registerHint(n2, id2, a2?.optJSONObject("headshot")?.optString("href") ?: "")

                  val r1 = c1.optJSONArray("records")?.optJSONObject(0)?.optString("summary") ?: "12-3-0"
                  val r2 = c2.optJSONArray("records")?.optJSONObject(0)?.optString("summary") ?: "11-4-0"
                  val wc = comp.optJSONObject("type")?.optString("text")?.takeIf { it.isNotBlank() } ?: "MMA Bout"
                  val seg = comp.optJSONObject("cardSegment")?.optString("description") ?: ""
                  val placement = when {
                      idx == 0 -> "MAIN EVENT"
                      idx == 1 -> "CO-MAIN EVENT"
                      seg.contains("Main", true) || idx < 5 -> "MAIN CARD"
                      seg.contains("Early", true) || idx >= total - 3 -> "EARLY PRELIMS"
                      else -> "PRELIMS"
                  }
                  val st = comp.optJSONObject("status")
                  val stType = st?.optJSONObject("type")
                  val completed = stType?.optBoolean("completed", false) ?: false
                  val detail = stType?.optString("detail") ?: "Scheduled"
                  val rd = st?.optInt("period", 3) ?: 3
                  val clk = st?.optString("displayClock", "5:00") ?: "5:00"
                  val w1 = c1.optBoolean("winner", false)
                  val w2 = c2.optBoolean("winner", false)

                  val oddsStr = comp.optJSONArray("odds")?.optJSONObject(0)?.optString("details")?.takeIf { it.isNotBlank() } ?: "Live Line Even"
                  val (pA, pB, aiText) = PulseAiEngine.analyzeBout(n1, r1, n2, r2, oddsStr, wc)
                  val official = when {
                      w1 -> "WINNER: $n1 ($detail • R$rd $clk)"
                      w2 -> "WINNER: $n2 ($detail • R$rd $clk)"
                      completed -> "Official Result: $detail"
                      else -> ""
                  }
                  return BoutDetail(wc, placement, n1, r1, id1, n2, r2, id2, oddsStr, pA, pB, aiText, completed, official)
              }

              suspend fun syncAllMmaData(): Triple<LiveMatchState, List<MmaEvent>, List<Fighter>> = withContext(Dispatchers.IO) {
                  val rosterMap = LinkedHashMap<String, Fighter>()
                  val eventsList = mutableListOf<MmaEvent>()
                  var liveOrRecentMatch: LiveMatchState? = null
                  var nextPreviewMatch: LiveMatchState? = null

                  // 1. Fetch Official Rankings (Men's P4P, Women's P4P, All Champions & Top 15 in Every Weight Class)
                  try {
                      val rkJson = httpGet("https://site.api.espn.com/apis/site/v2/sports/mma/ufc/rankings")
                      if (rkJson.isNotBlank()) {
                          val groups = JSONObject(rkJson).optJSONArray("rankings")
                          if (groups != null) {
                              for (i in 0 until groups.length()) {
                                  val g = groups.getJSONObject(i)
                                  val gName = g.optString("name", "")
                                  val isMensP4p = gName.contains("Men's Pound", true) || (gName.contains("Pound", true) && !gName.contains("Women", true))
                                  val isWomensP4p = gName.contains("Women's Pound", true)
                                  val divCode = mapDivCode(gName)

                                  val ranks = g.optJSONArray("ranks")
                                  if (ranks != null) {
                                      for (j in 0 until ranks.length()) {
                                          val rObj = ranks.getJSONObject(j)
                                          val rankNum = rObj.optInt("current", j + 1)
                                          val rec = rObj.optString("recordSummary", "18-3-0")
                                          val ath = rObj.optJSONObject("athlete") ?: continue
                                          val id = ath.optString("id", "")
                                          val name = ath.optString("displayName", "").trim()
                                          if (name.isBlank()) continue
                                          val nick = ath.optString("nickname", "MMA Pro")
                                          val nat = ath.optJSONObject("flag")?.optString("alt") ?: ath.optString("citizenship", "International")
                                          val head = ath.optJSONObject("headshot")?.optString("href") ?: ""
                                          FaceImageLoader.registerHint(name, id, head)

                                          val existing = rosterMap[name.lowercase()]
                                          if (existing != null) {
                                              rosterMap[name.lowercase()] = existing.copy(
                                                  mensP4p = if (isMensP4p) rankNum else existing.mensP4p,
                                                  womensP4p = if (isWomensP4p) rankNum else existing.womensP4p,
                                                  division = if (!isMensP4p && !isWomensP4p) gName else existing.division,
                                                  code = if (!isMensP4p && !isWomensP4p) divCode else existing.code,
                                                  rankLabel = if (!isMensP4p && !isWomensP4p) "#$rankNum $divCode" else existing.rankLabel,
                                                  isChamp = existing.isChamp || (!isMensP4p && !isWomensP4p && rankNum == 0)
                                              )
                                          } else {
                                              rosterMap[name.lowercase()] = Fighter(
                                                  id = id, name = name, nickname = nick,
                                                  division = if (isMensP4p || isWomensP4p) "Pound-for-Pound" else gName,
                                                  code = if (isMensP4p) "LW" else if (isWomensP4p) "WMMA" else divCode,
                                                  record = rec, nationality = nat,
                                                  rankLabel = if (isMensP4p) "#$rankNum Men's P4P" else if (isWomensP4p) "#$rankNum Women's P4P" else "#$rankNum $divCode",
                                                  isChamp = rankNum == 0,
                                                  mensP4p = if (isMensP4p) rankNum else 0,
                                                  womensP4p = if (isWomensP4p) rankNum else 0,
                                                  headshotUrl = head
                                              )
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  } catch (_: Throwable) {}

                  // 2. Fetch Wide Scoreboard Window (Full Event Cards + Active Roster Athletes)
                  try {
                      val fmt = DateTimeFormatter.ofPattern("yyyyMMdd")
                      val start = LocalDate.now().minusDays(120).format(fmt)
                      val end = LocalDate.now().plusDays(95).format(fmt)
                      val sbJson = httpGet("https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard?dates=$start-$end")
                      if (sbJson.isNotBlank()) {
                          val evArr = JSONObject(sbJson).optJSONArray("events")
                          if (evArr != null) {
                              val recentCutoff = LocalDate.now().minusDays(7)
                              for (i in 0 until evArr.length()) {
                                  val ev = evArr.getJSONObject(i)
                                  val evId = ev.optString("id", "$i")
                                  val evName = ev.optString("name", "MMA Event")
                                  val evDateStr = ev.optString("date", "")
                                  val evLocalDate = try { LocalDate.parse(evDateStr.take(10)) } catch (_: Throwable) { LocalDate.now() }
                                  val isCompleted = ev.optJSONObject("status")?.optJSONObject("type")?.optBoolean("completed", false) ?: evLocalDate.isBefore(LocalDate.now())

                                  val comps = ev.optJSONArray("competitions") ?: continue
                                  val rawComps = mutableListOf<JSONObject>()
                                  for (j in 0 until comps.length()) rawComps.add(comps.getJSONObject(j))

                                  // Harvest every fighter into the full Roster
                                  for (comp in rawComps) {
                                      val wc = comp.optJSONObject("type")?.optString("text") ?: "Lightweight"
                                      val dCode = mapDivCode(wc)
                                      val cArr = comp.optJSONArray("competitors") ?: continue
                                      for (k in 0 until cArr.length()) {
                                          val cObj = cArr.getJSONObject(k)
                                          val ath = cObj.optJSONObject("athlete") ?: continue
                                          val fName = ath.optString("displayName", "").trim()
                                          if (fName.isBlank()) continue
                                          val fId = ath.optString("id", "")
                                          val fNat = ath.optJSONObject("flag")?.optString("alt") ?: "MMA Roster"
                                          val fRec = cObj.optJSONArray("records")?.optJSONObject(0)?.optString("summary") ?: "14-4-0"
                                          FaceImageLoader.registerHint(fName, fId, ath.optJSONObject("headshot")?.optString("href") ?: "")
                                          if (!rosterMap.containsKey(fName.lowercase())) {
                                              rosterMap[fName.lowercase()] = Fighter(fId, fName, "Active Roster", wc, dCode, fRec, fNat, dCode)
                                          }
                                      }
                                  }

                                  // Keep recent completed (last 7 days) + all upcoming events for Events Tab
                                  if (evLocalDate.isBefore(recentCutoff)) continue

                                  // Order bouts so Main Event is first (index 0) down to Early Prelims
                                  val lastCompNames = rawComps.lastOrNull()?.optJSONArray("competitors")?.let {
                                      (it.optJSONObject(0)?.optJSONObject("athlete")?.optString("lastName") ?: "") + " " +
                                          (it.optJSONObject(1)?.optJSONObject("athlete")?.optString("lastName") ?: "")
                                  } ?: ""
                                  val orderedComps = if (rawComps.size > 1 && lastCompNames.split(" ").any { it.length > 2 && evName.contains(it, true) }) {
                                      rawComps.reversed()
                                  } else rawComps

                                  val bouts = orderedComps.mapIndexedNotNull { idx, c -> parseCompetitionToBout(c, idx, orderedComps.size) }
                                  val venue = orderedComps.firstOrNull()?.optJSONObject("venue")?.optString("fullName") ?: "MMA Arena"
                                  val evType = when {
                                      isCompleted -> "COMPLETED"
                                      evName.contains(Regex("UFC \\d+")) -> "PPV"
                                      else -> "FIGHT NIGHT"
                                  }
                                  if (bouts.isNotEmpty()) {
                                      val eventObj = MmaEvent(
                                          id = evId, title = evName, type = evType,
                                          localTime = if (isCompleted) "COMPLETED • ${evDateStr.take(10)} (${bouts.size} Bouts)" else "${fmtLocal(evDateStr)} • ${bouts.size} Bouts",
                                          venue = venue, isCompleted = isCompleted, bouts = bouts
                                      )
                                      eventsList.add(eventObj)
                                      val main = bouts.first()
                                      if (isCompleted) {
                                          liveOrRecentMatch = LiveMatchState(
                                              evName, "${main.weightClass} Main Event • OFFICIAL FINAL",
                                              main.fighterA, main.recordA, main.liveOdds, if (main.officialResult.contains(main.fighterA)) 100 else 0,
                                              main.fighterB, main.recordB, "Final", if (main.officialResult.contains(main.fighterB)) 100 else 0,
                                              "FINAL", "Official", main.officialResult.ifBlank { "Event Concluded" },
                                              "Event Completed • Live Predictions Locked", true
                                          )
                                      } else if (nextPreviewMatch == null) {
                                          nextPreviewMatch = LiveMatchState(
                                              evName, "${main.weightClass} Main Event • 5 Rounds",
                                              main.fighterA, main.recordA, main.liveOdds, main.probA,
                                              main.fighterB, main.recordB, "Live Odds", main.probB,
                                              "PRE-FIGHT", "5:00", "Upcoming Main Event ($venue). Tap Simulate Round below to test Pulse AI v2.",
                                              main.prediction, false
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  } catch (_: Throwable) {}

                  val finalLive = liveOrRecentMatch ?: nextPreviewMatch ?: LiveMatchState(
                      "MMA Fight Night: Moicano vs. Nolan", "Lightweight Main Event • OFFICIAL FINAL",
                      "Tom Nolan", "12-1-0", "+140 Winner", 100, "Renato Moicano", "21-8-1", "-165", 0,
                      "FINAL (R3)", "1:28", "WINNER: Tom Nolan def. Renato Moicano via TKO (Elbows & Punches) at 1:28 of Round 3.",
                      "Event Completed • Live Predictions Locked", true
                  )
                  Triple(finalLive, eventsList, rosterMap.values.toList())
              }

              // Fetches full event summary if ESPN scoreboard had partial bouts
              suspend fun fetchFullEventBouts(event: MmaEvent): List<BoutDetail> = withContext(Dispatchers.IO) {
                  if (event.bouts.size >= 10 || event.id.isBlank()) return@withContext event.bouts
                  try {
                      val sumJson = httpGet("https://site.api.espn.com/apis/site/v2/sports/mma/ufc/summary?event=${event.id}")
                      val comps = JSONObject(sumJson).optJSONObject("header")?.optJSONArray("competitions")
                      if (comps != null && comps.length() > event.bouts.size) {
                          val list = mutableListOf<JSONObject>()
                          for (i in 0 until comps.length()) list.add(comps.getJSONObject(i))
                          val parsed = list.reversed().mapIndexedNotNull { idx, c -> parseCompetitionToBout(c, idx, list.size) }
                          if (parsed.isNotEmpty()) return@withContext parsed
                      }
                  } catch (_: Throwable) {}
                  event.bouts
              }

              // Live Search across all 700+ UFC Roster Fighters via ESPN Search API
              suspend fun searchLiveFighters(query: String): List<Fighter> = withContext(Dispatchers.IO) {
                  if (query.trim().length < 2) return@withContext emptyList()
                  val results = mutableListOf<Fighter>()
                  try {
                      val q = URLEncoder.encode(query.trim(), "UTF-8")
                      val json = httpGet("https://site.web.api.espn.com/apis/common/v3/search?query=$q&limit=25&type=player&sport=mma")
                      val items = JSONObject(json).optJSONArray("items")
                      if (items != null) {
                          for (i in 0 until items.length()) {
                              val it = items.getJSONObject(i)
                              val id = it.optString("id", "")
                              val name = it.optString("displayName", "").trim()
                              if (name.isBlank()) continue
                              val sub = it.optString("subtitle", "MMA Roster")
                              val img = it.optJSONObject("image")?.optString("default") ?: ""
                              FaceImageLoader.registerHint(name, id, img)
                              results.add(Fighter(id, name, "MMA Pro", sub, mapDivCode(sub), "Active Pro", "UFC / MMA Roster", "Roster"))
                          }
                      }
                  } catch (_: Throwable) {}
                  results
              }

              // Fetches Complete Pro Career Fight History from Sherdog / Wikipedia
              suspend fun fetchCareerHistory(name: String): Pair<String, List<PastFight>> = withContext(Dispatchers.IO) {
                  val fights = mutableListOf<PastFight>()
                  var meta = ""
                  try {
                      val sHtml = httpGet("https://www.sherdog.com/stats/fightfinder?SearchTxt=${URLEncoder.encode(name, "UTF-8")}")
                      val fPath = Regex("""href=["'](/fighter/[^"']+)["']""").find(sHtml)?.groupValues?.getOrNull(1)
                      if (!fPath.isNullOrBlank()) {
                          val pHtml = httpGet("https://www.sherdog.com$fPath")
                          val nat = Regex("""itemprop=["']nationality["'][^>]*>([^<]+)<""").find(pHtml)?.groupValues?.getOrNull(1)?.trim() ?: ""
                          val ht = Regex("""Height\s*<strong[^>]*>([^<]+)<""").find(pHtml)?.groupValues?.getOrNull(1)?.trim() ?: ""
                          if (nat.isNotBlank() || ht.isNotBlank()) meta = "$nat • Height: $ht"
                          val rowRx = Regex("""<tr[^>]*>.*?<span class=["']final_result\s+[^"']*["']>\s*(win|loss|draw|nc)\s*</span>.*?<a href=["']/fighter/[^"']+["']>([^<]+)</a>.*?<a href=["']/events/[^"']+["']>(.*?)</a>.*?<b>(.*?)</b>.*?<td>(\d+)</td>\s*<td>([0-9:]+)</td>""", setOf(RegexOption.IGNORE_CASE, RegexOption.DOT_MATCHES_ALL))
                          for (m in rowRx.findAll(pHtml)) {
                              fights.add(PastFight(m.groupValues[1].uppercase(), m.groupValues[2].trim(), "${m.groupValues[4].replace(Regex("<.*?>"), "").trim()} (R${m.groupValues[5]} ${m.groupValues[6]})", m.groupValues[3].replace(Regex("<.*?>"), "").trim()))
                          }
                      }
                  } catch (_: Throwable) {}
                  Pair(meta, fights)
              }

              suspend fun fetchNews(): List<NewsItem> = withContext(Dispatchers.IO) {
                  val out = mutableListOf<NewsItem>()
                  try {
                      val arr = JSONObject(httpGet("https://site.api.espn.com/apis/site/v2/sports/mma/ufc/news")).optJSONArray("articles")
                      if (arr != null) for (i in 0 until arr.length()) {
                          val a = arr.getJSONObject(i)
                          val h = a.optString("headline").trim()
                          if (h.isNotBlank()) out.add(NewsItem(h, "ESPN MMA", a.optString("published").take(16).replace("T", " "), a.optJSONObject("links")?.optJSONObject("web")?.optString("href") ?: "https://www.espn.com/mma/", a.optString("description").trim()))
                      }
                  } catch (_: Throwable) {}
                  try {
                      val xml = httpGet("https://www.sherdog.com/rss/news.xml")
                      if (xml.isNotBlank()) {
                          val xp = Xml.newPullParser().apply { setInput(StringReader(xml)) }
                          var ev = xp.eventType; var inIt = false; var t = ""; var l = ""; var d = ""
                          while (ev != XmlPullParser.END_DOCUMENT) {
                              val n = xp.name ?: ""
                              if (ev == XmlPullParser.START_TAG) {
                                  if (n.equals("item", true)) { inIt = true; t = ""; l = ""; d = "" }
                                  else if (inIt && n.equals("title", true)) t = try { xp.nextText().trim() } catch (_: Throwable) { "" }
                                  else if (inIt && n.equals("link", true)) l = try { xp.nextText().trim() } catch (_: Throwable) { "" }
                                  else if (inIt && n.equals("description", true)) d = try { xp.nextText().replace(Regex("<.*?>"), "").trim() } catch (_: Throwable) { "" }
                              } else if (ev == XmlPullParser.END_TAG && n.equals("item", true) && inIt) {
                                  if (t.isNotBlank()) out.add(NewsItem(t, "Sherdog MMA", "Latest", l.ifBlank { "https://www.sherdog.com" }, d))
                                  inIt = false
                              }
                              ev = xp.next()
                          }
                      }
                  } catch (_: Throwable) {}
                  out
              }
          }

