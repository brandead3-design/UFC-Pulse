name: Build UFC Pulse Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify and Auto-Fix Source File Locations
        run: |
          mkdir -p app/src/main/java/com/ufc/pulse
          found_kt=$(find . -maxdepth 6 -iname "*MainActivity*" -not -path "./app/src/main/java/com/ufc/pulse/MainActivity.kt" | head -n 1)
          if [ -n "$found_kt" ] && [ ! -f "app/src/main/java/com/ufc/pulse/MainActivity.kt" ]; then
            cp "$found_kt" app/src/main/java/com/ufc/pulse/MainActivity.kt
          fi
          found_manifest=$(find . -maxdepth 5 -iname "*AndroidManifest*" -not -path "./app/src/main/AndroidManifest.xml" | head -n 1)
          if [ -n "$found_manifest" ] && [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            cp "$found_manifest" app/src/main/AndroidManifest.xml
          fi
          test -f app/src/main/java/com/ufc/pulse/MainActivity.kt
          test -f app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon -Pandroid.useAndroidX=true -Pandroid.nonTransitiveRClass=true

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: UFC-Pulse-Pro-Fixed-APK
          path: app/build/outputs/apk/debug/app-debug.apk
