          @Composable
          fun FighterProfileModal(f: Fighter, upcoming: UpcomingBooking?, onDismiss: () -> Unit, onSelectPastFight: (PastFight) -> Unit) {
              var bio by remember(f.name) { mutableStateOf(FighterBio(f.nationality, "5'10\"", "72\"", "Orthodox", f.record, f.nickname, emptyList())) }
              var loading by remember(f.name) { mutableStateOf(true) }

              LaunchedEffect(f.name) {
                  loading = true
                  bio = MmaRepository.fetchFighterBioAndHistory(f)
                  loading = false
              }

              Dialog(onDismissRequest = onDismiss, properties = DialogProperties(usePlatformDefaultWidth = false)) {
                  Card(Modifier.fillMaxWidth(0.95f).fillMaxHeight(0.90f).border(1.5.dp, Color(0xFFFF1744), RoundedCornerShape(26.dp)), shape = RoundedCornerShape(26.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF0F0F18))) {
                      Column(Modifier.fillMaxSize().padding(18.dp)) {
                          Row(Modifier.fillMaxWidth().clip(RoundedCornerShape(20.dp)).background(HeroGrad).padding(14.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                              Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.weight(1f)) {
                                  FighterAvatar(f.name, 74.dp, f.isChamp)
                                  Spacer(Modifier.width(12.dp))
                                  Column {
                                      Text(f.name, color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Black)
                                      Text("${flagFor(bio.nationality)} ${bio.nationality} • ${f.division}", color = Color(0xFFFFD700), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                  }
                              }
                              Button(onClick = onDismiss, shape = RoundedCornerShape(50), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF28283A))) {
                                  Text("Close", color = Color.White, fontSize = 12.sp)
                              }
                          }
                          Spacer(Modifier.height(10.dp))
                          if (upcoming != null) {
                              Card(Modifier.fillMaxWidth(), shape = RoundedCornerShape(14.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF10241E))) {
                                  Column(Modifier.padding(12.dp)) {
                                      Text("🥊 CONFIRMED UPCOMING FIGHT", color = Color(0xFF00E676), fontSize = 11.sp, fontWeight = FontWeight.Black)
                                      Text("vs. ${upcoming.opponent} (${upcoming.eventTitle})", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                                  }
                              }
                              Spacer(Modifier.height(10.dp))
                          }
                          Text(if (loading) "Syncing career history..." else "Career History (${bio.fights.size} Bouts)", color = Color(0xFFFFD700), fontSize = 12.sp, fontWeight = FontWeight.Black)
                          Spacer(Modifier.height(6.dp))
                          if (loading) LinearProgressIndicator(Modifier.fillMaxWidth(), color = Color(0xFFFF1744))
                          LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.weight(1f)) {
