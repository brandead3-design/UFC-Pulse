name: Build MMA Pulse APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate Project
        run: |
          rm -rf app settings.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/mma/pulse app/src/main/res/drawable
          cat << 'END_KOTLIN' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MMAPulse"
          include(":app")
          END_KOTLIN
          cat << 'END_KOTLIN' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          END_KOTLIN
          cat << 'END_KOTLIN' > app/build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2"
              id("org.jetbrains.kotlin.android") version "1.9.24"
          }
          android {
              namespace = "com.mma.pulse"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.mma.pulse.pro"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 70
                  versionName = "25.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.animation:animation-core:1.7.6")
              implementation("androidx.compose.ui:ui:1.7.6")
              implementation("androidx.compose.foundation:foundation:1.7.6")
              implementation("androidx.compose.material3:material3:1.3.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          END_KOTLIN
          cat << 'END_KOTLIN' > app/src/main/res/drawable/ic_mma_pulse.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
          <path android:fillColor="#080810" android:pathData="M0,0h108v108h-108z"/>
          <path android:fillColor="#181224" android:strokeColor="#FF1744" android:strokeWidth="3.5" android:pathData="M36,12 L72,12 L96,36 L96,72 L72,96 L36,96 L12,72 L12,36 Z"/>
          </vector>
          END_KOTLIN
          cat << 'END_KOTLIN' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:icon="@drawable/ic_mma_pulse"
                  android:label="MMA Pulse"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          END_KOTLIN
          cat << 'END_KOTLIN' > app/src/main/java/com/mma/pulse/MainActivity.kt
          package com.mma.pulse

