name: Build MMA Pulse APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate MMA Pulse Android 17 Project
        run: |
          rm -rf app settings.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/mma/pulse app/src/main/res/drawable

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MMAPulse"
          include(":app")
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2"
              id("org.jetbrains.kotlin.android") version "1.9.24"
          }
          android {
              namespace = "com.mma.pulse"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.mma.pulse.pro"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 26
                  versionName = "19.2-BranDEAD-Pro"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.animation:animation-core:1.7.6")
              implementation("androidx.compose.ui:ui:1.7.6")
              implementation("androidx.compose.foundation:foundation:1.7.6")
              implementation("androidx.compose.material3:material3:1.3.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_mma_pulse.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#080810" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#181224" android:strokeColor="#FF1744" android:strokeWidth="3.5" android:pathData="M36,12 L72,12 L96,36 L96,72 L72,96 L36,96 L12,72 L12,36 Z"/>
              <path android:strokeColor="#FF1744" android:strokeWidth="5.5" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M20,54 L35,54 L43,30 L54,78 L65,24 L74,64 L81,54 L88,54"/>
              <path android:fillColor="#FFD700" android:pathData="M65,19 C67.8,19 70,21.2 70,24 C70,26.8 67.8,29 65,29 C62.2,29 60,26.8 60,24 C60,21.2 62.2,19 65,19 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_mma_pulse"
                  android:roundIcon="@drawable/ic_mma_pulse"
                  android:label="MMA Pulse"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <property android:name="android.window.PROPERTY_COMPAT_ALLOW_MIN_ASPECT_RATIO_OVERRIDE" android:value="false" />
                  <activity
                      android:name=".MainActivity"
                      android:resizeableActivity="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|density|uiMode|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/mma/pulse/MainActivity.kt
          package com.mma.pulse

          import android.Manifest
          import android.app.*
          import android.content.*
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.net.Uri
          import android.os.*
          import android.util.LruCache
          import android.util.Xml
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.*
          import androidx.compose.foundation.lazy.grid.*
          import androidx.compose.foundation.shape.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.*
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.*
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.*
          import androidx.compose.ui.unit.*
          import androidx.compose.ui.window.*
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.core.view.*
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import org.xmlpull.v1.XmlPullParser
          import java.io.StringReader
          import java.net.*
          import java.time.*
          import java.time.format.DateTimeFormatter
          import java.util.Locale
          import kotlin.math.abs
          import kotlin.math.roundToInt

          data class NewsItem(val title: String, val source: String, val pubDate: String, val link: String, val summary: String)
          data class BoutDetail(
              val weightClass: String, val placement: String,
              val fighterA: String, val recordA: String, val idA: String,
              val fighterB: String, val recordB: String, val idB: String,
              val liveOdds: String, val probA: Int, val probB: Int,
              val prediction: String, val isCompleted: Boolean, val officialResult: String
          )
          data class MmaEvent(val id: String, val title: String, val type: String, val localTime: String, val venue: String, val isCompleted: Boolean, val bouts: List<BoutDetail>)
          data class PastFight(val result: String, val opponent: String, val method: String, val round: Int, val time: String, val event: String, val dateYear: String, val location: String)
          data class RoundStat(val roundNum: Int, val scoreNote: String, val sigA: Int, val sigAttA: Int, val sigB: Int, val sigAttB: Int, val totA: Int, val totB: Int, val tdA: Int, val tdB: Int, val ctrlA: String, val ctrlB: String)
          data class UpcomingBooking(val opponent: String, val eventTitle: String, val dateTime: String, val venue: String, val weightClass: String, val placement: String, val liveOdds: String, val aiPick: String)
          data class FighterBio(val nationality: String, val height: String, val reach: String, val stance: String, val record: String, val nickname: String, val fights: List<PastFight>)
          data class Fighter(val id: String, val name: String, val nickname: String, val division: String, val code: String, val record: String, val nationality: String, val rankLabel: String, val isChamp: Boolean = false, val mensP4p: Int = 0, val womensP4p: Int = 0, val headshotUrl: String = "")
          data class LiveMatchState(val eventTitle: String, val weightClass: String, val fighterA: String, val recordA: String, val oddsA: String, val probA: Int, val fighterB: String, val recordB: String, val oddsB: String, val probB: Int, val round: String, val time: String, val status: String, val prediction: String, val isEventOver: Boolean)

          val CardGrad = Brush.linearGradient(listOf(Color(0xFF1E1E2E), Color(0xFF12121C)))
          val HeroGrad = Brush.linearGradient(listOf(Color(0xFF32121F), Color(0xFF171526), Color(0xFF10101A)))
          val GoldGrad = Brush.horizontalGradient(listOf(Color(0xFFFFD700), Color(0xFFFFA000)))
          val CrimsonGrad = Brush.horizontalGradient(listOf(Color(0xFFFF1744), Color(0xFFC51162)))

          fun flagFor(nat: String): String {
              val n = nat.lowercase()
              return when {
                  n.contains("ireland") || n.contains("irish") -> "🇮🇪"
                  n.contains("united states") || n.contains("usa") -> "🇺🇸"
                  n.contains("brazil") -> "🇧🇷"
                  n.contains("russia") || n.contains("dagestan") -> "🇷🇺"
                  n.contains("australia") -> "🇦🇺"
                  n.contains("england") || n.contains("uk") -> "🇬🇧"
                  else -> "🌐"
              }
          }

          fun openUrl(ctx: Context, url: String) {
              try { ctx.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(if (url.startsWith("http")) url else "https://www.espn.com/mma/")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) } catch (_: Throwable) {}
          }

          fun fmtLocal(utcIso: String): String = try {
              ZonedDateTime.parse(utcIso).withZoneSameInstant(ZoneId.systemDefault()).format(DateTimeFormatter.ofPattern("EEE, MMM d • h:mm a z", Locale.getDefault()))
          } catch (_: Throwable) { utcIso.take(10) }

          fun inferVenue(ev: String): String {
              val e = ev.lowercase()
              return when {
                  e.contains("vegas") || e.contains("apex") -> "Meta APEX, Las Vegas, NV, USA"
                  e.contains("paris") -> "Accor Arena, Paris, France"
                  e.contains("abu dhabi") -> "Etihad Arena, Abu Dhabi, UAE"
                  e.contains("london") -> "The O2 Arena, London, UK"
                  else -> "Official Octagon Arena"
              }
          }

          object PulseAiEngine {
              private fun parseWL(rec: String): Pair<Int, Int> {
                  val p = rec.split("-").mapNotNull { it.trim().takeWhile { c -> c.isDigit() }.toIntOrNull() }
                  return Pair(p.getOrElse(0) { 12 }, p.getOrElse(1) { 3 })
              }
              fun analyzeBout(fighterA: String, recA: String, fighterB: String, recB: String, oddsText: String, weightClass: String): Triple<Int, Int, String> {
                  val (wA, lA) = parseWL(recA); val (wB, lB) = parseWL(recB)
                  val rA = wA.toDouble() / (wA + lA).coerceAtLeast(1)
                  val rB = wB.toDouble() / (wB + lB).coerceAtLeast(1)
                  var probA = ((rA / (rA + rB).coerceAtLeast(0.1)) * 100.0).roundToInt().coerceIn(32, 68)
                  return Triple(probA, 100 - probA, "Pulse AI v2: $fighterA via Decision (62%)")
              }
          }

          object MmaRepository {
              private val VERIFIED_STARS = listOf(
                  Fighter("3022677", "Conor McGregor", "The Notorious", "Lightweight", "LW", "22-6-0", "Ireland", "Legend", false),
                  Fighter("4875658", "Ian Machado Garry", "The Future", "Welterweight", "WW", "16-1-0", "Ireland", "#6 WW", false),
                  Fighter("3332412", "Islam Makhachev", "The Eagle's Heir", "Welterweight", "WW", "29-1-0", "Russia", "#1 P4P", true, 1)
              )

              private fun httpGet(u: String): String = try {
                  val c = (URL(u).openConnection() as HttpURLConnection).apply { instanceFollowRedirects = true; connectTimeout = 6000; readTimeout = 6000; setRequestProperty("User-Agent", "Mozilla/5.0") }
                  if (c.responseCode in 200..299) c.inputStream.bufferedReader().use { it.readText() } else ""
              } catch (_: Throwable) { "" }

              suspend fun syncAllMmaData(): Triple<LiveMatchState, List<MmaEvent>, List<Fighter>> = withContext(Dispatchers.IO) {
                  val rosterMap = LinkedHashMap<String, Fighter>()
                  VERIFIED_STARS.forEach { rosterMap[it.name.lowercase()] = it }
                  val eventsList = mutableListOf<MmaEvent>()

                  try {
                      val start = LocalDate.now().minusDays(15).format(DateTimeFormatter.ofPattern("yyyyMMdd"))
                      val end = LocalDate.now().plusDays(45).format(DateTimeFormatter.ofPattern("yyyyMMdd"))
                      val sbJson = httpGet("https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard?dates=$start-$end")
                      if (sbJson.isNotBlank()) {
                          val evArr = JSONObject(sbJson).optJSONArray("events")
                          if (evArr != null) {
                              for (i in 0 until evArr.length()) {
                                  val ev = evArr.getJSONObject(i)
                                  val evName = ev.optString("name", "MMA Event")
                                  val comps = ev.optJSONArray("competitions") ?: continue
                                  val bouts = mutableListOf<BoutDetail>()
                                  for (j in 0 until comps.length()) {
                                      val c = comps.getJSONObject(j)
                                      val arr = c.optJSONArray("competitors") ?: continue
                                      if (arr.length() >= 2) {
                                          val n1 = arr.getJSONObject(0).optJSONObject("athlete")?.optString("displayName") ?: "Fighter A"
                                          val n2 = arr.getJSONObject(1).optJSONObject("athlete")?.optString("displayName") ?: "Fighter B"
                                          bouts.add(BoutDetail("Lightweight", "MAIN CARD", n1, "15-2-0", "", n2, "14-3-0", "", "Even", 50, 50, "Pick: $n1", false, ""))
                                      }
                                  }
                                  if (bouts.isNotEmpty()) {
                                      eventsList.add(MmaEvent(ev.optString("id"), evName, "FIGHT NIGHT", fmtLocal(ev.optString("date")), inferVenue(evName), false, bouts))
                                  }
                              }
                          }
                      }
                  } catch (_: Throwable) {}

                  val defaultLive = LiveMatchState("UFC Fight Night", "Main Event", "Tom Nolan", "12-1-0", "-160", 62, "Renato Moicano", "21-8-1", "+135", 38, "PRE-FIGHT", "5:00", "Live Telemetry Ready", "Pulse AI v2: Nolan", false)
                  Triple(defaultLive, eventsList, rosterMap.values.toList())
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  try {
                      WindowCompat.setDecorFitsSystemWindows(window, false)
                      WindowInsetsControllerCompat(window, window.decorView).apply {
                          systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          hide(WindowInsetsCompat.Type.statusBars())
                      }
                  } catch (_: Throwable) {}
                  setContent {
                      MaterialTheme(darkColorScheme(primary = Color(0xFFFF1744), background = Color(0xFF07070C), surface = Color(0xFF151520))) {
                          MmaPulseApp()
                      }
                  }
              }
          }

          @Composable
          fun MmaPulseApp() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var tab by remember { mutableIntStateOf(0) }
              var hideBars by remember { mutableStateOf(true) }

              var liveMatch by remember { mutableStateOf(LiveMatchState("UFC Fight Night", "Main Event", "Tom Nolan", "12-1-0", "-160", 62, "Renato Moicano", "21-8-1", "+135", 38, "PRE-FIGHT", "5:00", "Ready", "Pulse AI v2", false)) }
              var events by remember { mutableStateOf<List<MmaEvent>>(emptyList()) }
              var roster by remember { mutableStateOf<List<Fighter>>(emptyList()) }
              var loading by remember { mutableStateOf(true) }
              var selFighter by remember { mutableStateOf<Fighter?>(null) }

              fun syncAll() {
                  loading = true
                  scope.launch(Dispatchers.IO) {
                      val (lv, evs, rst) = MmaRepository.syncAllMmaData()
                      withContext(Dispatchers.Main) {
                          liveMatch = lv; events = evs; roster = rst; loading = false
                      }
                  }
              }
              LaunchedEffect(Unit) { syncAll() }

              if (selFighter != null) {
                  Dialog(onDismissRequest = { selFighter = null }) {
                      Card(Modifier.fillMaxWidth().padding(16.dp), shape = RoundedCornerShape(20.dp)) {
                          Column(Modifier.padding(20.dp)) {
                              Text(selFighter!!.name, color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Black)
                              Spacer(Modifier.height(10.dp))
                              Button(onClick = { selFighter = null }) { Text("Close") }
                          }
                      }
                  }
              }

              Column(Modifier.fillMaxSize().background(Color(0xFF07070C)).windowInsetsPadding(WindowInsets.safeDrawing)) {
                  Box(Modifier.fillMaxWidth().background(Brush.verticalGradient(listOf(Color(0xFF22101C), Color(0xFF0E0E16)))).padding(vertical = 10.dp), contentAlignment = Alignment.Center) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Text("MMA", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Black)
                          Spacer(Modifier.width(4.dp))
                          Text("PULSE", color = Color(0xFFFF1744), fontSize = 20.sp, fontWeight = FontWeight.Black)
                      }
                  }
                  if (loading) LinearProgressIndicator(Modifier.fillMaxWidth().height(3.dp), color = Color(0xFFFF1744))

                  Row(Modifier.fillMaxWidth().background(Color(0xFF0E0E16)).padding(12.dp, 8.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      val tabs = listOf("⚡ Live", "🥊 Cards", "🏆 Roster")
                      tabs.forEachIndexed { idx, title ->
                          val active = tab == idx
                          Box(
                              modifier = Modifier
                                  .weight(1f)
                                  .clip(RoundedCornerShape(50))
                                  .background(if (active) CrimsonGrad else Brush.horizontalGradient(listOf(Color(0xFF1A1A28), Color(0xFF1A1A28))))
                                  .border(1.dp, if (active) Color(0xFFFFD700) else Color(0xFF28283C), RoundedCornerShape(50))
                                  .clickable { tab = idx }
                                  .padding(vertical = 9.dp),
                              contentAlignment = Alignment.Center
                          ) { Text(title, color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold) }
                      }
                  }

                  Box(Modifier.weight(1f).fillMaxWidth()) {
                      when (tab) {
                          0 -> LazyColumn(Modifier.fillMaxSize().padding(14.dp)) {
                              item {
                                  Card(Modifier.fillMaxWidth(), shape = RoundedCornerShape(24.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF151522))) {
                                      Column(Modifier.padding(20.dp)) {
                                          Text(liveMatch.eventTitle, color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Black)
                                          Spacer(Modifier.height(14.dp))
                                          Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                              Text(liveMatch.fighterA, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                                              Text("VS", color = Color(0xFFFF1744), fontSize = 14.sp, fontWeight = FontWeight.Black)
                                              Text(liveMatch.fighterB, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                                          }
                                      }
                                  }
                              }
                          }
                          1 -> LazyColumn(Modifier.fillMaxSize().padding(14.dp)) {
                              items(events) { ev ->
                                  Card(Modifier.fillMaxWidth().padding(vertical = 4.dp), shape = RoundedCornerShape(16.dp)) {
                                      Column(Modifier.padding(14.dp)) { Text(ev.title, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold) }
                                  }
                              }
                          }
                          2 -> LazyColumn(Modifier.fillMaxSize().padding(14.dp)) {
                              items(roster) { f ->
                                  Card(Modifier.fillMaxWidth().padding(vertical = 4.dp).clickable { selFighter = f }, shape = RoundedCornerShape(16.dp)) {
                                      Row(Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                                          Text(f.name, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                                      }
                                  }
                              }
                          }
                      }
                  }

                  Row(Modifier.fillMaxWidth().background(Color(0xFF0A0A12)).padding(14.dp, 8.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                      Text("© 2026 BranDEAD Designs", color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.Black)
                      Box(Modifier.clip(RoundedCornerShape(50)).background(CrimsonGrad).clickable { syncAll() }.padding(14.dp, 6.dp)) {
                          Text("⟳ Sync", color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.Black)
                      }
                  }
              }
          }
          EOF

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: MMA-Pulse-APK
          path: app/build/outputs/apk/debug/app-debug.apk
