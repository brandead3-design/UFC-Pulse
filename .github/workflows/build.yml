                              Spacer(Modifier.height(10.dp))
                              LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxSize()) {
                                  items(sel.bouts) { b ->
                                      Card(Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = Color(0xFF202028))) {
                                          Column(Modifier.padding(12.dp)) {
                                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                                  Text("${b.placement} • ${b.weightClass}", color = Color(0xFFD20A0A), fontSize = 11.sp, fontWeight = FontWeight.Black)
                                                  Text(b.liveOdds, color = Color(0xFFFFD700), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                              }
                                              Spacer(Modifier.height(8.dp))
                                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                                  Row(Modifier.weight(1f).clickable { onFighter(b.fighterA) }, verticalAlignment = Alignment.CenterVertically) {
                                                      FighterAvatar(b.fighterA, 42.dp)
                                                      Spacer(Modifier.width(8.dp))
                                                      Column { Text(b.fighterA, color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold); Text(b.recordA, color = Color.Gray, fontSize = 11.sp) }
                                                  }
                                                  Text("VS", color = Color(0xFFD20A0A), fontSize = 12.sp, fontWeight = FontWeight.Black)
                                                  Row(Modifier.weight(1f).clickable { onFighter(b.fighterB) }, Arrangement.End, Alignment.CenterVertically) {
                                                      Column(horizontalAlignment = Alignment.End) { Text(b.fighterB, color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold, textAlign = TextAlign.End); Text(b.recordB, color = Color.Gray, fontSize = 11.sp) }
                                                      Spacer(Modifier.width(8.dp))
                                                      FighterAvatar(b.fighterB, 42.dp)
                                                  }
                                              }
                                              Spacer(Modifier.height(6.dp))
                                              if (b.isCompleted) Text(b.officialResult, color = Color(0xFF4CAF50), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                              else Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                                  Text(b.openingOdds, color = Color.Gray, fontSize = 11.sp)
                                                  Text(b.prediction, color = Color(0xFF4CAF50), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              } else {
                  LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxSize()) {
                      items(list.filter { filter == "ALL" || it.type == filter }) { ev ->
                          Card(Modifier.fillMaxWidth().clickable { onSel(ev) }, colors = CardDefaults.cardColors(containerColor = Color(0xFF16161B))) {
                              Column(Modifier.padding(14.dp)) {
                                  Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                      Text(ev.type, color = if (ev.isCompleted) Color(0xFF4CAF50) else Color(0xFFFFD700), fontSize = 11.sp, fontWeight = FontWeight.Black)
                                      Text(ev.localTime, color = Color(0xFF4CAF50), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                  }
                                  Text(ev.title, color = Color.White, fontSize = 17.sp, fontWeight = FontWeight.ExtraBold)
                                  Text(ev.venue, color = Color.Gray, fontSize = 12.sp)
                                  Spacer(Modifier.height(8.dp))
                                  ev.bouts.firstOrNull()?.let { mb ->
                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          FighterAvatar(mb.fighterA, 34.dp); Spacer(Modifier.width(6.dp)); FighterAvatar(mb.fighterB, 34.dp); Spacer(Modifier.width(8.dp))
                                          Text("${ev.bouts.size} Bouts • Tap for Full Card & Live Odds ➔", color = Color(0xFFFFD700), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun RosterPane(list: List<Fighter>, q: String, onQ: (String) -> Unit, div: String, onDiv: (String) -> Unit, cols: Int, onSel: (Fighter) -> Unit) {
              val divs = listOf("MEN'S P4P", "WOMEN'S P4P", "ALL", "CHAMPS", "HW", "LHW", "MW", "WW", "LW", "FW", "BW", "FLW", "WMMA")
              Column(Modifier.fillMaxSize()) {
                  OutlinedTextField(q, onQ, label = { Text("Search fighter, nationality, or division (tap for full profile)") }, modifier = Modifier.fillMaxWidth().padding(bottom = 8.dp), singleLine = true)
                  Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()).padding(bottom = 8.dp), Arrangement.spacedBy(6.dp)) {
                      divs.forEach { d ->
                          Button(onClick = { onDiv(d) }, colors = ButtonDefaults.buttonColors(containerColor = if (div == d) Color(0xFFD20A0A) else Color(0xFF22222A)), contentPadding = PaddingValues(10.dp, 2.dp)) {
                              Text(d, fontSize = 11.sp, color = Color.White, fontWeight = FontWeight.Bold)
                          }
                      }
                  }
                  val filtered = list.filter {
                      (it.name.contains(q, true) || it.division.contains(q, true) || it.nationality.contains(q, true)) &&
                          when (div) { "MEN'S P4P" -> it.mensP4p > 0; "WOMEN'S P4P" -> it.womensP4p > 0; "ALL" -> true; "CHAMPS" -> it.isChamp; else -> it.code == div }
                  }.sortedWith(when (div) { "MEN'S P4P" -> compareBy { it.mensP4p }; "WOMEN'S P4P" -> compareBy { it.womensP4p }; else -> compareBy { it.name } })

                  LazyVerticalGrid(GridCells.Fixed(cols), verticalArrangement = Arrangement.spacedBy(8.dp), horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxSize()) {
                      items(filtered) { f ->
                          val rnk = if (div == "WOMEN'S P4P" || (f.womensP4p > 0 && f.mensP4p == 0)) f.womensP4p else f.mensP4p
                          Card(Modifier.fillMaxWidth().clickable { onSel(f) }, colors = CardDefaults.cardColors(containerColor = Color(0xFF16161B))) {
                              Row(Modifier.fillMaxWidth().padding(12.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                  Row(Modifier.weight(1f), verticalAlignment = Alignment.CenterVertically) {
                                      FighterAvatar(f.name, 50.dp, f.isChamp)
                                      Spacer(Modifier.width(10.dp))
                                      Column {
                                          Row(verticalAlignment = Alignment.CenterVertically) {
                                              if (rnk > 0) Text("#$rnk P4P ", color = Color(0xFFFFD700), fontSize = 11.sp, fontWeight = FontWeight.Black)
                                              Text(f.name, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold)
                                          }
                                          Text("${f.nationality} • ${f.division}", color = Color.Gray, fontSize = 11.sp)
                                          Text("Tap for Full Profile & Past Opponents", color = Color(0xFFD20A0A), fontSize = 10.sp, fontWeight = FontWeight.SemiBold)
                                      }
                                  }
                                  Column(horizontalAlignment = Alignment.End) {
                                      if (f.isChamp) Text("CHAMP", color = Color(0xFFFFD700), fontSize = 9.sp, fontWeight = FontWeight.Black)
                                      Text(f.record, color = Color(0xFF4CAF50), fontSize = 14.sp, fontWeight = FontWeight.ExtraBold)
                                      Text("Odds: ${f.odds}", color = Color.Gray, fontSize = 10.sp)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun FighterProfileDialog(f: Fighter, onDismiss: () -> Unit) {
              val ctx = LocalContext.current
              Dialog(onDismissRequest = onDismiss, properties = DialogProperties(usePlatformDefaultWidth = false)) {
                  Card(Modifier.fillMaxWidth(0.94f).fillMaxHeight(0.88f).border(1.dp, Color(0xFFD20A0A), RoundedCornerShape(16.dp)), colors = CardDefaults.cardColors(containerColor = Color(0xFF121217))) {
                      Column(Modifier.fillMaxSize().padding(16.dp)) {
                          Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                              Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.weight(1f)) {
                                  FighterAvatar(f.name, 70.dp, f.isChamp)
                                  Spacer(Modifier.width(12.dp))
                                  Column {
                                      Text(f.name, color = Color.White, fontSize = 19.sp, fontWeight = FontWeight.Black)
                                      Text("\"${f.nickname}\" • ${f.division}", color = Color(0xFFFFD700), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                      Text("Nationality: ${f.nationality}", color = Color.LightGray, fontSize = 12.sp)
                                  }
                              }
                              Button(onClick = onDismiss, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF262630))) { Text("Close", color = Color.White, fontSize = 12.sp) }
                          }
                          Spacer(Modifier.height(12.dp))
                          Row(Modifier.fillMaxWidth().background(Color(0xFF1C1C24), RoundedCornerShape(10.dp)).padding(12.dp), Arrangement.SpaceBetween) {
                              Column(horizontalAlignment = Alignment.CenterHorizontally) { Text("RECORD", color = Color.Gray, fontSize = 10.sp); Text(f.record, color = Color(0xFF4CAF50), fontSize = 15.sp, fontWeight = FontWeight.Black) }
                              Column(horizontalAlignment = Alignment.CenterHorizontally) { Text("KO / SUB / DEC", color = Color.Gray, fontSize = 10.sp); Text("${f.koWins} / ${f.subWins} / ${f.decWins}", color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold) }
                              Column(horizontalAlignment = Alignment.CenterHorizontally) { Text("HT / REACH", color = Color.Gray, fontSize = 10.sp); Text("${f.height} / ${f.reach}", color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold) }
                              Column(horizontalAlignment = Alignment.CenterHorizontally) { Text("STANCE", color = Color.Gray, fontSize = 10.sp); Text(f.stance, color = Color(0xFFFFD700), fontSize = 14.sp, fontWeight = FontWeight.Bold) }
                          }
                          Spacer(Modifier.height(14.dp))
                          Text("PREVIOUS OPPONENTS & FIGHT RECORD HISTORY", color = Color(0xFFD20A0A), fontSize = 12.sp, fontWeight = FontWeight.Black)
                          Spacer(Modifier.height(8.dp))
                          LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.weight(1f)) {
                              items(f.history) { h ->
                                  Card(Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = Color(0xFF1B1B22))) {
                                      Row(Modifier.fillMaxWidth().padding(12.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                          Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.weight(1f)) {
                                              Box(Modifier.background(if (h.result == "WIN") Color(0xFF1B5E20) else if (h.result == "LOSS") Color(0xFFB71C1C) else Color(0xFF424242), RoundedCornerShape(4.dp)).padding(horizontal = 8.dp, vertical = 4.dp)) {
                                                  Text(h.result, color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.Black)
                                              }
                                              Spacer(Modifier.width(10.dp))
                                              Column {
                                                  Text("vs. ${h.opponent}", color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold)
                                                  Text("${h.method} • ${h.event}", color = Color.Gray, fontSize = 11.sp)
                                              }
                                          }
                                          FighterAvatar(h.opponent, 36.dp)
                                      }
                                  }
                              }
                          }
                          Spacer(Modifier.height(10.dp))
                          Button(onClick = { openUrlSafely(ctx, "https://www.ufc.com/athlete/${f.name.lowercase().replace("'", "").replace(" ", "-")}") }, Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFD20A0A))) {
                              Text("Open Official UFC.com Athlete Profile ➔", color = Color.White, fontWeight = FontWeight.Bold)
                          }
                      }
                  }
              }
          }

          @Composable
          fun NewsPane(list: List<NewsItem>, onClick: (NewsItem) -> Unit) {
              LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxSize()) {
                  items(list) { item ->
                      Card(Modifier.fillMaxWidth().clickable { onClick(item) }, colors = CardDefaults.cardColors(containerColor = Color(0xFF16161B))) {
                          Column(Modifier.padding(14.dp)) {
                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                  Text(item.source, color = Color(0xFFD20A0A), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                  Text(item.pubDate, color = Color.Gray, fontSize = 11.sp)
                              }
                              Spacer(Modifier.height(4.dp))
                              Text(item.title, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                              if (item.summary.isNotBlank()) Text(item.summary, color = Color(0xFFB0B0B8), fontSize = 13.sp, maxLines = 2)
                          }
                      }
                  }
              }
          }
