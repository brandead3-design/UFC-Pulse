                      .clip(CircleShape)
                      .background(Brush.radialGradient(listOf(Color(0xFF342438), Color(0xFF171722))))
                      .border(if (isChamp) 2.5.dp else 1.5.dp, if (isChamp) GoldGrad else CrimsonGrad, CircleShape),
                  contentAlignment = Alignment.Center
              ) {
                  if (bmp != null) Image(bmp!!, name, Modifier.fillMaxSize(), alignment = Alignment.Center, contentScale = ContentScale.Crop)
                  else Text(init, color = Color.White, fontSize = (size.value * 0.33f).sp, fontWeight = FontWeight.Black)
              }
          }

          @Composable
          fun AnimatedMmaPulseLogo() {
              val inf = rememberInfiniteTransition(label = "ecg_line_pulse")
              val ecgGlow by inf.animateFloat(0.25f, 1.0f, infiniteRepeatable(tween(650, easing = FastOutSlowInEasing), RepeatMode.Reverse), label = "glow")
              val wavePhase by inf.animateFloat(0f, 1f, infiniteRepeatable(tween(1350, easing = LinearEasing), RepeatMode.Restart), label = "wave")

              Row(
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.Center,
                  modifier = Modifier
                      .clip(RoundedCornerShape(50))
                      .background(Brush.horizontalGradient(listOf(Color(0xFF28101A), Color(0xFF151524), Color(0xFF28101A))))
                      .border(1.2.dp, Color(0xFFFF1744).copy(alpha = 0.55f), RoundedCornerShape(50))
                      .padding(horizontal = 18.dp, vertical = 7.dp)
              ) {
                  Canvas(modifier = Modifier.size(44.dp, 22.dp)) {
                      val w = size.width; val h = size.height; val mid = h / 2f
                      val pts = listOf(Offset(0f, mid), Offset(w * 0.18f, mid), Offset(w * 0.30f, h * 0.14f), Offset(w * 0.44f, h * 0.88f), Offset(w * 0.58f, h * 0.05f), Offset(w * 0.72f, h * 0.78f), Offset(w * 0.84f, mid), Offset(w, mid))
                      val path = Path().apply { moveTo(pts.first().x, pts.first().y); pts.drop(1).forEach { lineTo(it.x, it.y) } }
                      drawPath(path, color = Color(0xFFFF1744).copy(alpha = ecgGlow * 0.55f), style = Stroke(width = 4f + (ecgGlow * 7f), cap = StrokeCap.Round, join = StrokeJoin.Round))
                      drawPath(path, color = lerp(Color(0xFFFF1744), Color(0xFFFFD700), ecgGlow * 0.35f), style = Stroke(width = 3.5f + (ecgGlow * 2f), cap = StrokeCap.Round, join = StrokeJoin.Round))
                      val cur = Offset(pts[0].x + (pts[1].x - pts[0].x) * wavePhase, mid)
                      drawCircle(color = Color.White, radius = 3.5f, center = cur)
                  }
                  Spacer(Modifier.width(10.dp))
                  Text("MMA", color = Color.White, fontSize = 19.sp, fontWeight = FontWeight.Black, letterSpacing = 1.sp)
                  Spacer(Modifier.width(4.dp))
                  Text("PULSE", color = Color(0xFFFF1744), fontSize = 19.sp, fontWeight = FontWeight.Black, letterSpacing = 1.sp)
              }
          }

          object MmaRepository {
              private val VERIFIED_STARS = listOf(
                  Fighter("3022677", "Conor McGregor", "The Notorious", "Lightweight / Welterweight", "LW", "22-6-0", "Ireland", "Former 2-Div Champ", false),
                  Fighter("4875658", "Ian Machado Garry", "The Future", "Welterweight", "WW", "16-1-0", "Ireland", "#6 WW", false),
                  Fighter("3332412", "Islam Makhachev", "The Eagle's Heir", "Welterweight / LW", "WW", "29-1-0", "Russia", "#1 Men's P4P", true, mensP4p = 1),
                  Fighter("3949584", "Alexander Volkanovski", "The Great", "Featherweight", "FW", "29-4-0", "Australia", "#2 Men's P4P", true, mensP4p = 2)
              )

              private fun httpGet(u: String): String = try {
                  val c = (URL(u).openConnection() as HttpURLConnection).apply { instanceFollowRedirects = true; connectTimeout = 6000; readTimeout = 6000; setRequestProperty("User-Agent", "Mozilla/5.0") }
                  if (c.responseCode in 200..299) c.inputStream.bufferedReader().use { it.readText() } else ""
              } catch (_: Throwable) { "" }

              fun mapDivCode(divName: String): String {
                  val d = divName.lowercase()
                  return when {
                      d.contains("women") -> "WMMA"
                      d.contains("light heavyweight") -> "LHW"
                      d.contains("heavyweight") -> "HW"
                      d.contains("middleweight") -> "MW"
                      d.contains("welterweight") -> "WW"
                      d.contains("lightweight") -> "LW"
                      d.contains("featherweight") -> "FW"
                      d.contains("bantamweight") -> "BW"
                      d.contains("flyweight") -> "FLW"
                      else -> "MMA"
                  }
              }

              fun orderCompsMainEventFirst(rawComps: List<JSONObject>, evTitle: String): List<JSONObject> {
                  if (rawComps.size <= 1) return rawComps
                  val main = rawComps.find { c ->
                      val n = c.optJSONArray("competitors")
                      val n1 = n?.optJSONObject(0)?.optJSONObject("athlete")?.optString("displayName") ?: ""
                      evTitle.contains(n1.substringAfterLast(" "), true)
                  } ?: rawComps.last()
                  val mu = rawComps.toMutableList()
                  mu.remove(main); mu.add(0, main)
                  return mu
              }

              private fun parseCompetitionToBout(comp: JSONObject, idx: Int, total: Int): BoutDetail? {
                  val competitors = comp.optJSONArray("competitors") ?: return null
                  if (competitors.length() < 2) return null
                  val c1 = competitors.getJSONObject(0); val c2 = competitors.getJSONObject(1)
                  val a1 = c1.optJSONObject("athlete"); val a2 = c2.optJSONObject("athlete")
                  val n1 = a1?.optString("displayName") ?: "Fighter A"
                  val n2 = a2?.optString("displayName") ?: "Fighter B"
                  val id1 = a1?.optString("id") ?: ""; val id2 = a2?.optString("id") ?: ""
                  FaceImageLoader.registerHint(n1, id1); FaceImageLoader.registerHint(n2, id2)

                  val r1 = c1.optJSONArray("records")?.optJSONObject(0)?.optString("summary") ?: "12-3-0"
                  val r2 = c2.optJSONArray("records")?.optJSONObject(0)?.optString("summary") ?: "11-4-0"
                  val wc = comp.optJSONObject("type")?.optString("text") ?: "MMA Bout"
                  val placement = if (idx == 0) "MAIN EVENT" else if (idx == 1) "CO-MAIN EVENT" else "MAIN CARD"
                  val oddsStr = comp.optJSONArray("odds")?.optJSONObject(0)?.optString("details") ?: "Live Line Even"
                  val (pA, pB, aiText) = PulseAiEngine.analyzeBout(n1, r1, n2, r2, oddsStr, wc)
                  return BoutDetail(wc, placement, n1, r1, id1, n2, r2, id2, oddsStr, pA, pB, aiText, false, "")
              }

              suspend fun syncAllMmaData(): Triple<LiveMatchState, List<MmaEvent>, List<Fighter>> = withContext(Dispatchers.IO) {
                  val rosterMap = LinkedHashMap<String, Fighter>()
                  VERIFIED_STARS.forEach { rosterMap[it.name.lowercase()] = it }
                  val eventsList = mutableListOf<MmaEvent>()

                  try {
                      val start = LocalDate.now().minusDays(30).format(DateTimeFormatter.ofPattern("yyyyMMdd"))
                      val end = LocalDate.now().plusDays(60).format(DateTimeFormatter.ofPattern("yyyyMMdd"))
                      val sbJson = httpGet("https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard?dates=$start-$end")
                      if (sbJson.isNotBlank()) {
                          val evArr = JSONObject(sbJson).optJSONArray("events")
                          if (evArr != null) {
                              for (i in 0 until evArr.length()) {
                                  val ev = evArr.getJSONObject(i)
                                  val evName = ev.optString("name", "MMA Event")
                                  val comps = ev.optJSONArray("competitions") ?: continue
                                  val rawComps = mutableListOf<JSONObject>()
                                  for (j in 0 until comps.length()) rawComps.add(comps.getJSONObject(j))
                                  val ordered = orderCompsMainEventFirst(rawComps, evName)
                                  val bouts = ordered.mapIndexedNotNull { idx, c -> parseCompetitionToBout(c, idx, ordered.size) }
                                  if (bouts.isNotEmpty()) {
                                      eventsList.add(MmaEvent(ev.optString("id"), evName, "FIGHT NIGHT", fmtLocal(ev.date), inferVenue(evName), false, bouts))
                                  }
                              }
                          }
                      }
                  } catch (_: Throwable) {}

                  val defaultLive = LiveMatchState("UFC Fight Night", "Main Event", "Tom Nolan", "12-1-0", "-160", 62, "Renato Moicano", "21-8-1", "+135", 38, "PRE-FIGHT", "5:00", "Live Telemetry Ready", "Pulse AI v2: Nolan", false)
                  Triple(defaultLive, eventsList, rosterMap.values.toList())
              }

              suspend fun fetchFullEventBouts(event: MmaEvent): List<BoutDetail> = event.bouts
              suspend fun searchLiveFighters(query: String): List<Fighter> = emptyList()
              suspend fun fetchFighterBioAndHistory(f: Fighter): FighterBio = FighterBio(f.nationality, "5'10\"", "72\"", "Orthodox", f.record, f.nickname, emptyList())
              suspend fun fetchNews(): List<NewsItem> = emptyList()
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  try {
                      WindowCompat.setDecorFitsSystemWindows(window, false)
                      WindowInsetsControllerCompat(window, window.decorView).apply {
                          systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          hide(WindowInsetsCompat.Type.statusBars())
                      }
                  } catch (_: Throwable) {}
                  setContent {
                      MaterialTheme(darkColorScheme(primary = Color(0xFFFF1744), background = Color(0xFF07070C), surface = Color(0xFF151520))) {
                          MmaPulseApp()
                      }
                  }
              }
          }

          @Composable
          fun MmaPulseApp() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var tab by remember { mutableIntStateOf(0) }
              var hideBars by remember { mutableStateOf(true) }

              var liveMatch by remember { mutableStateOf(LiveMatchState("UFC Fight Night", "Main Event", "Tom Nolan", "12-1-0", "-160", 62, "Renato Moicano", "21-8-1", "+135", 38, "PRE-FIGHT", "5:00", "Ready", "Pulse AI v2", false)) }
              var events by remember { mutableStateOf<List<MmaEvent>>(emptyList()) }
              var roster by remember { mutableStateOf<List<Fighter>>(emptyList()) }
              var loading by remember { mutableStateOf(true) }

              var selEvent by remember { mutableStateOf<MmaEvent?>(null) }
              var selFighter by remember { mutableStateOf<Fighter?>(null) }

              fun syncAll() {
                  loading = true
                  scope.launch(Dispatchers.IO) {
                      val (lv, evs, rst) = MmaRepository.syncAllMmaData()
                      withContext(Dispatchers.Main) {
                          liveMatch = lv; events = evs; roster = rst; loading = false
                      }
                  }
              }
              LaunchedEffect(Unit) { syncAll() }

              if (selFighter != null) {
                  FighterProfileModal(selFighter!!) { selFighter = null }
              }

              Column(Modifier.fillMaxSize().background(Color(0xFF07070C)).windowInsetsPadding(WindowInsets.safeDrawing)) {
                  Box(Modifier.fillMaxWidth().background(Brush.verticalGradient(listOf(Color(0xFF22101C), Color(0xFF0E0E16)))).padding(vertical = 10.dp), contentAlignment = Alignment.Center) {
                      AnimatedMmaPulseLogo()
                  }
                  if (loading) LinearProgressIndicator(Modifier.fillMaxWidth().height(3.dp), color = Color(0xFFFF1744))

                  Row(Modifier.fillMaxWidth().background(Color(0xFF0E0E16)).horizontalScroll(rememberScrollState()).padding(horizontal = 12.dp, vertical = 8.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      val tabs = listOf("⚡ Live", "🥊 Cards", "🏆 Roster")
                      tabs.forEachIndexed { idx, title ->
                          val active = tab == idx
                          Box(
                              modifier = Modifier
                                  .clip(RoundedCornerShape(50))
                                  .background(if (active) CrimsonGrad else Brush.horizontalGradient(listOf(Color(0xFF1A1A28), Color(0xFF1A1A28))))
                                  .border(1.dp, if (active) Color(0xFFFFD700) else Color(0xFF28283C), RoundedCornerShape(50))
                                  .clickable { tab = idx }
                                  .padding(horizontal = 16.dp, vertical = 9.dp),
                              contentAlignment = Alignment.Center
                          ) { Text(title, color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold) }
                      }
                  }

                  Box(Modifier.weight(1f).fillMaxWidth()) {
                      when (tab) {
                          0 -> LiveTrackerCard(liveMatch) { selFighter = roster.find { f -> f.name.equals(it, true) } }
                          1 -> EventsSection(events, selEvent, { selEvent = it }) { selFighter = roster.find { f -> f.name.equals(it, true) } }
                          2 -> RosterSection(roster) { selFighter = it }
                      }
                  }

                  Row(Modifier.fillMaxWidth().background(Color(0xFF0A0A12)).padding(14.dp, 8.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                      Text("© 2026 BranDEAD Designs", color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.Black)
                      Box(Modifier.clip(RoundedCornerShape(50)).background(CrimsonGrad).clickable { syncAll() }.padding(14.dp, 6.dp)) {
                          Text("⟳ Sync", color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.Black)
                      }
                  }
              }
          }

          @Composable
          fun LiveTrackerCard(m: LiveMatchState, onFighter: (String) -> Unit) {
              LazyColumn(Modifier.fillMaxSize().padding(14.dp)) {
                  item {
                      Card(Modifier.fillMaxWidth(), shape = RoundedCornerShape(24.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF151522))) {
                          Column(Modifier.padding(20.dp)) {
                              Text(m.eventTitle, color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Black)
                              Spacer(Modifier.height(14.dp))
                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                  Text(m.fighterA, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                                  Text("VS", color = Color(0xFFFF1744), fontSize = 14.sp, fontWeight = FontWeight.Black)
                                  Text(m.fighterB, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun EventsSection(list: List<MmaEvent>, sel: MmaEvent?, onSel: (MmaEvent?) -> Unit, onFighter: (String) -> Unit) {
              LazyColumn(Modifier.fillMaxSize().padding(14.dp)) {
                  items(list) { ev ->
                      Card(Modifier.fillMaxWidth().clickable { onSel(ev) }, shape = RoundedCornerShape(16.dp)) {
                          Column(Modifier.padding(14.dp)) { Text(ev.title, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold) }
                      }
                  }
              }
          }

          @Composable
          fun RosterSection(list: List<Fighter>, onSel: (Fighter) -> Unit) {
              LazyVerticalGrid(GridCells.Fixed(1), Modifier.fillMaxSize().padding(14.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  items(list) { f ->
                      Card(Modifier.fillMaxWidth().clickable { onSel(f) }, shape = RoundedCornerShape(16.dp)) {
                          Row(Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                              Text(f.name, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                          }
                      }
                  }
              }
          }

          @Composable
          fun FighterProfileModal(f: Fighter, onDismiss: () -> Unit) {
              Dialog(onDismissRequest = onDismiss) {
                  Card(Modifier.fillMaxWidth().padding(16.dp), shape = RoundedCornerShape(20.dp)) {
                      Column(Modifier.padding(20.dp)) {
                          Text(f.name, color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Black)
                          Spacer(Modifier.height(10.dp))
                          Button(onClick = onDismiss) { Text("Close") }
                      }
                  }
              }
          }
          EOF

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: MMA-Pulse-APK
          path: app/build/outputs/apk/debug/app-debug.apk
