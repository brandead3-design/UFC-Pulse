              val mensP4p: Int = 0, val womensP4p: Int = 0, val headshotUrl: String = ""
          )
          data class LiveMatchState(
              val eventTitle: String = "", val weightClass: String = "",
              val fighterA: String = "", val recordA: String = "", val oddsA: String = "", val probA: Int = 50,
              val fighterB: String = "", val recordB: String = "", val oddsB: String = "", val probB: Int = 50,
              val round: String = "", val time: String = "", val status: String = "", val prediction: String = "", val isEventOver: Boolean = false
          )

          val CardGrad = Brush.linearGradient(listOf(Color(0xFF1E1E2E), Color(0xFF12121C)))
          val HeroGrad = Brush.linearGradient(listOf(Color(0xFF32121F), Color(0xFF171526), Color(0xFF10101A)))
          val GoldGrad = Brush.horizontalGradient(listOf(Color(0xFFFFD700), Color(0xFFFFA000)))
          val CrimsonGrad = Brush.horizontalGradient(listOf(Color(0xFFFF1744), Color(0xFFC51162)))

          fun flagFor(nat: String): String {
              val n = nat.lowercase()
              return when {
                  n.contains("ireland") || n.contains("irish") -> "🇮🇪"
                  n.contains("united states") || n.contains("usa") -> "🇺🇸"
                  n.contains("brazil") -> "🇧🇷"
                  n.contains("russia") || n.contains("dagestan") -> "🇷🇺"
                  n.contains("australia") -> "🇦🇺"
                  n.contains("england") || n.contains("uk") -> "🇬🇧"
                  else -> "🌐"
              }
          }

          fun openUrl(ctx: Context, url: String) {
              try { ctx.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) } catch (_: Throwable) {}
          }

          fun fmtLocal(utcIso: String): String = try {
              ZonedDateTime.parse(utcIso).withZoneSameInstant(ZoneId.systemDefault()).format(DateTimeFormatter.ofPattern("EEE, MMM d • h:mm a z", Locale.getDefault()))
          } catch (_: Throwable) { utcIso.take(10) }

          fun inferVenue(ev: String): String {
              val e = ev.lowercase()
              return when {
                  e.contains("vegas") || e.contains("apex") -> "Meta APEX, Las Vegas, NV, USA"
                  e.contains("paris") -> "Accor Arena, Paris, France"
                  e.contains("abu dhabi") -> "Etihad Arena, Abu Dhabi, UAE"
                  e.contains("london") -> "The O2 Arena, London, UK"
                  else -> "Official Octagon Arena"
              }
          }

          object PulseAiEngine {
              private fun parseWL(rec: String): Pair<Int, Int> {
                  val p = rec.split("-").mapNotNull { it.trim().takeWhile { c -> c.isDigit() }.toIntOrNull() }
                  return Pair(p.getOrElse(0) { 12 }, p.getOrElse(1) { 3 })
              }
              fun analyzeBout(fighterA: String, recA: String, fighterB: String, recB: String, oddsText: String, weightClass: String): Triple<Int, Int, String> {
                  val (wA, lA) = parseWL(recA); val (wB, lB) = parseWL(recB)
                  val rA = wA.toDouble() / (wA + lA).coerceAtLeast(1)
                  val rB = wB.toDouble() / (wB + lB).coerceAtLeast(1)
                  var probA = ((rA / (rA + rB).coerceAtLeast(0.1)) * 100.0).roundToInt().coerceIn(32, 68)
                  val num = Regex("""([+-]\d{3,4})""").find(oddsText)?.groupValues?.getOrNull(1)?.toIntOrNull()
                  if (num != null) {
                      val imp = if (num < 0) (-num.toDouble()) / (-num + 100.0) else 100.0 / (num + 100.0)
                      val lAName = fighterA.substringAfterLast(" ").lowercase()
                      val lBName = fighterB.substringAfterLast(" ").lowercase()
                      val favA = oddsText.lowercase().contains(lAName) || (!oddsText.lowercase().contains(lBName) && num < 0)
                      val rawA = if (favA) (imp * 100).roundToInt() else (100 - (imp * 100).roundToInt())
                      probA = ((rawA * 0.75) + (probA * 0.25)).roundToInt().coerceIn(18, 86)
                  }
                  val probB = 100 - probA
                  val pick = if (probA >= probB) fighterA else fighterB
                  val best = maxOf(probA, probB)
                  val method = if (best >= 68 && weightClass.contains("Heavy", true)) "KO/TKO" else "Decision / Late Finish"
                  return Triple(probA, probB, "Pulse AI v2: $pick via $method ($best%)")
              }
          }

          object FaceImageLoader {
              private val cache = object : LruCache<String, ImageBitmap>(250) {}
              private val urlHints = mutableMapOf<String, String>()
              private val failed = mutableSetOf<String>()

              fun registerHint(name: String, id: String = "") {
                  val k = name.trim().lowercase()
                  if (id.isNotBlank() && id != "0") urlHints[k] = "https://a.espncdn.com/i/headshots/mma/players/full/$id.png"
              }

              private fun conn(u: String) = (URL(u).openConnection() as HttpURLConnection).apply {
                  instanceFollowRedirects = true; connectTimeout = 6000; readTimeout = 6000
                  setRequestProperty("User-Agent", "Mozilla/5.0")
              }

              suspend fun load(name: String): ImageBitmap? = withContext(Dispatchers.IO) {
                  val k = name.trim().lowercase()
                  cache.get(k)?.let { return@withContext it }
                  if (k in failed) return@withContext null
                  val u = urlHints[k] ?: "https://a.espncdn.com/i/headshots/mma/players/full/3022677.png"
                  try {
                      val c = conn(u)
                      if (c.responseCode in 200..299) {
                          val raw = BitmapFactory.decodeStream(c.inputStream)
                          c.disconnect()
                          if (raw != null) {
                              val face = raw.asImageBitmap()
                              cache.put(k, face); return@withContext face
                          }
                      }
                      c.disconnect()
                  } catch (_: Throwable) {}
                  failed.add(k); null
              }
          }

          @Composable
          fun FighterAvatar(name: String, size: Dp = 56.dp, isChamp: Boolean = false) {
              var bmp by remember(name) { mutableStateOf<ImageBitmap?>(null) }
              LaunchedEffect(name) { bmp = FaceImageLoader.load(name) }
              val init = name.split(" ").mapNotNull { it.firstOrNull()?.uppercase() }.take(2).joinToString("")
              Box(
                  modifier = Modifier
                      .size(size)
                      .clip(CircleShape)
                      .background(Brush.radialGradient(listOf(Color(0xFF342438), Color(0xFF171722))))
                      .border(if (isChamp) 2.5.dp else 1.5.dp, if (isChamp) GoldGrad else CrimsonGrad, CircleShape),
                  contentAlignment = Alignment.Center
              ) {
                  if (bmp != null) Image(bmp!!, name, Modifier.fillMaxSize(), alignment = Alignment.Center, contentScale = ContentScale.Crop)
                  else Text(init, color = Color.White, fontSize = (size.value * 0.33f).sp, fontWeight = FontWeight.Black)
              }
          }

          @Composable
          fun AnimatedMmaPulseLogo() {
              val inf = rememberInfiniteTransition(label = "ecg_line_pulse")
              val ecgGlow by inf.animateFloat(0.25f, 1.0f, infiniteRepeatable(tween(650, easing = FastOutSlowInEasing), RepeatMode.Reverse), label = "glow")
              val wavePhase by inf.animateFloat(0f, 1f, infiniteRepeatable(tween(1350, easing = LinearEasing), RepeatMode.Restart), label = "wave")

              Row(
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.Center,
                  modifier = Modifier
                      .clip(RoundedCornerShape(50))
                      .background(Brush.horizontalGradient(listOf(Color(0xFF28101A), Color(0xFF151524), Color(0xFF28101A))))
                      .border(1.2.dp, Color(0xFFFF1744).copy(alpha = 0.55f), RoundedCornerShape(50))
                      .padding(horizontal = 18.dp, vertical = 7.dp)
              ) {
                  Canvas(modifier = Modifier.size(44.dp, 22.dp)) {
                      val w = size.width; val h = size.height; val mid = h / 2f
                      val pts = listOf(Offset(0f, mid), Offset(w * 0.18f, mid), Offset(w * 0.30f, h * 0.14f), Offset(w * 0.44f, h * 0.88f), Offset(w * 0.58f, h * 0.05f), Offset(w * 0.72f, h * 0.78f), Offset(w * 0.84f, mid), Offset(w, mid))
                      val path = Path().apply { moveTo(pts.first().x, pts.first().y); pts.drop(1).forEach { lineTo(it.x, it.y) } }
                      drawPath(path, color = Color(0xFFFF1744).copy(alpha = ecgGlow * 0.55f), style = Stroke(width = 4f + (ecgGlow * 7f), cap = StrokeCap.Round, join = StrokeJoin.Round))
                      drawPath(path, color = lerp(Color(0xFFFF1744), Color(0xFFFFD700), ecgGlow * 0.35f), style = Stroke(width = 3.5f + (ecgGlow * 2f), cap = StrokeCap.Round, join = StrokeJoin.Round))
                      val cur = Offset(pts[0].x + (pts[1].x - pts[0].x) * wavePhase, mid)
                      // Corrected Color.White
                      drawCircle(color = Color.White, radius = 3.5f, center = cur)
                  }
                  Spacer(Modifier.width(10.dp))
                  Text("MMA", color = Color.White, fontSize = 19.sp, fontWeight = FontWeight.Black, letterSpacing = 1.sp)
                  Spacer(Modifier.width(4.dp))
                  Text("PULSE", color = Color(0xFFFF1744), fontSize = 19.sp, fontWeight = FontWeight.Black, letterSpacing = 1.sp)
              }
          }

          object MmaRepository {
              private val VERIFIED_STARS = listOf(
                  Fighter("3022677", "Conor McGregor", "The Notorious", "Lightweight", "LW", "22-6-0", "Ireland", "Legend", false, 0, 0),
                  Fighter("4875658", "Ian Machado Garry", "The Future", "Welterweight", "WW", "16-1-0", "Ireland", "#6 WW", false, 0, 0),
                  Fighter("3332412", "Islam Makhachev", "The Eagle's Heir", "Welterweight", "WW", "29-1-0", "Russia", "#1 P4P", true, 1, 0)
              )

              private fun httpGet(u: String): String = try {
                  val c = (URL(u).openConnection() as HttpURLConnection).apply { instanceFollowRedirects = true; connectTimeout = 6000; readTimeout = 6000; setRequestProperty("User-Agent", "Mozilla/5.0") }
                  if (c.responseCode in 200..299) c.inputStream.bufferedReader().use { it.readText() } else ""
              } catch (_: Throwable) { "" }

              suspend fun syncAllMmaData(): Triple<LiveMatchState, List<MmaEvent>, List<Fighter>> = withContext(Dispatchers.IO) {
                  val rosterMap = LinkedHashMap<String, Fighter>()
                  VERIFIED_STARS.forEach { rosterMap[it.name.lowercase()] = it }
                  val eventsList = mutableListOf<MmaEvent>()

                  try {
                      val start = LocalDate.now().minusDays(15).format(DateTimeFormatter.ofPattern("yyyyMMdd"))
                      val end = LocalDate.now().plusDays(45).format(DateTimeFormatter.ofPattern("yyyyMMdd"))
                      val sbJson = httpGet("https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard?dates=$start-$end")
                      if (sbJson.isNotBlank()) {
                          val evArr = JSONObject(sbJson).optJSONArray("events")
                          if (evArr != null) {
                              for (i in 0 until evArr.length()) {
                                  val ev = evArr.getJSONObject(i)
                                  val evName = ev.optString("name", "MMA Event")
                                  val comps = ev.optJSONArray("competitions") ?: continue
                                  val bouts = mutableListOf<BoutDetail>()
                                  for (j in 0 until comps.length()) {
                                      val c = comps.getJSONObject(j)
                                      val arr = c.optJSONArray("competitors") ?: continue
                                      if (arr.length() >= 2) {
                                          val n1 = arr.getJSONObject(0).optJSONObject("athlete")?.optString("displayName") ?: "Fighter A"
                                          val n2 = arr.getJSONObject(1).optJSONObject("athlete")?.optString("displayName") ?: "Fighter B"
                                          bouts.add(BoutDetail("Lightweight", "MAIN CARD", n1, "15-2-0", "", n2, "14-3-0", "", "Even", 50, 50, "Pick: $n1", false, ""))
                                      }
                                  }
                                  if (bouts.isNotEmpty()) {
                                      eventsList.add(MmaEvent(ev.optString("id"), evName, "FIGHT NIGHT", fmtLocal(ev.optString("date")), inferVenue(evName), false, bouts))
                                  }
                              }
                          }
                      }
                  } catch (_: Throwable) {}

                  val defaultLive = LiveMatchState("UFC Fight Night: Cortes Acosta vs. Walker", "Heavyweight Main Event • 5 RDS", "Johnny Walker", "23-10-0", "+135", 39, "Waldo Cortes Acosta", "17-4-0", "-160", 61, "PRE-FIGHT", "5:00", "Main Event Headliner at Meta APEX.", "Pulse AI v2: Cortes Acosta via KO/TKO (61%)", false)
                  Triple(defaultLive, eventsList, rosterMap.values.toList())
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  try {
                      WindowCompat.setDecorFitsSystemWindows(window, false)
                      WindowInsetsControllerCompat(window, window.decorView).apply {
                          systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          hide(WindowInsetsCompat.Type.statusBars())
                      }
                  } catch (_: Throwable) {}
                  setContent {
                      MaterialTheme(darkColorScheme(primary = Color(0xFFFF1744), background = Color(0xFF07070C), surface = Color(0xFF151520))) {
                          MmaPulseApp()
                      }
                  }
              }
          }

          @Composable
          fun MmaPulseApp() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var tab by remember { mutableIntStateOf(0) }

              var liveMatch by remember { mutableStateOf(LiveMatchState("UFC Fight Night: Cortes Acosta vs. Walker", "Heavyweight Main Event • 5 RDS", "Johnny Walker", "23-10-0", "+135", 39, "Waldo Cortes Acosta", "17-4-0", "-160", 61, "PRE-FIGHT", "5:00", "Main Event Headliner at Meta APEX.", "Pulse AI v2: Cortes Acosta via KO/TKO (61%)", false)) }
              var events by remember { mutableStateOf<List<MmaEvent>>(emptyList()) }
              var roster by remember { mutableStateOf<List<Fighter>>(emptyList()) }
              var loading by remember { mutableStateOf(true) }

              var selEvent by remember { mutableStateOf<MmaEvent?>(null) }
              var selFighter by remember { mutableStateOf<Fighter?>(null) }

              fun syncAll() {
                  loading = true
                  scope.launch(Dispatchers.IO) {
                      val (lv, evs, rst) = MmaRepository.syncAllMmaData()
                      withContext(Dispatchers.Main) {
                          liveMatch = lv; events = evs; roster = rst; loading = false
                      }
                  }
              }
              LaunchedEffect(Unit) { syncAll() }

              if (selFighter != null) {
                  Dialog(onDismissRequest = { selFighter = null }) {
                      Card(Modifier.fillMaxWidth().padding(16.dp), shape = RoundedCornerShape(20.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF151522))) {
                          Column(Modifier.padding(20.dp)) {
                              Text(selFighter!!.name, color = Color.White, fontSize = 22.sp, fontWeight = FontWeight.Black)
                              Spacer(Modifier.height(6.dp))
                              Text("${selFighter!!.division} • Record: ${selFighter!!.record}", color = Color(0xFF00E676), fontSize = 14.sp, fontWeight = FontWeight.Bold)
                              Spacer(Modifier.height(14.dp))
                              Button(onClick = { selFighter = null }, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFF1744))) {
                                  Text("Close", color = Color.White, fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                  }
              }

              Column(Modifier.fillMaxSize().background(Color(0xFF07070C)).windowInsetsPadding(WindowInsets.safeDrawing)) {
                  Box(Modifier.fillMaxWidth().background(Brush.verticalGradient(listOf(Color(0xFF22101C), Color(0xFF0E0E16)))).padding(vertical = 10.dp), contentAlignment = Alignment.Center) {
                      AnimatedMmaPulseLogo()
                  }
                  if (loading) LinearProgressIndicator(Modifier.fillMaxWidth().height(3.dp), color = Color(0xFFFF1744))

                  Row(Modifier.fillMaxWidth().background(Color(0xFF0E0E16)).padding(12.dp, 8.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      val tabs = listOf("⚡ Live", "🥊 Cards", "🏆 Roster")
                      tabs.forEachIndexed { idx, title ->
                          val active = tab == idx
                          Box(
                              modifier = Modifier
                                  .weight(1f)
                                  .clip(RoundedCornerShape(50))
                                  .background(if (active) CrimsonGrad else Brush.horizontalGradient(listOf(Color(0xFF1A1A28), Color(0xFF1A1A28))))
                                  .border(1.dp, if (active) Color(0xFFFFD700) else Color(0xFF28283C), RoundedCornerShape(50))
                                  .clickable { tab = idx }
                                  .padding(vertical = 10.dp),
                              contentAlignment = Alignment.Center
                          ) { Text(title, color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold) }
                      }
                  }

                  Box(Modifier.weight(1f).fillMaxWidth().padding(14.dp)) {
                      when (tab) {
                          0 -> LazyColumn(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                              item {
                                  Card(
                                      modifier = Modifier.fillMaxWidth().border(1.5.dp, Color(0xFFFF1744).copy(alpha = 0.85f), RoundedCornerShape(26.dp)),
                                      shape = RoundedCornerShape(26.dp),
                                      colors = CardDefaults.cardColors(containerColor = Color.Transparent)
                                  ) {
                                      Column(Modifier.background(HeroGrad).padding(20.dp)) {
                                          Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                              Box(Modifier.clip(RoundedCornerShape(50)).background(Color(0xFFFF1744).copy(alpha = 0.25f)).padding(horizontal = 12.dp, vertical = 5.dp)) {
                                                  Text("● PULSE AI v2 MAIN EVENT", color = Color(0xFFFFD700), fontSize = 11.sp, fontWeight = FontWeight.Black)
                                              }
                                              Text("${liveMatch.round} • ${liveMatch.time}", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                                          }
                                          Spacer(Modifier.height(10.dp))
                                          Text(liveMatch.eventTitle, color = Color.White, fontSize = 21.sp, fontWeight = FontWeight.Black)
                                          Text(liveMatch.weightClass, color = Color(0xFFC0C0D0), fontSize = 13.sp, fontWeight = FontWeight.Medium)
                                          Spacer(Modifier.height(18.dp))

                                          Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                              Column(Modifier.weight(1f).clickable { selFighter = roster.find { it.name.equals(liveMatch.fighterA, true) } ?: Fighter(name = liveMatch.fighterA, record = liveMatch.recordA) }, horizontalAlignment = Alignment.CenterHorizontally) {
                                                  FighterAvatar(liveMatch.fighterA, 82.dp, liveMatch.probA >= liveMatch.probB)
                                                  Spacer(Modifier.height(8.dp))
                                                  Text(liveMatch.fighterA, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Black, textAlign = TextAlign.Center)
                                                  Text("${liveMatch.recordA} • ${liveMatch.oddsA}", color = Color(0xFFFFD700), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                              }
                                              Box(Modifier.size(40.dp).clip(CircleShape).background(CrimsonGrad).border(1.5.dp, Color(0xFFFFD700), CircleShape), contentAlignment = Alignment.Center) {
                                                  Text("VS", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Black)
                                              }
                                              Column(Modifier.weight(1f).clickable { selFighter = roster.find { it.name.equals(liveMatch.fighterB, true) } ?: Fighter(name = liveMatch.fighterB, record = liveMatch.recordB) }, horizontalAlignment = Alignment.CenterHorizontally) {
                                                  FighterAvatar(liveMatch.fighterB, 82.dp, liveMatch.probB > liveMatch.probA)
                                                  Spacer(Modifier.height(8.dp))
                                                  Text(liveMatch.fighterB, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Black, textAlign = TextAlign.Center)
                                                  Text("${liveMatch.recordB} • ${liveMatch.oddsB}", color = Color(0xFFFFD700), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                              }
                                          }
                                          Spacer(Modifier.height(16.dp))
                                          Card(Modifier.fillMaxWidth().border(1.dp, Color(0xFF2E2E44), RoundedCornerShape(18.dp)), shape = RoundedCornerShape(18.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF161624))) {
                                              Column(Modifier.padding(14.dp)) {
                                                  Text("PULSE AI v2 TELEMETRY", color = Color(0xFF00E676), fontSize = 11.sp, fontWeight = FontWeight.Black)
                                                  Spacer(Modifier.height(4.dp))
                                                  Text(liveMatch.prediction, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                                                  Text(liveMatch.status, color = Color(0xFFD0D0E0), fontSize = 13.sp)
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                          1 -> if (selEvent != null) {
                              Column(Modifier.fillMaxSize()) {
                                  Button(onClick = { selEvent = null }, shape = RoundedCornerShape(50), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFF1744)), modifier = Modifier.padding(bottom = 8.dp)) {
                                      Text("← Back to Events", color = Color.White, fontWeight = FontWeight.Bold)
                                  }
                                  LazyColumn(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                                      items(selEvent!!.bouts) { b ->
                                          Card(Modifier.fillMaxWidth(), shape = RoundedCornerShape(16.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF161622))) {
                                              Column(Modifier.padding(14.dp)) {
                                                  Text("${b.placement} • ${b.weightClass}", color = Color(0xFFFFD700), fontSize = 11.sp, fontWeight = FontWeight.Black)
                                                  Spacer(Modifier.height(6.dp))
                                                  Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                                      Text(b.fighterA, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                                                      Text("VS", color = Color(0xFFFF1744), fontSize = 12.sp, fontWeight = FontWeight.Black)
                                                      Text(b.fighterB, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                                                  }
                                              }
                                          }
                                      }
                                  }
                              }
                          } else {
                              LazyColumn(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                                  items(events) { ev ->
                                      Card(Modifier.fillMaxWidth().clickable { selEvent = ev }, shape = RoundedCornerShape(18.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF161622))) {
                                          Column(Modifier.padding(16.dp)) {
                                              Text(ev.title, color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.ExtraBold)
                                              Text("${ev.localTime} • ${ev.venue}", color = Color(0xFF00E676), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                              Text("${ev.bouts.size} Bouts • Tap to open card ➔", color = Color(0xFFFFD700), fontSize = 12.sp)
                                          }
                                      }
                                  }
                              }
                          }
                          2 -> LazyColumn(Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              items(roster) { f ->
                                  Card(Modifier.fillMaxWidth().clickable { selFighter = f }, shape = RoundedCornerShape(18.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF161622))) {
                                      Row(Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                                          FighterAvatar(f.name, 50.dp, f.isChamp)
                                          Spacer(Modifier.width(12.dp))
                                          Column {
                                              Text(f.name, color = Color.White, fontSize = 17.sp, fontWeight = FontWeight.Bold)
                                              Text("${flagFor(f.nationality)} ${f.nationality} • ${f.division}", color = Color(0xFF00E676), fontSize = 12.sp)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }

                  Row(Modifier.fillMaxWidth().background(Color(0xFF0A0A12)).padding(16.dp, 10.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                      Text("© 2026 BranDEAD Designs", color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.Black)
                      Box(Modifier.clip(RoundedCornerShape(50)).background(CrimsonGrad).clickable { syncAll() }.padding(14.dp, 6.dp)) {
                          Text("⟳ Sync Live", color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.Black)
                      }
                  }
              }
          }
          EOF

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: MMA-Pulse-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          # === END OF WORKFLOW ===
