          fun simRound(m: LiveMatchState): LiveMatchState {
              if (m.isEventOver) return m
              return when (m.round) {
                  "PRE-FIGHT" -> m.copy(round = "ROUND 1", time = "3:25", probA = (m.probA + 4).coerceAtMost(88), probB = (m.probB - 4).coerceAtLeast(12), status = "${m.fighterA} lands heavy calf kicks and controls center cage.", prediction = "Pulse AI v2 Live: ${m.fighterA} (${(m.probA + 4).coerceAtMost(88)}% Win Prob)")
                  "ROUND 1" -> m.copy(round = "ROUND 2", time = "2:10", probA = (m.probA + 9).coerceAtMost(92), probB = (m.probB - 9).coerceAtLeast(8), status = "${m.fighterA} rocks ${m.fighterB} with a counter right hand against the fence.", prediction = "Pulse AI v2 Live: ${m.fighterA} Heavy Favorite via Finish")
                  else -> m.copy(round = "PRE-FIGHT", time = "5:00", status = "Simulation reset to Pre-Fight telemetry.", prediction = "Pulse AI v2 Pre-Fight Line Restored")
              }
          }

          @Composable
          fun MmaPulseApp() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              val isFold8 = LocalConfiguration.current.screenWidthDp >= 600
              var tab by remember { mutableIntStateOf(0) }
              var threePane by remember { mutableStateOf(false) }
              var hideBars by remember { mutableStateOf(true) }

              var liveMatch by remember {
                  mutableStateOf(LiveMatchState("MMA Fight Night: Moicano vs. Nolan", "Lightweight Main Event • OFFICIAL FINAL", "Tom Nolan", "12-1-0", "+140 Winner", 100, "Renato Moicano", "21-8-1", "-165", 0, "FINAL (R3)", "1:28", "WINNER: Tom Nolan def. Renato Moicano via TKO (R3 1:28)", "Event Completed • Predictions Locked", true))
              }
              var events by remember { mutableStateOf<List<MmaEvent>>(emptyList()) }
              var roster by remember { mutableStateOf<List<Fighter>>(emptyList()) }
              var liveSearchHits by remember { mutableStateOf<List<Fighter>>(emptyList()) }
              var news by remember { mutableStateOf<List<NewsItem>>(emptyList()) }
              var loading by remember { mutableStateOf(true) }

              var search by remember { mutableStateOf("") }
              var divFilter by remember { mutableStateOf("ALL") }
              var evFilter by remember { mutableStateOf("ALL") }

              // Dedicated nullable state so "<- Back to All Events" always returns to the list!
              var selEvent by remember { mutableStateOf<MmaEvent?>(null) }
              var selFighter by remember { mutableStateOf<Fighter?>(null) }
              var selPastFight by remember { mutableStateOf<Pair<String, PastFight>?>(null) }

              fun syncAll() {
                  loading = true
                  scope.launch {
                      val (lv, evs, rst) = MmaRepository.syncAllMmaData()
                      liveMatch = lv
                      if (evs.isNotEmpty()) events = evs
                      if (rst.isNotEmpty()) roster = rst
                      news = MmaRepository.fetchNews()
                      loading = false
                  }
              }
              LaunchedEffect(Unit) { syncAll() }

              LaunchedEffect(search) {
                  if (search.trim().length >= 2) {
                      delay(300)
                      liveSearchHits = MmaRepository.searchLiveFighters(search)
                  } else liveSearchHits = emptyList()
              }

              fun openFighterByName(name: String) {
                  selFighter = roster.find { it.name.equals(name, true) }
                      ?: liveSearchHits.find { it.name.equals(name, true) }
                      ?: Fighter("", name, "MMA Pro", "Active Roster", "MMA", "Pro Record", "International", "Roster")
              }

              if (selFighter != null) {
                  FighterProfileModal(
                      f = selFighter!!,
                      onDismiss = { selFighter = null },
                      onSelectPastFight = { pf -> selPastFight = Pair(selFighter!!.name, pf) }
                  )
              }
              if (selPastFight != null) {
                  RoundByRoundStatsModal(
                      fighterName = selPastFight!!.first,
                      pf = selPastFight!!.second,
                      onDismiss = { selPastFight = null }
                  )
              }

              Column(Modifier.fillMaxSize().background(Color(0xFF08080D)).windowInsetsPadding(WindowInsets.safeDrawing)) {
                  // Modern Top Bar with Centered MMA Pulse Logo
                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .background(Brush.verticalGradient(listOf(Color(0xFF181824), Color(0xFF101018))))
                          .padding(horizontal = 14.dp, vertical = 10.dp)
                  ) {
                      Row(modifier = Modifier.align(Alignment.CenterStart), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          Button(
                              onClick = {
                                  hideBars = !hideBars
                                  try {
                                      val act = ctx as? Activity ?: return@Button
                                      val c = WindowInsetsControllerCompat(act.window, act.window.decorView)
                                      if (hideBars) c.hide(WindowInsetsCompat.Type.statusBars()) else c.show(WindowInsetsCompat.Type.statusBars())
                                  } catch (_: Throwable) {}
                              },
                              shape = RoundedCornerShape(50),
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF242436)),
                              contentPadding = PaddingValues(horizontal = 12.dp, vertical = 6.dp)
                          ) { Text(if (hideBars) "Bars: Auto" else "Bars: Show", fontSize = 11.sp, color = Color.White, fontWeight = FontWeight.SemiBold) }

                          if (isFold8) {
                              Button(
                                  onClick = { threePane = !threePane },
                                  shape = RoundedCornerShape(50),
                                  colors = ButtonDefaults.buttonColors(containerColor = if (threePane) Color(0xFFFFD700) else Color(0xFF242436)),
                                  contentPadding = PaddingValues(horizontal = 12.dp, vertical = 6.dp)
                              ) { Text(if (threePane) "3-Pane" else "2-Pane", fontSize = 11.sp, color = if (threePane) Color.Black else Color.White, fontWeight = FontWeight.Bold) }
                          }
                      }

                      Box(modifier = Modifier.align(Alignment.Center)) {
                          MmaPulseBrandLogo()
                      }

                      Button(
                          onClick = { syncAll() },
                          modifier = Modifier.align(Alignment.CenterEnd),
                          shape = RoundedCornerShape(50),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFE51937)),
                          contentPadding = PaddingValues(horizontal = 14.dp, vertical = 6.dp)
                      ) { Text("Sync", fontSize = 12.sp, color = Color.White, fontWeight = FontWeight.Bold) }
                  }

                  if (loading) LinearProgressIndicator(Modifier.fillMaxWidth().height(3.dp), color = Color(0xFFE51937))

                  if (!(isFold8 && threePane)) {
                      TabRow(selectedTabIndex = tab, containerColor = Color(0xFF101018), contentColor = Color(0xFFE51937)) {
                          Tab(tab == 0, { tab = 0 }, text = { Text("Live & AI", fontSize = 13.sp, fontWeight = FontWeight.Bold) })
                          Tab(tab == 1, { tab = 1 }, text = { Text("Cards (${events.size})", fontSize = 13.sp, fontWeight = FontWeight.Bold) })
                          Tab(tab == 2, { tab = 2 }, text = { Text("Roster (${roster.size})", fontSize = 13.sp, fontWeight = FontWeight.Bold) })
                          Tab(tab == 3, { tab = 3 }, text = { Text("News (${news.size})", fontSize = 13.sp, fontWeight = FontWeight.Bold) })
                      }
                  }

                  val switchNextPreview = {
                      val nextEv = events.firstOrNull { !it.isCompleted }
                      val main = nextEv?.bouts?.firstOrNull()
                      if (nextEv != null && main != null) {
                          liveMatch = LiveMatchState(
                              nextEv.title, "${main.weightClass} • MAIN EVENT (5 RDS)",
                              main.fighterA, main.recordA, main.liveOdds, main.probA,
                              main.fighterB, main.recordB, "Live Odds", main.probB,
                              "PRE-FIGHT", "5:00", "Main Event Headliner (${nextEv.venue}).", main.prediction, false
                          )
                      }
                  }

                  val combinedRoster = remember(roster, liveSearchHits, search) {
                      if (search.isBlank()) roster else (roster + liveSearchHits).distinctBy { it.name.lowercase() }
                  }

                  // Main Content Area
                  Box(Modifier.weight(1f).fillMaxWidth()) {
                      if (isFold8 && threePane) {
                          Row(Modifier.fillMaxSize().padding(12.dp), Arrangement.spacedBy(14.dp)) {
                              Box(Modifier.weight(1f)) { LiveTrackerCard(liveMatch, switchNextPreview, { liveMatch = simRound(liveMatch) }) { openFighterByName(it) } }
                              Box(Modifier.weight(1f)) { EventsSection(events, evFilter, selEvent, { selEvent = it }) { openFighterByName(it) } }
                              Box(Modifier.weight(1f)) { RosterSection(combinedRoster, search, { search = it }, divFilter, { divFilter = it }, 1) { selFighter = it } }
                          }
                      } else {
                          when (tab) {
                              0 -> if (isFold8) {
                                  Row(Modifier.fillMaxSize().padding(14.dp), Arrangement.spacedBy(16.dp)) {
                                      Box(Modifier.weight(1f)) { LiveTrackerCard(liveMatch, switchNextPreview, { liveMatch = simRound(liveMatch) }) { openFighterByName(it) } }
                                      Box(Modifier.weight(1f)) { EventsSection(events, "ALL", selEvent, { selEvent = it }) { openFighterByName(it) } }
                                  }
                              } else Box(Modifier.fillMaxSize().padding(14.dp)) { LiveTrackerCard(liveMatch, switchNextPreview, { liveMatch = simRound(liveMatch) }) { openFighterByName(it) } }

                              1 -> Column(Modifier.fillMaxSize().padding(14.dp)) {
                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.horizontalScroll(rememberScrollState()).padding(bottom = 10.dp)) {
                                      listOf("ALL", "FIGHT NIGHT", "PPV", "COMPLETED").forEach { f ->
                                          Button(
                                              onClick = { evFilter = f; selEvent = null },
                                              shape = RoundedCornerShape(50),
                                              colors = ButtonDefaults.buttonColors(containerColor = if (evFilter == f) Color(0xFFE51937) else Color(0xFF222230)),
                                              contentPadding = PaddingValues(horizontal = 16.dp, vertical = 8.dp)
                                          ) { Text(f, fontSize = 12.sp, color = Color.White, fontWeight = FontWeight.Bold) }
                                      }
                                  }
                                  EventsSection(events, evFilter, selEvent, { selEvent = it }) { openFighterByName(it) }
                              }
                              2 -> Box(Modifier.fillMaxSize().padding(14.dp)) { RosterSection(combinedRoster, search, { search = it }, divFilter, { divFilter = it }, if (isFold8) 2 else 1) { selFighter = it } }
                              3 -> Box(Modifier.fillMaxSize().padding(14.dp)) { NewsSection(news) { openUrl(ctx, it.link) } }
                          }
                      }
                  }

                  // Bottom Footer with © 2026 BranDEAD Designs at Bottom-Left
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .background(Color(0xFF0E0E15))
                          .padding(horizontal = 16.dp, vertical = 6.dp),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(
                          text = "© 2026 BranDEAD Designs",
                          color = Color(0xFF9E9EB0),
                          fontSize = 11.sp,
                          fontWeight = FontWeight.SemiBold
                      )
                      Text(
                          text = "Pulse AI v2 • ESPN Live Feed",
                          color = Color(0xFF68687A),
                          fontSize = 10.sp,
                          fontWeight = FontWeight.Medium
                      )
                  }
              }
          }

          @Composable
          fun LiveTrackerCard(m: LiveMatchState, onPreviewNext: () -> Unit, onStepSim: () -> Unit, onFighter: (String) -> Unit) {
              LazyColumn(verticalArrangement = Arrangement.spacedBy(14.dp), modifier = Modifier.fillMaxSize()) {
                  item {
                      Card(
                          modifier = Modifier.fillMaxWidth().border(1.5.dp, if (m.isEventOver) Color(0xFF4CAF50).copy(alpha = 0.7f) else Color(0xFFE51937).copy(alpha = 0.8f), RoundedCornerShape(24.dp)),
                          shape = RoundedCornerShape(24.dp),
                          colors = CardDefaults.cardColors(containerColor = Color.Transparent)
                      ) {
                          Column(Modifier.background(HeroGrad).padding(18.dp)) {
                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                  Box(Modifier.clip(RoundedCornerShape(50)).background(if (m.isEventOver) Color(0xFF1B5E20) else Color(0xFFE51937).copy(alpha = 0.25f)).padding(horizontal = 12.dp, vertical = 4.dp)) {
                                      Text(if (m.isEventOver) "● EVENT OVER • OFFICIAL FINAL" else "● PULSE AI v2 MAIN EVENT", color = if (m.isEventOver) Color(0xFF81C784) else Color(0xFFFFD700), fontSize = 11.sp, fontWeight = FontWeight.Black)
                                  }
                                  Text("${m.round} • ${m.time}", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                              }
                              Spacer(Modifier.height(8.dp))
                              Text(m.eventTitle, color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.ExtraBold)
                              Text(m.weightClass, color = Color(0xFFB8B8C8), fontSize = 13.sp)
                              Spacer(Modifier.height(16.dp))

                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                  Column(Modifier.weight(1f).clickable { onFighter(m.fighterA) }, horizontalAlignment = Alignment.CenterHorizontally) {
                                      FighterAvatar(m.fighterA, 82.dp, m.probA >= m.probB)
                                      Spacer(Modifier.height(8.dp))
                                      Text(m.fighterA, color = Color.White, fontSize = 17.sp, fontWeight = FontWeight.Black, textAlign = TextAlign.Center)
                                      Text("${m.recordA} • ${m.oddsA}", color = Color(0xFFFFD700), fontSize = 13.sp, fontWeight = FontWeight.Bold)
                                  }
                                  Box(Modifier.size(40.dp).clip(CircleShape).background(Color(0xFFE51937).copy(alpha = 0.2f)).border(1.dp, Color(0xFFE51937), CircleShape), contentAlignment = Alignment.Center) {
                                      Text("VS", color = Color(0xFFE51937), fontSize = 14.sp, fontWeight = FontWeight.Black)
                                  }
                                  Column(Modifier.weight(1f).clickable { onFighter(m.fighterB) }, horizontalAlignment = Alignment.CenterHorizontally) {
                                      FighterAvatar(m.fighterB, 82.dp, m.probB > m.probA)
                                      Spacer(Modifier.height(8.dp))
                                      Text(m.fighterB, color = Color.White, fontSize = 17.sp, fontWeight = FontWeight.Black, textAlign = TextAlign.Center)
                                      Text("${m.recordB} • ${m.oddsB}", color = Color(0xFFFFD700), fontSize = 13.sp, fontWeight = FontWeight.Bold)
                                  }
                              }

                              Spacer(Modifier.height(16.dp))
                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                  Text("${m.fighterA} (${m.probA}%)", color = Color(0xFFE51937), fontSize = 13.sp, fontWeight = FontWeight.Bold)
                                  Text("${m.fighterB} (${m.probB}%)", color = Color(0xFF29B6F6), fontSize = 13.sp, fontWeight = FontWeight.Bold)
                              }
                              Spacer(Modifier.height(6.dp))
                              Row(Modifier.fillMaxWidth().height(12.dp).clip(RoundedCornerShape(6.dp))) {
                                  Box(Modifier.weight(m.probA.coerceAtLeast(5).toFloat()).fillMaxHeight().background(Color(0xFFE51937)))
                                  Box(Modifier.weight(m.probB.coerceAtLeast(5).toFloat()).fillMaxHeight().background(Color(0xFF29B6F6)))
                              }

                              Spacer(Modifier.height(16.dp))
                              Card(Modifier.fillMaxWidth(), shape = RoundedCornerShape(18.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1E2C))) {
                                  Column(Modifier.padding(14.dp)) {
                                      Text("PULSE AI v2 TELEMETRY & OUTCOME MODEL", color = Color(0xFF4CAF50), fontSize = 11.sp, fontWeight = FontWeight.Black)
                                      Spacer(Modifier.height(4.dp))
                                      Text(m.prediction, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                                      Spacer(Modifier.height(4.dp))
                                      Text(m.status, color = Color(0xFFD0D0DC), fontSize = 13.sp)
                                  }
                              }
                              Spacer(Modifier.height(14.dp))
                              Button(
                                  onClick = if (m.isEventOver) onPreviewNext else onStepSim,
                                  modifier = Modifier.fillMaxWidth().height(48.dp),
                                  shape = RoundedCornerShape(50),
                                  colors = ButtonDefaults.buttonColors(containerColor = if (m.isEventOver) Color(0xFF2B2B3E) else Color(0xFFE51937))
                              ) {
                                  Text(if (m.isEventOver) "Event Finished • Load Next Main Event Preview ➔" else "Simulate Next Live Round (Pulse AI v2) ➔", color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun EventsSection(list: List<MmaEvent>, filter: String, sel: MmaEvent?, onSel: (MmaEvent?) -> Unit, onFighter: (String) -> Unit) {
              if (sel != null) {
                  var fullBouts by remember(sel.id) { mutableStateOf(sel.bouts) }
                  LaunchedEffect(sel.id) { fullBouts = MmaRepository.fetchFullEventBouts(sel) }

                  Column(Modifier.fillMaxSize()) {
                      Button(
                          onClick = { onSel(null) },
                          shape = RoundedCornerShape(50),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFE51937)),
                          modifier = Modifier.padding(bottom = 10.dp)
                      ) { Text("← Back to All Events", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold) }

                      Card(Modifier.fillMaxSize().border(1.dp, Color(0xFF2E2E42), RoundedCornerShape(22.dp)), shape = RoundedCornerShape(22.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF151520))) {
                          Column(Modifier.fillMaxSize().padding(16.dp)) {
                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                  Text(sel.type, color = Color(0xFFFFD700), fontSize = 12.sp, fontWeight = FontWeight.Black)
                                  Text("FULL CARD • ${fullBouts.size} BOUTS", color = Color(0xFF4CAF50), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              }
                              Text(sel.title, color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.ExtraBold)
                              Text("${sel.localTime} • ${sel.venue}", color = Color(0xFFB0B0C0), fontSize = 13.sp)
                              Spacer(Modifier.height(12.dp))

                              LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxSize()) {
                                  items(fullBouts) { b ->
                                      val isMain = b.placement == "MAIN EVENT"
                                      Card(
                                          modifier = Modifier.fillMaxWidth().border(if (isMain) 1.5.dp else 0.5.dp, if (isMain) Color(0xFFFFD700) else Color(0xFF2E2E40), RoundedCornerShape(18.dp)),
