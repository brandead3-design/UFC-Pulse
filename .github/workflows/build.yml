name: Build MMA Pulse APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Project
        run: |
          rm -rf app settings.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/mma/pulse app/src/main/res/drawable
          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "MMAPulse"
          include(":app")
          EOF
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF
          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application") version "8.5.2"; id("org.jetbrains.kotlin.android") version "1.9.24" }
          android { namespace = "com.mma.pulse"; compileSdk = 35
            defaultConfig { applicationId = "com.mma.pulse.pro"; minSdk = 26; targetSdk = 35; versionCode = 50; versionName = "22.0-UFC" }
            buildFeatures { compose = true }; composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = "17" } }
          dependencies {
            implementation("androidx.core:core-ktx:1.15.0"); implementation("androidx.activity:activity-compose:1.10.0")
            implementation("androidx.compose.ui:ui:1.7.6"); implementation("androidx.compose.material3:material3:1.3.1")
            implementation("androidx.compose.foundation:foundation:1.7.6"); implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0") }
          EOF
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET"/>
          <application android:icon="@drawable/ic_mma_pulse" android:label="MMA Pulse" android:theme="@android:style/Theme.DeviceDefault.NoActionBar" android:usesCleartextTraffic="true">
          <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
          </application></manifest>
          EOF
          cat << 'EOF' > app/src/main/java/com/mma/pulse/MainActivity.kt
          package com.mma.pulse
          import android.graphics.BitmapFactory
          import android.os.Bundle
          import android.util.LruCache
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.URL
          import java.net.URLEncoder
          data class Bout(val a:String,val b:String,val oa:String="",val ob:String="",val round:Int=0,val time:String="")
          data class Event(val name:String,val date:String,val venue:String,val bouts:List<Bout>,val done:Boolean,val live:Boolean=false)
          data class RankedFighter(val rank:Int,val name:String,val record:String,val weightClass:String)
          data class RankingGroup(val name:String,val fighters:List<RankedFighter>)
          object Repo {
            var events by mutableStateOf(listOf<Event>())
            var rankings by mutableStateOf(listOf<RankingGroup>())
            var odds by mutableStateOf(mapOf<String,Pair<String,String>>())
            fun sync() = CoroutineScope(Dispatchers.IO).launch { try { fetchOdds(); fetchEvents(); fetchRankings() } catch(_:Exception){} }
            private suspend fun fetchOdds() = withContext(Dispatchers.IO) {
              val key = "2092f68cd7ae933cb12006094338703b"
              val arr = JSONArray(URL("https://api.the-odds-api.com/v4/sports/mma_mixed_martial_arts/odds?regions=eu,uk,us&markets=h2h&oddsFormat=american&apiKey=$key").readText())
              val m = mutableMapOf<String,Pair<String,String>>()
              for(i in 0 until arr.length()) {
                val e = arr.getJSONObject(i)
                val home = e.optString("home_team"); val away = e.optString("away_team")
                var oa=""; var ob=""
                e.optJSONArray("bookmakers")?.let { bms ->
                  for(j in 0 until bms.length()) {
                    bms.getJSONObject(j).optJSONArray("markets")?.let { mkts ->
                      for(k in 0 until mkts.length()) {
                        if(mkts.getJSONObject(k).optString("key")=="h2h") {
                          mkts.getJSONObject(k).optJSONArray("outcomes")?.let { outs ->
                            for(o in 0 until outs.length()) {
                              val oc = outs.getJSONObject(o)
                              val price = oc.optInt("price")
                              val am = if(price>0) "+$price" else price.toString()
                              if(oc.optString("name").equals(home,true)) oa=am
                              if(oc.optString("name").equals(away,true)) ob=am
                            }
                          }
                        }
                      }
                    }
                  }
                }
                if(oa.isNotEmpty()) { m["${home.lowercase()} vs \( {away.lowercase()}"] = Pair(oa,ob); m[" \){away.lowercase()} vs ${home.lowercase()}"] = Pair(ob,oa) }
              }
              odds = m
            }
            private suspend fun fetchEvents() = withContext(Dispatchers.IO) {
              val json = JSONObject(URL("https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard").readText())
              val list = mutableListOf<Event>()
              json.optJSONArray("events")?.let { arr ->
                for(i in 0 until arr.length()) {
                  val e = arr.getJSONObject(i)
                  val name = e.optString("name")
                  val date = e.optString("date")
                  val status = e.optJSONObject("status")?.optJSONObject("type")?.optString("state") ?: "pre"
                  val live = status == "in"
                  val done = status == "post"
                  val venue = e.optJSONArray("competitions")?.optJSONObject(0)?.optJSONObject("venue")?.optString("fullName") ?: ""
                  val bouts = mutableListOf<Bout>()
                  e.optJSONArray("competitions")?.let { comps ->
                    for(j in 0 until comps.length()) {
                      val c = comps.getJSONObject(j)
                      val competitors = c.optJSONArray("competitors") ?: continue
                      if(competitors.length()<2) continue
                      val na = competitors.getJSONObject(0).optJSONObject("athlete")?.optString("displayName")?:""
                      val nb = competitors.getJSONObject(1).optJSONObject("athlete")?.optString("displayName")?:""
                      val k = "${na.lowercase()} vs ${nb.lowercase()}"
                      val o = odds[k] ?: Pair("","")
                      val period = c.optJSONObject("status")?.optInt("period") ?: 0
                      val clock = c.optJSONObject("status")?.optString("displayClock") ?: ""
                      bouts.add(Bout(na,nb,o.first,o.second,period,clock))
                    }
                  }
                  list.add(Event(name,date,venue,bouts,done,live))
                }
              }
              events = list
            }
            private suspend fun fetchRankings() = withContext(Dispatchers.IO) {
              try {
                val root = JSONObject(URL("https://sports.core.api.espn.com/v2/sports/mma/leagues/ufc/rankings").readText())
                val groups = mutableListOf<RankingGroup>()
                root.optJSONArray("items")?.let { items ->
                  for(i in 0 until items.length()) {
                    val ref = items.getJSONObject(i).optString("\$ref")
                    if(ref.isBlank()) continue
                    try {
                      val rJson = JSONObject(URL(ref).readText())
                      val gName = rJson.optString("name", "Rankings")
                      val fighters = mutableListOf<RankedFighter>()
                      rJson.optJSONArray("ranks")?.let { ranks ->
                        for(j in 0 until ranks.length()) {
                          val r = ranks.getJSONObject(j)
                          val athlete = r.optJSONObject("athlete")
                          val name = athlete?.optString("displayName") ?: ""
                          val record = athlete?.optJSONArray("records")?.optJSONObject(0)?.optString("summary") ?: ""
                          fighters.add(RankedFighter(r.optInt("current"), name, record, gName))
                        }
                      }
                      if(fighters.isNotEmpty()) groups.add(RankingGroup(gName, fighters))
                    } catch(_:Exception){}
                  }
                }
                rankings = groups
              } catch(_:Exception){}
            }
          }
          object AI {
            fun analyze(oa:String, ob:String): Pair<Int,Int> {
              fun p(o:String):Double { if(o.isBlank()) return 0.5; val n=o.replace("+","").toIntOrNull()?:0; return if(n>0) 100.0/(n+100) else (-n).toDouble()/((-n)+100) }
              val pa=p(oa); val pb=p(ob); val t=pa+pb
              val wa=((pa/t)*100).toInt().coerceIn(8,92); return Pair(wa,100-wa)
            }
          }
          object Faces {
            private val cache = object : LruCache<String, ImageBitmap>(300) {}
            suspend fun load(name:String): ImageBitmap? = withContext(Dispatchers.IO) {
              val k = name.trim().lowercase()
              cache.get(k)?.let { return@withContext it }
              try {
                val search = URL("https://site.web.api.espn.com/apis/common/v3/search?query=${URLEncoder.encode(name,"UTF-8")}&limit=1&type=player&sport=mma").readText()
                val pid = JSONObject(search).optJSONArray("items")?.optJSONObject(0)?.optString("id","") ?: ""
                if(pid.isNotBlank()) {
                  val bmp = BitmapFactory.decodeStream(URL("https://a.espncdn.com/i/headshots/mma/players/full/$pid.png").openStream())
                  if(bmp != null) { val img = bmp.asImageBitmap(); cache.put(k, img); return@withContext img }
                }
              } catch(_:Exception){}
              null
            }
          }@Composable fun ECGLogo() {
            val infinite = rememberInfiniteTransition()
            val pulse by infinite.animateFloat(0f, 1f, infiniteRepeatable(tween(1600, easing = LinearEasing), RepeatMode.Restart))
            val chase by infinite.animateFloat(0f, 1f, infiniteRepeatable(tween(2200, easing = LinearEasing), RepeatMode.Restart))
            Canvas(Modifier.size(48.dp)) {
              val w = size.width; val h = size.height
              val path = Path().apply {
                moveTo(0f, h*0.5f)
                lineTo(w*0.15f, h*0.5f)
                lineTo(w*0.22f, h*0.25f)
                lineTo(w*0.32f, h*0.75f)
                lineTo(w*0.42f, h*0.15f)
                lineTo(w*0.52f, h*0.85f)
                lineTo(w*0.62f, h*0.35f)
                lineTo(w*0.75f, h*0.5f)
                lineTo(w, h*0.5f)
              }
              drawPath(path, Color(0xFFFF1744), style = Stroke(width = 2.5f, cap = StrokeCap.Round))
              val chaseX = chase * w
              drawCircle(Color.White, radius = 3.5f, center = Offset(chaseX, h*0.5f))
              drawCircle(Color(0xFFFF1744).copy(alpha = 0.6f * (1f - pulse)), radius = 6f * pulse, center = Offset(w*0.5f, h*0.5f))
            }
          }
          class MainActivity: ComponentActivity() {
            override fun onCreate(s: Bundle?) { super.onCreate(s); setContent { App() } }
          }
          @Composable fun App() {
            var tab by remember { mutableStateOf(0) }
            var selected by remember { mutableStateOf<Event?>(null) }
            val tabs = listOf("Live","Cards","Roster","Predict")
            LaunchedEffect(Unit){ Repo.sync(); while(true){ delay(45000); Repo.sync() } }
            Scaffold(containerColor=Color(0xFF080810), topBar={
              Row(Modifier.fillMaxWidth().padding(12.dp), verticalAlignment=Alignment.CenterVertically) {
                if(selected != null) {
                  TextButton(onClick={ selected = null }) { Text("← Back", color=Color(0xFFFF1744)) }
                  Spacer(Modifier.width(8.dp))
                  Text(selected!!.name, color=Color.White, fontWeight=FontWeight.Bold, maxLines=1)
                } else {
                  ECGLogo()
                  Spacer(Modifier.width(8.dp))
                  Text("MMA PULSE", color=Color(0xFFFF1744), fontWeight=FontWeight.Bold, fontSize=18.sp)
                  Spacer(Modifier.weight(1f))
                  TextButton(onClick={ Repo.sync() }) { Text("Sync", color=Color(0xFFFF1744)) }
                }
              }
            }, bottomBar={
              if(selected == null) NavigationBar(containerColor=Color(0xFF12121A)) {
                tabs.forEachIndexed { i,t -> NavigationBarItem(selected=tab==i, onClick={tab=i}, icon={}, label={Text(t,fontSize=11.sp)}) }
              }
            }) { p ->
              Box(Modifier.padding(p)) {
                if(selected != null) EventDetail(selected!!)
                else when(tab) {
                  0 -> Live()
                  1 -> Cards { selected = it }
                  2 -> Roster()
                  3 -> Predict()
                }
              }
            }
          }
          @Composable fun FighterFace(name:String, size:Int = 56) {
            var img by remember { mutableStateOf<ImageBitmap?>(null) }
            LaunchedEffect(name) { img = Faces.load(name) }
            if(img != null) Image(img!!, null, Modifier.size(size.dp).clip(CircleShape), contentScale=ContentScale.Crop)
            else Box(Modifier.size(size.dp).clip(CircleShape).background(Color(0xFF2A2A38)), contentAlignment=Alignment.Center) {
              Text(name.take(1), color=Color.White, fontWeight=FontWeight.Bold)
            }
          }
          @Composable fun Live() {
            val live = Repo.events.filter { it.live }
            val next = Repo.events.firstOrNull { !it.done && !it.live }
            Column(Modifier.fillMaxSize().background(Color(0xFF080810)).padding(16.dp)) {
              Text("LIVE", color=Color(0xFFFF1744), fontWeight=FontWeight.Bold, fontSize=20.sp)
              if(live.isEmpty()) Text("No live UFC fights right now", color=Color.Gray, modifier=Modifier.padding(top=8.dp))
              live.forEach { ev ->
                Text(ev.name, color=Color.White, fontWeight=FontWeight.Bold, fontSize=16.sp, modifier=Modifier.padding(top=12.dp))
                ev.bouts.forEach { b ->
                  val (wa,wb) = AI.analyze(b.oa,b.ob)
                  Card(Modifier.fillMaxWidth().padding(vertical=6.dp), colors=CardDefaults.cardColors(containerColor=Color(0xFF1A1A28)), shape=RoundedCornerShape(16.dp)) {
                    Column(Modifier.padding(14.dp)) {
                      Row(verticalAlignment=Alignment.CenterVertically) {
                        FighterFace(b.a)
                        Spacer(Modifier.width(10.dp))
                        Column(Modifier.weight(1f)) { Text(b.a, color=Color.White, fontWeight=FontWeight.Bold); Text("$wa%", color=Color(0xFFFF1744)) }
                        Text("VS", color=Color(0xFFFF1744), fontWeight=FontWeight.Bold)
                        Column(Modifier.weight(1f), horizontalAlignment=Alignment.End) { Text(b.b, color=Color.White, fontWeight=FontWeight.Bold); Text("$wb%", color=Color(0xFF00E676)) }
                        Spacer(Modifier.width(10.dp))
                        FighterFace(b.b)
                      }
                      if(b.round > 0) Text("Round ${b.round} • ${b.time}", color=Color(0xFF00E676), fontSize=13.sp, modifier=Modifier.padding(top=6.dp))
                      LinearProgressIndicator(progress={wa/100f}, modifier=Modifier.fillMaxWidth().height(7.dp).padding(top=6.dp), color=Color(0xFFFF1744), trackColor=Color(0xFF00E676))
                      if(b.oa.isNotEmpty()) Text("Live Odds  ${b.oa} / ${b.ob}", color=Color(0xFFFFD700), fontSize=12.sp, modifier=Modifier.padding(top=4.dp))
                    }
                  }
                }
              }
              if(next != null) {
                Spacer(Modifier.height(16.dp))
                Text("NEXT", color=Color.White, fontWeight=FontWeight.Bold, fontSize=18.sp)
                Text(next.name, color=Color.Gray)
              }
            }
          }
          @Composable fun Cards(onSelect:(Event)->Unit) {
            LazyColumn(Modifier.fillMaxSize().background(Color(0xFF080810)).padding(16.dp)) {
              item { Text("UPCOMING UFC CARDS", color=Color(0xFFFF1744), fontWeight=FontWeight.Bold, fontSize=20.sp) }
              items(Repo.events.filter { !it.done }) { e ->
                Card(Modifier.fillMaxWidth().padding(vertical=6.dp).clickable { onSelect(e) }, colors=CardDefaults.cardColors(containerColor=Color(0xFF1A1A28)), shape=RoundedCornerShape(14.dp)) {
                  Column(Modifier.padding(12.dp)) {
                    Text(e.name, color=Color.White, fontWeight=FontWeight.Bold)
                    Text("${e.date.take(10)} • ${e.venue}", color=Color.Gray, fontSize=12.sp)
                    Text("${e.bouts.size} bouts", color=Color(0xFF00E676), fontSize=12.sp)
                  }
                }
              }
            }
          }
          @Composable fun EventDetail(event: Event) {
            LazyColumn(Modifier.fillMaxSize().background(Color(0xFF080810)).padding(16.dp)) {
              item {
                Text(event.name, color=Color.White, fontWeight=FontWeight.Bold, fontSize=18.sp)
                Text("${event.date.take(10)} • ${event.venue}", color=Color.Gray, fontSize=13.sp)
                Spacer(Modifier.height(8.dp))
              }
              items(event.bouts) { b ->
                val (wa,wb) = AI.analyze(b.oa,b.ob)
                Card(Modifier.fillMaxWidth().padding(vertical=6.dp), colors=CardDefaults.cardColors(containerColor=Color(0xFF1A1A28)), shape=RoundedCornerShape(14.dp)) {
                  Column(Modifier.padding(12.dp)) {
                    Row(verticalAlignment=Alignment.CenterVertically) {
                      FighterFace(b.a, 48)
                      Spacer(Modifier.width(8.dp))
                      Column(Modifier.weight(1f)) { Text(b.a, color=Color.White, fontWeight=FontWeight.Bold, fontSize=14.sp); Text("$wa%", color=Color(0xFFFF1744)) }
                      Text("VS", color=Color(0xFFFF1744))
                      Column(Modifier.weight(1f), horizontalAlignment=Alignment.End) { Text(b.b, color=Color.White, fontWeight=FontWeight.Bold, fontSize=14.sp); Text("$wb%", color=Color(0xFF00E676)) }
                      Spacer(Modifier.width(8.dp))
                      FighterFace(b.b, 48)
                    }
                    LinearProgressIndicator(progress={wa/100f}, modifier=Modifier.fillMaxWidth().height(6.dp).padding(top=6.dp), color=Color(0xFFFF1744), trackColor=Color(0xFF00E676))
                    if(b.oa.isNotEmpty()) Text("${b.a}: ${b.oa}   |   ${b.b}: ${b.ob}", color=Color(0xFFFFD700), fontSize=12.sp, modifier=Modifier.padding(top=4.dp))
                  }
                }
              }
            }
          }@Composable fun Roster() {
            LazyColumn(Modifier.fillMaxSize().background(Color(0xFF080810)).padding(16.dp)) {
              item { Text("UFC RANKINGS", color=Color(0xFFFF1744), fontWeight=FontWeight.Bold, fontSize=20.sp) }
              items(Repo.rankings) { group ->
                Text(group.name, color=Color(0xFF00E676), fontWeight=FontWeight.Bold, fontSize=16.sp, modifier=Modifier.padding(top=12.dp, bottom=6.dp))
                group.fighters.forEach { f ->
                  Row(Modifier.fillMaxWidth().padding(vertical=4.dp), verticalAlignment=Alignment.CenterVertically) {
                    Text("${f.rank}", color=Color(0xFFFF1744), fontWeight=FontWeight.Bold, modifier=Modifier.width(28.dp))
                    FighterFace(f.name, 40)
                    Spacer(Modifier.width(10.dp))
                    Column(Modifier.weight(1f)) {
                      Text(f.name, color=Color.White, fontWeight=FontWeight.Medium)
                      Text(f.record, color=Color.Gray, fontSize=12.sp)
                    }
                  }
                }
              }
            }
          }
          @Composable fun Predict() {
            val upcoming = Repo.events.filter { !it.done }.flatMap { it.bouts }
            LazyColumn(Modifier.fillMaxSize().background(Color(0xFF080810)).padding(16.dp)) {
              item { Text("PULSE AI PREDICTIONS", color=Color(0xFFFF1744), fontWeight=FontWeight.Bold, fontSize=20.sp) }
              items(upcoming) { b ->
                val (wa,wb) = AI.analyze(b.oa,b.ob)
                Card(Modifier.fillMaxWidth().padding(vertical=6.dp), colors=CardDefaults.cardColors(containerColor=Color(0xFF1A1A28)), shape=RoundedCornerShape(14.dp)) {
                  Column(Modifier.padding(12.dp)) {
                    Row(verticalAlignment=Alignment.CenterVertically) {
                      FighterFace(b.a, 44)
                      Spacer(Modifier.width(8.dp))
                      Text("${b.a} vs ${b.b}", color=Color.White, fontWeight=FontWeight.Bold, modifier=Modifier.weight(1f))
                      FighterFace(b.b, 44)
                    }
                    Spacer(Modifier.height(6.dp))
                    Text("${b.a}: $wa%   |   ${b.b}: $wb%", color=Color(0xFF00E676))
                    LinearProgressIndicator(progress={wa/100f}, modifier=Modifier.fillMaxWidth().height(6.dp).padding(top=4.dp), color=Color(0xFFFF1744), trackColor=Color(0xFF00E676))
                    if(b.oa.isNotEmpty()) Text("Odds ${b.oa} / ${b.ob}", color=Color(0xFFFFD700), fontSize=12.sp, modifier=Modifier.padding(top=4.dp))
                  }
                }
              }
            }
          }
          @Composable fun Footer() {
            Text("© 2026 MMA Pulse", color=Color.Gray, fontSize=11.sp, modifier=Modifier.fillMaxWidth().padding(8.dp), textAlign=androidx.compose.ui.text.style.TextAlign.Center)
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MMA-Pulse-APK
          path: app/build/outputs/apk/debug/app-debug.apk
