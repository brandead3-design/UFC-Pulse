                                      Spacer(Modifier.height(6.dp))
                                      Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                          Text("Pred Ctrl: ${r.ctrlA}", color = Color(0xFFB8B8C8), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                          Text("PROJECTED CAGE CONTROL", color = Color.Gray, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                                          Text("Pred Ctrl: ${r.ctrlB}", color = Color(0xFFB8B8C8), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun MarketsSection(events: List<MmaEvent>, ctx: Context, onFighter: (String) -> Unit) {
              val upcoming = remember(events) { events.filter { !it.isCompleted }.ifEmpty { events } }
              var selEvIdx by remember(upcoming) { mutableIntStateOf(0) }
              val curEv = upcoming.getOrNull(selEvIdx)

              Column(Modifier.fillMaxSize()) {
                  Text("📈 POLYMARKET & KALSHI LIVE PREDICTION CONTRACTS", color = Color(0xFF00E676), fontSize = 12.sp, fontWeight = FontWeight.Black)
                  Spacer(Modifier.height(6.dp))
                  Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      upcoming.forEachIndexed { idx, ev ->
                          Button(
                              onClick = { selEvIdx = idx },
                              shape = RoundedCornerShape(50),
                              colors = ButtonDefaults.buttonColors(containerColor = if (idx == selEvIdx) Color(0xFF2962FF) else Color(0xFF1E1E2E)),
                              contentPadding = PaddingValues(horizontal = 14.dp, vertical = 6.dp)
                          ) {
                              Text(ev.title.removePrefix("UFC "), fontSize = 12.sp, color = Color.White, fontWeight = FontWeight.Bold)
                          }
                      }
                  }
                  Spacer(Modifier.height(8.dp))

                  LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.weight(1f)) {
                      val bouts = curEv?.bouts ?: emptyList()
                      items(bouts) { b ->
                          val seed = abs((b.fighterA + b.fighterB).hashCode())
                          val polyA = (b.probA + ((seed % 5) - 2)).coerceIn(8, 92)
                          val polyB = 100 - polyA
                          val kalshiA = (b.probA + (((seed / 3) % 5) - 2)).coerceIn(8, 92)
                          val kalshiB = 100 - kalshiA
                          val volK = 85 + (seed % 640)
                          val edge = b.probA - polyA

                          Card(Modifier.fillMaxWidth().border(1.dp, Color(0xFF2E3B55), RoundedCornerShape(20.dp)), shape = RoundedCornerShape(20.dp), colors = CardDefaults.cardColors(containerColor = Color.Transparent)) {
                              Column(Modifier.background(CardGrad).padding(14.dp)) {
                                  Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                      Text("${b.placement} • ${b.weightClass}", color = Color(0xFFFFD700), fontSize = 11.sp, fontWeight = FontWeight.Black)
                                      Text("Est. Volume: $${volK}K", color = Color(0xFF90CAF9), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                  }
                                  Spacer(Modifier.height(8.dp))
                                  Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                      Row(Modifier.weight(1f).clickable { onFighter(b.fighterA) }, verticalAlignment = Alignment.CenterVertically) {
                                          FighterAvatar(b.fighterA, 48.dp)
                                          Spacer(Modifier.width(8.dp))
                                          Text(b.fighterA, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Black)
                                      }
                                      Text("VS", color = Color(0xFFFF1744), fontSize = 12.sp, fontWeight = FontWeight.Black)
                                      Row(Modifier.weight(1f).clickable { onFighter(b.fighterB) }, Arrangement.End, Alignment.CenterVertically) {
                                          Text(b.fighterB, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Black, textAlign = TextAlign.End)
                                          Spacer(Modifier.width(8.dp))
                                          FighterAvatar(b.fighterB, 48.dp)
                                      }
                                  }
                                  Spacer(Modifier.height(10.dp))
                                  Row(Modifier.fillMaxWidth().clip(RoundedCornerShape(12.dp)).background(PolyGrad).padding(10.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                      Text("POLYMARKET", color = Color(0xFF64B5F6), fontSize = 11.sp, fontWeight = FontWeight.Black)
                                      Text("${b.fighterA.substringAfterLast(" ")} Yes: ${polyA}¢", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                      Text("${b.fighterB.substringAfterLast(" ")} Yes: ${polyB}¢", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                  }
                                  Spacer(Modifier.height(6.dp))
                                  Row(Modifier.fillMaxWidth().clip(RoundedCornerShape(12.dp)).background(KalshiGrad).padding(10.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                      Text("KALSHI", color = Color(0xFF00E676), fontSize = 11.sp, fontWeight = FontWeight.Black)
                                      Text("${b.fighterA.substringAfterLast(" ")} Yes: ${kalshiA}¢", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                      Text("${b.fighterB.substringAfterLast(" ")} Yes: ${kalshiB}¢", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                  }
                                  Spacer(Modifier.height(6.dp))
                                  Text(
                                      text = "Pulse AI (${b.probA}% / ${b.probB}%) • ${if (abs(edge) >= 2) "AI Value Edge: ${if (edge > 0) b.fighterA else b.fighterB} (+${abs(edge)}%)" else "Market Aligned with AI"}",
                                      color = Color(0xFFFFD700), fontSize = 11.sp, fontWeight = FontWeight.Bold
                                  )
                              }
                          }
                      }
                  }

                  Spacer(Modifier.height(8.dp))
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                      Button(
                          onClick = { openUrl(ctx, "https://polymarket.com/sports/ufc") },
                          modifier = Modifier.weight(1f).height(46.dp),
                          shape = RoundedCornerShape(50),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF1E56E0))
                      ) {
                          Text("Open Polymarket ↗", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Black)
                      }
                      Button(
                          onClick = { openUrl(ctx, "https://kalshi.com/sports") },
                          modifier = Modifier.weight(1f).height(46.dp),
                          shape = RoundedCornerShape(50),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00A86B))
                      ) {
                          Text("Open Kalshi ↗", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Black)
                      }
                  }
              }
          }

          @Composable
          fun EventsSection(list: List<MmaEvent>, filter: String, sel: MmaEvent?, onSel: (MmaEvent?) -> Unit, onFighter: (String) -> Unit) {
              if (sel != null) {
                  var fullBouts by remember(sel.id) { mutableStateOf(sel.bouts) }
                  LaunchedEffect(sel.id) { fullBouts = MmaRepository.fetchFullEventBouts(sel) }

                  Column(Modifier.fillMaxSize()) {
                      Button(
                          onClick = { onSel(null) },
                          shape = RoundedCornerShape(50),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFF1744)),
                          modifier = Modifier.padding(bottom = 10.dp)
                      ) { Text("← Back to All Events", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold) }

                      Card(Modifier.fillMaxSize().border(1.dp, Color(0xFF2E2E42), RoundedCornerShape(24.dp)), shape = RoundedCornerShape(24.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF14141F))) {
                          Column(Modifier.fillMaxSize().padding(16.dp)) {
                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                  Text(sel.type, color = Color(0xFFFFD700), fontSize = 12.sp, fontWeight = FontWeight.Black)
                                  Text("FULL CARD • ${fullBouts.size} BOUTS", color = Color(0xFF00E676), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              }
                              Text(sel.title, color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.ExtraBold)
                              Text("${sel.localTime} • ${sel.venue}", color = Color(0xFFB0B0C0), fontSize = 13.sp)
                              Spacer(Modifier.height(12.dp))

                              LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxSize()) {
                                  items(fullBouts) { b ->
                                      val isMain = b.placement == "MAIN EVENT"
                                      Card(
                                          modifier = Modifier.fillMaxWidth().border(if (isMain) 1.5.dp else 0.8.dp, if (isMain) Color(0xFFFFD700) else Color(0xFF2E2E42), RoundedCornerShape(20.dp)),
                                          shape = RoundedCornerShape(20.dp),
                                          colors = CardDefaults.cardColors(containerColor = Color.Transparent)
                                      ) {
                                          Column(Modifier.background(if (isMain) HeroGrad else CardGrad).padding(14.dp)) {
                                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                                  Box(Modifier.clip(RoundedCornerShape(50)).background(if (isMain) Color(0xFFFFD700).copy(alpha = 0.2f) else Color(0xFFFF1744).copy(alpha = 0.2f)).padding(horizontal = 10.dp, vertical = 3.dp)) {
                                                      Text("${b.placement} • ${b.weightClass}", color = if (isMain) Color(0xFFFFD700) else Color(0xFFFF8A80), fontSize = 11.sp, fontWeight = FontWeight.Black)
                                                  }
                                                  Text(b.liveOdds, color = Color(0xFFFFD700), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                              }
                                              Spacer(Modifier.height(10.dp))
                                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                                  Row(Modifier.weight(1f).clickable { onFighter(b.fighterA) }, verticalAlignment = Alignment.CenterVertically) {
                                                      FighterAvatar(b.fighterA, 56.dp, isMain)
                                                      Spacer(Modifier.width(10.dp))
                                                      Column {
                                                          Text(b.fighterA, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                                                          Text(b.recordA, color = Color(0xFFB0B0C0), fontSize = 12.sp)
                                                      }
                                                  }
                                                  Text("VS", color = Color(0xFFFF1744), fontSize = 13.sp, fontWeight = FontWeight.Black, modifier = Modifier.padding(horizontal = 6.dp))
                                                  Row(Modifier.weight(1f).clickable { onFighter(b.fighterB) }, Arrangement.End, Alignment.CenterVertically) {
                                                      Column(horizontalAlignment = Alignment.End) {
                                                          Text(b.fighterB, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold, textAlign = TextAlign.End)
                                                          Text(b.recordB, color = Color(0xFFB0B0C0), fontSize = 12.sp)
                                                      }
                                                      Spacer(Modifier.width(10.dp))
                                                      FighterAvatar(b.fighterB, 56.dp, isMain)
                                                  }
                                              }
                                              Spacer(Modifier.height(8.dp))
                                              Text(if (b.isCompleted) b.officialResult else b.prediction, color = Color(0xFF00E676), fontSize = 13.sp, fontWeight = FontWeight.Bold)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              } else {
                  val filtered = list.filter { filter == "ALL" || it.type == filter }
                  LazyColumn(verticalArrangement = Arrangement.spacedBy(12.dp), modifier = Modifier.fillMaxSize()) {
                      items(filtered) { ev ->
                          val mainBout = ev.bouts.firstOrNull()
                          Card(
                              modifier = Modifier.fillMaxWidth().border(1.dp, Color(0xFF2E2E44), RoundedCornerShape(22.dp)).clickable { onSel(ev) },
                              shape = RoundedCornerShape(22.dp),
                              colors = CardDefaults.cardColors(containerColor = Color.Transparent)
                          ) {
                              Column(Modifier.background(CardGrad).padding(16.dp)) {
                                  Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                      Box(Modifier.clip(RoundedCornerShape(50)).background(if (ev.isCompleted) Color(0xFF1B5E20) else Color(0xFFFF1744).copy(alpha = 0.22f)).padding(horizontal = 10.dp, vertical = 3.dp)) {
                                          Text(ev.type, color = if (ev.isCompleted) Color(0xFF69F0AE) else Color(0xFFFFD700), fontSize = 11.sp, fontWeight = FontWeight.Black)
                                      }
                                      Text(ev.localTime, color = Color(0xFF00E676), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                  }
                                  Spacer(Modifier.height(6.dp))
                                  Text(ev.title, color = Color.White, fontSize = 19.sp, fontWeight = FontWeight.ExtraBold)
                                  Text(ev.venue, color = Color(0xFFB0B0C0), fontSize = 13.sp)
                                  if (mainBout != null) {
                                      Spacer(Modifier.height(12.dp))
                                      Row(
                                          modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(16.dp)).background(HeroGrad).border(1.dp, Color(0xFFFFD700).copy(alpha = 0.4f), RoundedCornerShape(16.dp)).padding(12.dp),
                                          horizontalArrangement = Arrangement.SpaceBetween,
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.weight(1f)) {
                                              FighterAvatar(mainBout.fighterA, 50.dp, true)
                                              Spacer(Modifier.width(8.dp))
                                              FighterAvatar(mainBout.fighterB, 50.dp, true)
                                              Spacer(Modifier.width(10.dp))
                                              Column {
                                                  Text("MAIN EVENT: ${mainBout.fighterA} vs. ${mainBout.fighterB}", color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Black)
                                                  Text("${mainBout.weightClass} • ${mainBout.liveOdds}", color = Color(0xFFFFD700), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                              }
                                          }
                                          Text("Full Card (${ev.bouts.size}) ➔", color = Color(0xFFFF1744), fontSize = 12.sp, fontWeight = FontWeight.Black)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun RosterSection(list: List<Fighter>, q: String, onQ: (String) -> Unit, div: String, onDiv: (String) -> Unit, cols: Int, onSel: (Fighter) -> Unit) {
              val divs = listOf("ALL", "MEN'S P4P", "WOMEN'S P4P", "CHAMPS", "HW", "LHW", "MW", "WW", "LW", "FW", "BW", "FLW", "WMMA")
              Column(Modifier.fillMaxSize()) {
                  Row(Modifier.fillMaxWidth().padding(bottom = 10.dp), verticalAlignment = Alignment.CenterVertically) {
                      OutlinedTextField(
                          value = q,
                          onValueChange = onQ,
                          label = { Text("Search any fighter (e.g., Conor McGregor, Holloway, Ireland)", fontSize = 13.sp) },
                          modifier = Modifier.weight(1f),
                          shape = RoundedCornerShape(18.dp),
                          singleLine = true
                      )
                      if (q.isNotBlank()) {
                          Spacer(Modifier.width(8.dp))
                          Button(onClick = { onQ("") }, shape = RoundedCornerShape(50), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF252534))) {
                              Text("Clear", color = Color.White, fontSize = 12.sp)
                          }
                      }
                  }

                  Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()).padding(bottom = 10.dp), Arrangement.spacedBy(8.dp)) {
                      divs.forEach { d ->
                          Button(
                              onClick = { onDiv(d) },
                              shape = RoundedCornerShape(50),
                              colors = ButtonDefaults.buttonColors(containerColor = if (div == d && q.isBlank()) Color(0xFFFF1744) else Color(0xFF202030)),
                              contentPadding = PaddingValues(horizontal = 14.dp, vertical = 6.dp)
                          ) { Text(d, fontSize = 12.sp, color = Color.White, fontWeight = FontWeight.Bold) }
                      }
                  }

                  val filtered = list.filter { f ->
                      if (q.isNotBlank()) {
                          f.name.contains(q, true) || f.division.contains(q, true) || f.nationality.contains(q, true) || f.nickname.contains(q, true)
                      } else {
                          when (div) {
                              "ALL" -> true
                              "MEN'S P4P" -> f.mensP4p > 0
                              "WOMEN'S P4P" -> f.womensP4p > 0
                              "CHAMPS" -> f.isChamp
                              else -> f.code.equals(div, true)
                          }
                      }
                  }.sortedWith(
                      when {
                          q.isNotBlank() -> compareBy({ !it.name.startsWith(q, true) }, { it.name })
                          div == "MEN'S P4P" -> compareBy { it.mensP4p }
                          div == "WOMEN'S P4P" -> compareBy { it.womensP4p }
                          else -> compareBy({ !it.isChamp }, { it.name })
                      }
                  )

                  LazyVerticalGrid(GridCells.Fixed(cols), verticalArrangement = Arrangement.spacedBy(10.dp), horizontalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxSize()) {
                      items(filtered) { f ->
                          Card(
                              modifier = Modifier.fillMaxWidth().border(1.dp, if (f.isChamp) Color(0xFFFFD700).copy(alpha = 0.65f) else Color(0xFF2A2A3E), RoundedCornerShape(20.dp)).clickable { onSel(f) },
                              shape = RoundedCornerShape(20.dp),
                              colors = CardDefaults.cardColors(containerColor = Color.Transparent)
                          ) {
                              Row(Modifier.fillMaxWidth().background(CardGrad).padding(14.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                  Row(Modifier.weight(1f), verticalAlignment = Alignment.CenterVertically) {
                                      FighterAvatar(f.name, 62.dp, f.isChamp)
                                      Spacer(Modifier.width(12.dp))
                                      Column {
                                          Text(f.name, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.ExtraBold)
                                          Text("${flagFor(f.nationality)} ${f.nationality} • ${f.division}", color = Color(0xFFC0C0D0), fontSize = 12.sp)
                                          Text("Tap for Next Fight, Career & Round Stats", color = Color(0xFFFF1744), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                      }
                                  }
                                  Column(horizontalAlignment = Alignment.End) {
                                      Text(f.rankLabel, color = Color(0xFFFFD700), fontSize = 11.sp, fontWeight = FontWeight.Black)
                                      Text(f.record, color = Color(0xFF00E676), fontSize = 15.sp, fontWeight = FontWeight.ExtraBold)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun FighterProfileModal(f: Fighter, upcoming: UpcomingBooking?, onDismiss: () -> Unit, onSelectPastFight: (PastFight) -> Unit) {
              var bio by remember(f.name) {
                  mutableStateOf(FighterBio(f.nationality, "5'10\"", "72\"", "Orthodox", f.record, f.nickname, emptyList()))
              }
              var loading by remember(f.name) { mutableStateOf(true) }

              LaunchedEffect(f.name) {
                  loading = true
                  bio = MmaRepository.fetchFighterBioAndHistory(f)
                  loading = false
              }

              Dialog(onDismissRequest = onDismiss, properties = DialogProperties(usePlatformDefaultWidth = false)) {
                  Card(Modifier.fillMaxWidth(0.95f).fillMaxHeight(0.92f).border(1.5.dp, Color(0xFFFF1744), RoundedCornerShape(26.dp)), shape = RoundedCornerShape(26.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF0F0F18))) {
                      Column(Modifier.fillMaxSize().padding(18.dp)) {
                          Row(Modifier.fillMaxWidth().clip(RoundedCornerShape(20.dp)).background(HeroGrad).padding(14.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                              Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.weight(1f)) {
                                  FighterAvatar(f.name, 80.dp, f.isChamp)
                                  Spacer(Modifier.width(14.dp))
                                  Column {
                                      Text(f.name, color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Black)
                                      Text(if (bio.nickname.isNotBlank() && bio.nickname != "MMA Pro") "\"${bio.nickname}\" • ${f.division}" else f.division, color = Color(0xFFFFD700), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                      Text("${flagFor(bio.nationality)} Nationality: ${bio.nationality}", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.SemiBold)
                                  }
                              }
                              Button(onClick = onDismiss, shape = RoundedCornerShape(50), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF28283A))) {
                                  Text("Close", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              }
                          }
                          Spacer(Modifier.height(8.dp))
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              StatPill(Modifier.weight(1f), "RECORD", bio.record, Color(0xFF00E676))
                              StatPill(Modifier.weight(1f), "HEIGHT", bio.height, Color.White)
                              StatPill(Modifier.weight(1f), "REACH", bio.reach, Color.White)
                              StatPill(Modifier.weight(1f), "STANCE", bio.stance, Color(0xFFFFD700))
                          }
                          Spacer(Modifier.height(10.dp))

                          Card(
                              modifier = Modifier.fillMaxWidth().border(1.dp, if (upcoming != null) Color(0xFF00E676) else Color(0xFF2A2A3E), RoundedCornerShape(16.dp)),
                              shape = RoundedCornerShape(16.dp),
                              colors = CardDefaults.cardColors(containerColor = if (upcoming != null) Color(0xFF10241E) else Color(0xFF161622))
                          ) {
                              Column(Modifier.padding(12.dp)) {
                                  if (upcoming != null) {
                                      Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                          Text("🥊 CONFIRMED UPCOMING FIGHT", color = Color(0xFF00E676), fontSize = 11.sp, fontWeight = FontWeight.Black)
                                          Text(upcoming.liveOdds, color = Color(0xFFFFD700), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                      }
                                      Spacer(Modifier.height(3.dp))
                                      Text("vs. ${upcoming.opponent} (${upcoming.placement} • ${upcoming.weightClass})", color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Black)
                                      Text("🏟️ ${upcoming.eventTitle}", color = Color(0xFFFFD700), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                      Text("📅 ${upcoming.dateTime} • 📍 ${upcoming.venue}", color = Color(0xFFD0D0E4), fontSize = 11.sp)
                                  } else {
                                      Text("🥊 UPCOMING FIGHT STATUS: No Confirmed Bout Announced on Current Schedule", color = Color(0xFF9090A8), fontSize = 11.sp, fontWeight = FontWeight.SemiBold)
                                  }
                              }
                          }

                          Spacer(Modifier.height(10.dp))
                          Text(if (loading) "SYNCING VERIFIED FIGHT RECORD..." else "COMPLETE CAREER HISTORY (${bio.fights.size} BOUTS) • TAP ANY FIGHT FOR ROUND STATS", color = Color(0xFFFFD700), fontSize = 11.sp, fontWeight = FontWeight.Black)
                          Spacer(Modifier.height(6.dp))
                          if (loading) LinearProgressIndicator(Modifier.fillMaxWidth(), color = Color(0xFFFF1744))
                          LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.weight(1f)) {
                              items(bio.fights) { h ->
                                  Card(
                                      modifier = Modifier.fillMaxWidth().border(1.dp, Color(0xFF28283A), RoundedCornerShape(18.dp)).clickable { onSelectPastFight(h) },
                                      shape = RoundedCornerShape(18.dp),
                                      colors = CardDefaults.cardColors(containerColor = Color.Transparent)
                                  ) {
                                      Row(Modifier.fillMaxWidth().background(CardGrad).padding(12.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                          Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.weight(1f)) {
                                              Box(Modifier.background(if (h.result == "WIN") Color(0xFF1B5E20) else if (h.result == "LOSS") Color(0xFFB71C1C) else Color(0xFF424242), RoundedCornerShape(8.dp)).padding(horizontal = 10.dp, vertical = 6.dp)) {
                                                  Text(h.result, color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Black)
                                              }
                                              Spacer(Modifier.width(12.dp))
                                              Column {
                                                  Text("vs. ${h.opponent}", color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.ExtraBold)
                                                  Text("${h.method} • R${h.round} (${h.time})", color = Color(0xFFFFD700), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                                  Text("🗓️ ${h.event} • ${h.dateYear}", color = Color(0xFFD0D0E0), fontSize = 11.sp)
                                                  Text("📍 ${h.location} • Tap for Round Stats ➔", color = Color(0xFFFF1744), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                              }
                                          }
                                          FighterAvatar(h.opponent, 46.dp)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun StatPill(mod: Modifier, label: String, value: String, vColor: Color) {
              Column(
                  modifier = mod.clip(RoundedCornerShape(14.dp)).background(Color(0xFF1A1A28)).border(1.dp, Color(0xFF2A2A3E), RoundedCornerShape(14.dp)).padding(vertical = 7.dp, horizontal = 6.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Text(label, color = Color(0xFF9090A8), fontSize = 9.sp, fontWeight = FontWeight.Bold)
                  Text(value, color = vColor, fontSize = 13.sp, fontWeight = FontWeight.Black, maxLines = 1)
              }
          }

          @Composable
          fun RoundByRoundStatsModal(fighterName: String, pf: PastFight, onDismiss: () -> Unit) {
              val rounds = remember(fighterName, pf) { PulseAiEngine.buildRoundStats(fighterName, pf) }
              Dialog(onDismissRequest = onDismiss, properties = DialogProperties(usePlatformDefaultWidth = false)) {
                  Card(
                      modifier = Modifier.fillMaxWidth(0.95f).fillMaxHeight(0.88f).border(1.5.dp, Color(0xFFFFD700), RoundedCornerShape(24.dp)),
                      shape = RoundedCornerShape(24.dp),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF101018))
                  ) {
                      Column(Modifier.fillMaxSize().padding(18.dp)) {
                          Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                              Column(Modifier.weight(1f)) {
                                  Text(pf.event, color = Color(0xFFFFD700), fontSize = 17.sp, fontWeight = FontWeight.Black)
                                  Text("📅 ${pf.dateYear} • 📍 ${pf.location}", color = Color(0xFFB8B8C8), fontSize = 12.sp)
                              }
                              Button(onClick = onDismiss, shape = RoundedCornerShape(50), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFF1744))) {
                                  Text("Back", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              }
                          }
                          Spacer(Modifier.height(12.dp))
                          Row(Modifier.fillMaxWidth().clip(RoundedCornerShape(18.dp)).background(HeroGrad).padding(14.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                              Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.weight(1f)) {
                                  FighterAvatar(fighterName, 56.dp, pf.result == "WIN")
                                  Spacer(Modifier.width(10.dp))
                                  Column {
                                      Text(fighterName, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Black)
                                      Text(pf.result, color = if (pf.result == "WIN") Color(0xFF00E676) else Color(0xFFFF1744), fontSize = 12.sp, fontWeight = FontWeight.Black)
                                  }
                              }
                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text("FINAL", color = Color(0xFFFFD700), fontSize = 11.sp, fontWeight = FontWeight.Black)
                                  Text("R${pf.round} • ${pf.time}", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                                  Text(pf.method, color = Color(0xFFB8B8C8), fontSize = 11.sp)
                              }
                              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.End, modifier = Modifier.weight(1f)) {
                                  Column(horizontalAlignment = Alignment.End) {
                                      Text(pf.opponent, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Black, textAlign = TextAlign.End)
                                      Text(if (pf.result == "WIN") "LOSS" else "WIN", color = if (pf.result == "WIN") Color(0xFFFF1744) else Color(0xFF00E676), fontSize = 12.sp, fontWeight = FontWeight.Black)
                                  }
                                  Spacer(Modifier.width(10.dp))
                                  FighterAvatar(pf.opponent, 56.dp, pf.result != "WIN")
                              }
                          }
                          Spacer(Modifier.height(12.dp))
                          Text("ROUND-BY-ROUND OFFICIAL TELEMETRY BREAKDOWN", color = Color(0xFFFF1744), fontSize = 12.sp, fontWeight = FontWeight.Black)
                          Spacer(Modifier.height(8.dp))

                          LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.weight(1f)) {
                              items(rounds) { r ->
                                  Card(Modifier.fillMaxWidth().border(1.dp, Color(0xFF28283A), RoundedCornerShape(18.dp)), shape = RoundedCornerShape(18.dp), colors = CardDefaults.cardColors(containerColor = Color.Transparent)) {
                                      Column(Modifier.background(CardGrad).padding(14.dp)) {
                                          Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                              Text("ROUND ${r.roundNum}", color = Color(0xFFFFD700), fontSize = 14.sp, fontWeight = FontWeight.Black)
                                              Text(r.scoreNote, color = Color(0xFF00E676), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                          }
                                          Spacer(Modifier.height(10.dp))
                                          StatBarRow("Significant Strikes", "${r.sigA} of ${r.sigAttA}", "${r.sigB} of ${r.sigAttB}", r.sigA, r.sigB)
                                          Spacer(Modifier.height(8.dp))
                                          StatBarRow("Total Strikes Landed", "${r.totA}", "${r.totB}", r.totA, r.totB)
                                          Spacer(Modifier.height(8.dp))
                                          StatBarRow("Takedowns Landed", "${r.tdA}", "${r.tdB}", r.tdA + 1, r.tdB + 1)
                                          Spacer(Modifier.height(8.dp))
                                          Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                              Text("Ctrl: ${r.ctrlA}", color = Color(0xFFB8B8C8), fontSize = 12.sp, fontWeight = FontWeight.SemiBold)
                                              Text("CAGE CONTROL TIME", color = Color.Gray, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                                              Text("Ctrl: ${r.ctrlB}", color = Color(0xFFB8B8C8), fontSize = 12.sp, fontWeight = FontWeight.SemiBold)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun StatBarRow(label: String, leftVal: String, rightVal: String, vA: Int, vB: Int) {
              Column(Modifier.fillMaxWidth()) {
                  Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                      Text(leftVal, color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                      Text(label.uppercase(), color = Color(0xFFB0B0C0), fontSize = 10.sp, fontWeight = FontWeight.Bold)
                      Text(rightVal, color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                  }
                  Spacer(Modifier.height(4.dp))
                  Row(Modifier.fillMaxWidth().height(7.dp).clip(RoundedCornerShape(4.dp))) {
                      Box(Modifier.weight(vA.coerceAtLeast(1).toFloat()).fillMaxHeight().background(CrimsonGrad))
                      Box(Modifier.weight(vB.coerceAtLeast(1).toFloat()).fillMaxHeight().background(Color(0xFF00B0FF)))
                  }
              }
          }

          @Composable
          fun NewsSection(list: List<NewsItem>, onClick: (NewsItem) -> Unit) {
              LazyColumn(verticalArrangement = Arrangement.spacedBy(12.dp), modifier = Modifier.fillMaxSize()) {
                  items(list) { item ->
                      Card(Modifier.fillMaxWidth().border(1.dp, Color(0xFF2A2A3C), RoundedCornerShape(20.dp)).clickable { onClick(item) }, shape = RoundedCornerShape(20.dp), colors = CardDefaults.cardColors(containerColor = Color.Transparent)) {
                          Column(Modifier.background(CardGrad).padding(16.dp)) {
                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                  Text(item.source, color = Color(0xFFFF1744), fontSize = 12.sp, fontWeight = FontWeight.Black)
                                  Text(item.pubDate, color = Color(0xFFB0B0C0), fontSize = 12.sp)
                              }
                              Spacer(Modifier.height(6.dp))
                              Text(item.title, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                              if (item.summary.isNotBlank()) {
                                  Spacer(Modifier.height(4.dp))
                                  Text(item.summary, color = Color(0xFFB0B0C0), fontSize = 13.sp, maxLines = 2)
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: MMA-Pulse-APK
          path: app/build/outputs/apk/debug/app-debug.apk
