name: Build MMA Pulse APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Project
        run: |
          rm -rf app settings.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/mma/pulse app/src/main/res/drawable
          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "MMAPulse"
          include(":app")
          EOF
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF
          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application") version "8.5.2"; id("org.jetbrains.kotlin.android") version "1.9.24" }
          android { namespace = "com.mma.pulse"; compileSdk = 35
            defaultConfig { applicationId = "com.mma.pulse.pro"; minSdk = 26; targetSdk = 35; versionCode = 43; versionName = "21.3" }
            buildFeatures { compose = true }; composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = "17" } }
          dependencies {
            implementation("androidx.core:core-ktx:1.15.0"); implementation("androidx.activity:activity-compose:1.10.0")
            implementation("androidx.compose.ui:ui:1.7.6"); implementation("androidx.compose.material3:material3:1.3.1")
            implementation("androidx.compose.foundation:foundation:1.7.6"); implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0") }
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_mma_pulse.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
          <path android:fillColor="#080810" android:pathData="M0,0h108v108h-108z"/>
          <path android:fillColor="#181224" android:strokeColor="#FF1744" android:strokeWidth="3.5" android:pathData="M36,12 L72,12 L96,36 L96,72 L72,96 L36,96 L12,72 L12,36 Z"/>
          </vector>
          EOF
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET"/>
          <application android:icon="@drawable/ic_mma_pulse" android:label="MMA Pulse" android:theme="@android:style/Theme.DeviceDefault.NoActionBar" android:usesCleartextTraffic="true">
          <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
          </application></manifest>
          EOF
          cat << 'EOF' > app/src/main/java/com/mma/pulse/MainActivity.kt
          package com.mma.pulse
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.URL
          data class Bout(val a:String,val b:String,val oa:String="",val ob:String="")
          data class Event(val name:String,val date:String,val bouts:List<Bout>,val done:Boolean,val promo:String="UFC")
          data class News(val title:String,val summary:String)
          object Repo {
            var events by mutableStateOf(listOf<Event>())
            var news by mutableStateOf(listOf<News>())
            var odds by mutableStateOf(mapOf<String,Pair<String,String>>())
            fun sync() = CoroutineScope(Dispatchers.IO).launch {
              try { fetchOdds(); fetchEvents(); fetchNews() } catch(_:Exception){}
            }
            private suspend fun fetchOdds() = withContext(Dispatchers.IO) {
              val key = "2092f68cd7ae933cb12006094338703b"
              val arr = JSONArray(URL("https://api.the-odds-api.com/v4/sports/mma_mixed_martial_arts/odds?regions=eu,uk,us&markets=h2h&oddsFormat=american&apiKey=$key").readText())
              val m = mutableMapOf<String,Pair<String,String>>()
              for(i in 0 until arr.length()) {
                val e = arr.getJSONObject(i)
                val home = e.optString("home_team"); val away = e.optString("away_team")
                var oa=""; var ob=""
                e.optJSONArray("bookmakers")?.let { bms ->
                  for(j in 0 until bms.length()) {
                    bms.getJSONObject(j).optJSONArray("markets")?.let { mkts ->
                      for(k in 0 until mkts.length()) {
                        if(mkts.getJSONObject(k).optString("key")=="h2h") {
                          mkts.getJSONObject(k).optJSONArray("outcomes")?.let { outs ->
                            for(o in 0 until outs.length()) {
                              val oc = outs.getJSONObject(o)
                              val price = oc.optInt("price")
                              val am = if(price>0) "+$price" else price.toString()
                              if(oc.optString("name").equals(home,true)) oa=am
                              if(oc.optString("name").equals(away,true)) ob=am
                            }
                          }
                        }
                      }
                    }
                  }
                }
                if(oa.isNotEmpty()) {
                  m["${home.lowercase()} vs ${away.lowercase()}"] = Pair(oa,ob)
                  m["${away.lowercase()} vs ${home.lowercase()}"] = Pair(ob,oa)
                }
              }
              odds = m
            }
            private suspend fun fetchEvents() = withContext(Dispatchers.IO) {
              val promos = listOf("ufc" to "UFC", "pfl" to "PFL", "bellator" to "Bellator")
              val list = mutableListOf<Event>()
              for((key,promo) in promos) {
                try {
                  val json = JSONObject(URL("https://site.api.espn.com/apis/site/v2/sports/mma/$key/scoreboard").readText())
                  json.optJSONArray("events")?.let { arr ->
                    for(i in 0 until arr.length()) {
                      val e = arr.getJSONObject(i)
                      val name = e.optString("name"); val date = e.optString("date")
                      val done = e.optJSONObject("status")?.optJSONObject("type")?.optString("state")=="post"
                      val bouts = mutableListOf<Bout>()
                      e.optJSONArray("competitions")?.let { comps ->
                        for(j in 0 until comps.length()) {
                          val c = comps.getJSONObject(j).optJSONArray("competitors") ?: continue
                          if(c.length()<2) continue
                          val na = c.getJSONObject(0).optJSONObject("athlete")?.optString("displayName")?:""
                          val nb = c.getJSONObject(1).optJSONObject("athlete")?.optString("displayName")?:""
                          val k = "${na.lowercase()} vs ${nb.lowercase()}"
                          val o = odds[k] ?: Pair("","")
                          bouts.add(Bout(na,nb,o.first,o.second))
                        }
                      }
                      list.add(Event(name,date,bouts,done,promo))
                    }
                  }
                } catch(_:Exception){}
              }
              events = list
            }
            private suspend fun fetchNews() = withContext(Dispatchers.IO) {
              val json = JSONObject(URL("https://site.api.espn.com/apis/site/v2/sports/mma/news").readText())
              val list = mutableListOf<News>()
              json.optJSONArray("articles")?.let { arr ->
                for(i in 0 until minOf(15,arr.length())) {
                  val a = arr.getJSONObject(i)
                  list.add(News(a.optString("headline"), a.optString("description")))
                }
              }
              news = list
            }
          }
          object AI {
            fun analyze(oa:String, ob:String): Pair<Int,Int> {
              fun p(o:String):Double { if(o.isBlank()) return 0.5; val n=o.replace("+","").toIntOrNull()?:0; return if(n>0) 100.0/(n+100) else (-n).toDouble()/((-n)+100) }
              val pa=p(oa); val pb=p(ob); val t=pa+pb
              val wa=((pa/t)*100).toInt().coerceIn(10,90); return Pair(wa,100-wa)
            }
          }class MainActivity: ComponentActivity() {
            override fun onCreate(s: Bundle?) { super.onCreate(s); setContent { App() } }
          }
          @Composable fun App() {
            var tab by remember { mutableStateOf(0) }
            val tabs = listOf("Live","Cards","AI","Markets","News")
            LaunchedEffect(Unit){ Repo.sync() }
            Scaffold(containerColor=Color(0xFF080810), bottomBar={
              NavigationBar(containerColor=Color(0xFF12121A)) {
                tabs.forEachIndexed { i,t -> NavigationBarItem(selected=tab==i, onClick={tab=i}, icon={}, label={Text(t,fontSize=11.sp)}) }
              }
            }) { p ->
              Box(Modifier.padding(p)) {
                when(tab) {
                  0 -> Live()
                  1 -> Cards()
                  2 -> AILab()
                  3 -> Markets()
                  4 -> News()
                }
              }
            }
          }
          @Composable fun Live() {
            val next = Repo.events.firstOrNull { !it.done }
            Column(Modifier.fillMaxSize().background(Color(0xFF080810)).padding(16.dp)) {
              Text("LIVE / NEXT", color=Color(0xFFFF1744), fontWeight=FontWeight.Bold, fontSize=20.sp)
              Spacer(Modifier.height(12.dp))
              if(next!=null) {
                Text(next.name, color=Color.White, fontWeight=FontWeight.Bold)
                next.bouts.take(1).forEach { Text("${it.a} vs ${it.b}", color=Color(0xFF00E676), fontSize=18.sp) }
              } else Text("No upcoming events", color=Color.Gray)
            }
          }
          @Composable fun Cards() {
            LazyColumn(Modifier.fillMaxSize().background(Color(0xFF080810)).padding(16.dp)) {
              item { Text("FIGHT CARDS", color=Color(0xFFFF1744), fontWeight=FontWeight.Bold, fontSize=20.sp) }
              items(Repo.events) { e ->
                Card(Modifier.fillMaxWidth().padding(vertical=6.dp), colors=CardDefaults.cardColors(containerColor=Color(0xFF1A1A28)), shape=RoundedCornerShape(14.dp)) {
                  Column(Modifier.padding(12.dp)) {
                    Text(e.name, color=Color.White, fontWeight=FontWeight.Bold)
                    Text("${e.promo} • ${e.date.take(10)}", color=Color.Gray, fontSize=12.sp)
                    e.bouts.take(4).forEach { b ->
                      Text("${b.a} vs ${b.b}", color=Color(0xFF00E676), fontSize=13.sp)
                      if(b.oa.isNotEmpty()) Text("${b.oa} | ${b.ob}", color=Color(0xFFFFD700), fontSize=11.sp)
                    }
                  }
                }
              }
            }
          }
          @Composable fun AILab() {
            LazyColumn(Modifier.fillMaxSize().background(Color(0xFF080810)).padding(16.dp)) {
              item { Text("PULSE AI", color=Color(0xFFFF1744), fontWeight=FontWeight.Bold, fontSize=20.sp) }
              items(Repo.events.filter{!it.done}.flatMap{it.bouts}) { b ->
                val (wa,wb) = AI.analyze(b.oa,b.ob)
                Card(Modifier.fillMaxWidth().padding(vertical=6.dp), colors=CardDefaults.cardColors(containerColor=Color(0xFF1A1A28)), shape=RoundedCornerShape(14.dp)) {
                  Column(Modifier.padding(12.dp)) {
                    Text("${b.a} vs ${b.b}", color=Color.White, fontWeight=FontWeight.Bold)
                    Text("${b.a}: $wa%   |   ${b.b}: $wb%", color=Color(0xFF00E676))
                    if(b.oa.isNotEmpty()) Text("Odds ${b.oa} / ${b.ob}", color=Color(0xFFFFD700), fontSize=12.sp)
                  }
                }
              }
            }
          }
          @Composable fun Markets() {
            LazyColumn(Modifier.fillMaxSize().background(Color(0xFF080810)).padding(16.dp)) {
              item { Text("MARKETS (EU)", color=Color(0xFFFF1744), fontWeight=FontWeight.Bold, fontSize=20.sp) }
              items(Repo.events.filter{!it.done}.flatMap{it.bouts}.filter{it.oa.isNotEmpty()}) { b ->
                Card(Modifier.fillMaxWidth().padding(vertical=6.dp), colors=CardDefaults.cardColors(containerColor=Color(0xFF1A1A28)), shape=RoundedCornerShape(14.dp)) {
                  Column(Modifier.padding(12.dp)) {
                    Text("${b.a} vs ${b.b}", color=Color.White, fontWeight=FontWeight.Bold)
                    Text("${b.a}: ${b.oa}", color=Color(0xFFFFD700))
                    Text("${b.b}: ${b.ob}", color=Color(0xFFFFD700))
                  }
                }
              }
            }
          }
          @Composable fun News() {
            LazyColumn(Modifier.fillMaxSize().background(Color(0xFF080810)).padding(16.dp)) {
              item { Text("NEWS", color=Color(0xFFFF1744), fontWeight=FontWeight.Bold, fontSize=20.sp) }
              items(Repo.news) { n ->
                Card(Modifier.fillMaxWidth().padding(vertical=6.dp), colors=CardDefaults.cardColors(containerColor=Color(0xFF1A1A28)), shape=RoundedCornerShape(14.dp)) {
                  Column(Modifier.padding(12.dp)) {
                    Text(n.title, color=Color.White, fontWeight=FontWeight.Bold)
                    Text(n.summary, color=Color.Gray, fontSize=13.sp, maxLines=3)
                  }
                }
              }
            }
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MMA-Pulse-APK
          path: app/build/outputs/apk/debug/app-debug.apk
