          fun inferVenue(ev: String, wikiLoc: String = ""): String {
              if (wikiLoc.isNotBlank() && wikiLoc.length > 3) return wikiLoc
              val e = ev.lowercase()
              return when {
                  e.contains("vegas") || e.contains("apex") -> "Meta APEX, Las Vegas, NV, USA"
                  e.contains("paris") -> "Accor Arena, Paris, France"
                  e.contains("abu dhabi") || e.contains("308") || e.contains("294") || e.contains("321") -> "Etihad Arena, Abu Dhabi, UAE"
                  e.contains("london") || e.contains("286") -> "The O2 Arena, London, UK"
