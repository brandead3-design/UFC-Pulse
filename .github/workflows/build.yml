              private fun httpGet(u: String): String = try {
                  val c = (URL(u).openConnection() as HttpURLConnection).apply {
                      connectTimeout = 6000; readTimeout = 6000
                      setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 17; SM-F971B)")
                  }
                  if (c.responseCode in 200..299) c.inputStream.bufferedReader().use { it.readText() } else ""
              } catch (_: Throwable) { "" }

              suspend fun fetchNews(): List<NewsItem> = withContext(Dispatchers.IO) {
                  val out = mutableListOf<NewsItem>()
                  try {
                      val arr = JSONObject(httpGet("https://site.api.espn.com/apis/site/v2/sports/mma/ufc/news")).optJSONArray("articles")
                      if (arr != null) for (i in 0 until arr.length()) {
                          val a = arr.getJSONObject(i)
                          val h = a.optString("headline").trim()
                          val d = a.optString("description").trim()
                          val p = a.optString("published").take(16).replace("T", " ")
                          val l = a.optJSONObject("links")?.optJSONObject("web")?.optString("href") ?: "https://www.ufc.com"
                          if (h.isNotBlank()) out.add(NewsItem(h, "ESPN UFC", p, l, d))
                      }
                  } catch (_: Throwable) {}
                  try {
                      val xml = httpGet("https://www.sherdog.com/rss/news.xml")
                      if (xml.isNotBlank()) {
                          val xp = Xml.newPullParser().apply { setInput(StringReader(xml)) }
                          var ev = xp.eventType; var inItem = false; var t = ""; var l = ""; var d = ""
                          while (ev != XmlPullParser.END_DOCUMENT) {
                              val n = xp.name ?: ""
                              if (ev == XmlPullParser.START_TAG) {
                                  if (n.equals("item", true)) { inItem = true; t = ""; l = ""; d = "" }
                                  else if (inItem && n.equals("title", true)) t = try { xp.nextText().trim() } catch (_: Throwable) { "" }
                                  else if (inItem && n.equals("link", true)) l = try { xp.nextText().trim() } catch (_: Throwable) { "" }
                                  else if (inItem && n.equals("description", true)) d = try { xp.nextText().replace(Regex("<.*?>"), "").trim() } catch (_: Throwable) { "" }
                              } else if (ev == XmlPullParser.END_TAG && n.equals("item", true) && inItem) {
                                  if (t.isNotBlank()) out.add(NewsItem(t, "Sherdog RSS", "Latest", l.ifBlank { "https://www.sherdog.com" }, d))
                                  inItem = false
                              }
                              ev = xp.next()
                          }
                      }
                  } catch (_: Throwable) {}
                  if (out.isEmpty()) listOf(
                      NewsItem("UFC Fight Night Live Results, Odds & Round Predictions", "UFC Pulse", "Live Now", "https://www.ufc.com", "Live round-by-round octagon tracking and fighter odds."),
                      NewsItem("UFC 334 & UFC 335 Title Fight Cards Official", "UFC Pulse", "Breaking", "https://www.ufc.com", "Full PPV and Fight Night schedules converted to local GMT/IST time.")
                  ) else out
              }
          }

          object Notifier {
              private const val RSS_CH = "ufc_rss_v11"
              private const val BAR_CH = "ufc_bar_v11"

              fun init(ctx: Context) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                          nm.createNotificationChannel(NotificationChannel(RSS_CH, "UFC RSS Alerts", NotificationManager.IMPORTANCE_HIGH))
                          nm.createNotificationChannel(NotificationChannel(BAR_CH, "One UI Live Fight Ticker", NotificationManager.IMPORTANCE_DEFAULT).apply { setSound(null, null) })
                      }
                  } catch (_: Throwable) {}
              }

              private fun canNotify(ctx: Context): Boolean = Build.VERSION.SDK_INT < 33 ||
                  ContextCompat.checkSelfPermission(ctx, Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED

              fun sendRss(ctx: Context, title: String, src: String, url: String) {
                  try {
                      if (!canNotify(ctx)) return
                      init(ctx)
                      val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      val id = (title.hashCode() and 0x7FFFFFFF)
                      val pi = PendingIntent.getActivity(ctx, id, Intent(Intent.ACTION_VIEW, Uri.parse(if (url.startsWith("http")) url else "https://www.ufc.com")), PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                      val n = NotificationCompat.Builder(ctx, RSS_CH)
                          .setSmallIcon(android.R.drawable.ic_popup_reminder)
                          .setContentTitle("UFC News • $src").setContentText(title)
                          .setPriority(NotificationCompat.PRIORITY_HIGH).setContentIntent(pi).setAutoCancel(true).build()
                      nm.notify(id, n)
                  } catch (_: Throwable) {}
              }

              fun updateLiveBar(ctx: Context, m: LiveMatchState, active: Boolean) {
                  try {
                      val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      if (!active) { nm.cancel(11001); return }
                      if (!canNotify(ctx)) return
                      init(ctx)
                      val pi = PendingIntent.getActivity(ctx, 11001, Intent(ctx, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                      val title = "R${m.round} (${m.time}) • ${m.fighterA} (${m.oddsA}) vs ${m.fighterB} (${m.oddsB})"
                      val body = "${m.prediction} | ${m.status}"
                      val n = NotificationCompat.Builder(ctx, BAR_CH)
                          .setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentTitle(title).setContentText(body)
                          .setSubText("One UI Live Ticker • ${m.probA}%/${m.probB}%")
                          .setStyle(NotificationCompat.BigTextStyle().bigText(body))
                          .setOngoing(true).setOnlyAlertOnce(true)
                          .setProgress(100, m.probA.coerceIn(0, 100), false)
                          .setContentIntent(pi).build()
                      nm.notify(11001, n)
                  } catch (_: Throwable) {}
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  try {
                      Notifier.init(this)
                      if (Build.VERSION.SDK_INT >= 33 && ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 101)
                      }
                  } catch (_: Throwable) {}
                  setContent {
                      MaterialTheme(darkColorScheme(primary = Color(0xFFD20A0A), background = Color(0xFF0A0A0C), surface = Color(0xFF16161B))) {
                          UfcApp()
                      }
                  }
              }
          }

          fun nextRound(m: LiveMatchState): LiveMatchState = when (m.round) {
              "1" -> m.copy(round = "2", time = "3:18", oddsA = "-185", oddsB = "+155", probA = 64, probB = 36, strikesA = m.strikesA + 18, strikesB = m.strikesB + 11, tdA = m.tdA + 1, status = "${m.fighterA} secures body-lock takedown against the cage.", prediction = "Live AI Pick: ${m.fighterA} via Dec/Sub (64% prob)")
              "2" -> m.copy(round = "3", time = "2:05", oddsA = "-290", oddsB = "+230", probA = 76, probB = 24, strikesA = m.strikesA + 24, strikesB = m.strikesB + 9, tdA = m.tdA + 1, status = "${m.fighterA} takes the back in R3 and threatens rear-naked choke.", prediction = "Live AI Pick: ${m.fighterA} Heavy Favorite via Sub/TKO (76% prob)")
              "3" -> m.copy(round = "4", time = "1:40", oddsA = "-450", oddsB = "+340", probA = 84, probB = 16, strikesA = m.strikesA + 21, strikesB = m.strikesB + 12, status = "${m.fighterA} ahead 30-27 on live scorecards entering championship rounds.", prediction = "Live AI Pick: ${m.fighterA} Decision Lock (84% prob)")
              "4" -> m.copy(round = "FINAL", time = "5:00", oddsA = "-900", oddsB = "+600", probA = 95, probB = 5, status = "OFFICIAL RESULT: ${m.fighterA} def. ${m.fighterB} via Unanimous Decision (49-46, 49-46, 48-47).", prediction = "Final Verified Result: ${m.fighterA} Winner")
              else -> m.copy(round = "1", time = "4:12", oddsA = "-155", oddsB = "+130", probA = 56, probB = 44, strikesA = 12, strikesB = 10, tdA = 0, tdB = 0, status = "Round 1 underway. Fighters trading calf kicks in center Octagon.", prediction = "Live AI Pick: Opening Round Toss-Up • ${m.fighterA} (56%)")
          }

          @Composable
          fun UfcApp() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              val isFold8 = LocalConfiguration.current.screenWidthDp >= 600
              var tab by remember { mutableIntStateOf(0) }
              var threePane by remember { mutableStateOf(false) }
              var pinBar by remember { mutableStateOf(true) }
              var live by remember { mutableStateOf(UfcData.defaultLive) }
              var news by remember { mutableStateOf<List<NewsItem>>(emptyList()) }
              var loading by remember { mutableStateOf(true) }
              var search by remember { mutableStateOf("") }
              var divFilter by remember { mutableStateOf("ALL") }
              var evFilter by remember { mutableStateOf("ALL") }

              fun sync() {
                  loading = true
                  scope.launch {
                      val fetched = UfcData.fetchNews()
                      news = fetched
                      loading = false
                      Notifier.updateLiveBar(ctx, live, pinBar)
                  }
              }
              LaunchedEffect(Unit) { sync() }

              Column(Modifier.fillMaxSize().background(Color(0xFF0A0A0C))) {
                  Row(Modifier.fillMaxWidth().background(Color(0xFF121216)).padding(12.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                      Column(Modifier.weight(1f)) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text("UFC PULSE PRO", color = Color(0xFFD20A0A), fontSize = 18.sp, fontWeight = FontWeight.Black)
                              Spacer(Modifier.width(8.dp))
                              Text(if (isFold8) "FOLD 8 4:3" else "COVER", color = Color(0xFFFFD700), fontSize = 10.sp, fontWeight = FontWeight.Bold)
                          }
                          Text("Live Tracker • Odds • Predictor • GMT/IST", color = Color.Gray, fontSize = 11.sp)
                      }
                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          if (isFold8) {
                              Button(onClick = { threePane = !threePane }, colors = ButtonDefaults.buttonColors(containerColor = if (threePane) Color(0xFFFFD700) else Color(0xFF262630)), contentPadding = PaddingValues(10.dp, 4.dp)) {
                                  Text(if (threePane) "3-Pane: ON" else "3-Pane", fontSize = 11.sp, color = if (threePane) Color.Black else Color.White, fontWeight = FontWeight.Bold)
                              }
                          }
                          Button(onClick = { Notifier.sendRss(ctx, news.firstOrNull()?.title ?: "UFC Fight Night Live Update", "UFC RSS", "https://www.ufc.com") }, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF262630)), contentPadding = PaddingValues(10.dp, 4.dp)) {
                              Text("Test Alert", fontSize = 11.sp, color = Color.White)
                          }
                          Button(onClick = { sync() }, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFD20A0A)), contentPadding = PaddingValues(10.dp, 4.dp)) {
                              Text("Sync", fontSize = 11.sp, color = Color.White, fontWeight = FontWeight.Bold)
                          }
                      }
                  }
                  if (!(isFold8 && threePane)) {
                      TabRow(selectedTabIndex = tab, containerColor = Color(0xFF121216), contentColor = Color(0xFFD20A0A)) {
                          Tab(tab == 0, { tab = 0 }, text = { Text("Live Tracker", fontSize = 12.sp) })
                          Tab(tab == 1, { tab = 1 }, text = { Text("RSS (${news.size})", fontSize = 12.sp) })
                          Tab(tab == 2, { tab = 2 }, text = { Text("Events", fontSize = 12.sp) })
                          Tab(tab == 3, { tab = 3 }, text = { Text("Roster", fontSize = 12.sp) })
                      }
                  }
                  if (isFold8 && threePane) {
                      Row(Modifier.fillMaxSize().padding(12.dp), Arrangement.spacedBy(14.dp)) {
                          Box(Modifier.weight(1f)) { LivePane(live, pinBar, { pinBar = !pinBar; Notifier.updateLiveBar(ctx, live, pinBar) }, { live = nextRound(live); Notifier.updateLiveBar(ctx, live, pinBar) }) }
                          Box(Modifier.weight(1f)) { NewsPane(news) { openUrlSafely(ctx, it.link) } }
                          Box(Modifier.weight(1f)) { EventsPane(UfcData.seedEvents, "ALL") }
                      }
                  } else {
                      when (tab) {
                          0 -> if (isFold8) {
                              Row(Modifier.fillMaxSize().padding(14.dp), Arrangement.spacedBy(16.dp)) {
                                  Box(Modifier.weight(1f)) { LivePane(live, pinBar, { pinBar = !pinBar; Notifier.updateLiveBar(ctx, live, pinBar) }, { live = nextRound(live); Notifier.updateLiveBar(ctx, live, pinBar) }) }
                                  Box(Modifier.weight(1f)) { EventsPane(UfcData.seedEvents, "ALL") }
                              }
                          } else Box(Modifier.fillMaxSize().padding(12.dp)) { LivePane(live, pinBar, { pinBar = !pinBar; Notifier.updateLiveBar(ctx, live, pinBar) }, { live = nextRound(live); Notifier.updateLiveBar(ctx, live, pinBar) }) }
                          1 -> Box(Modifier.fillMaxSize().padding(12.dp)) { NewsPane(news) { openUrlSafely(ctx, it.link) } }
                          2 -> Column(Modifier.fillMaxSize().padding(12.dp)) {
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.padding(bottom = 8.dp)) {
                                  listOf("ALL", "PPV", "FIGHT NIGHT").forEach { f ->
                                      Button(onClick = { evFilter = f }, colors = ButtonDefaults.buttonColors(containerColor = if (evFilter == f) Color(0xFFD20A0A) else Color(0xFF22222A))) { Text(f, fontSize = 12.sp, color = Color.White) }
                                  }
                              }
                              EventsPane(UfcData.seedEvents, evFilter)
                          }
                          3 -> Box(Modifier.fillMaxSize().padding(12.dp)) { RosterPane(UfcData.seedRoster, search, { search = it }, divFilter, { divFilter = it }, if (isFold8) 2 else 1) }
                      }
                  }
              }
          }

          @Composable
          fun LivePane(m: LiveMatchState, pinned: Boolean, onPin: () -> Unit, onStep: () -> Unit) {
              LazyColumn(verticalArrangement = Arrangement.spacedBy(12.dp), modifier = Modifier.fillMaxSize()) {
                  item {
                      Card(Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = Color(0xFF181822)), shape = RoundedCornerShape(16.dp)) {
                          Row(Modifier.fillMaxWidth().padding(14.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                              Column(Modifier.weight(1f)) {
                                  Text(if (pinned) "● ONE UI NOW BAR / LIVE STATUS PILL ACTIVE" else "○ ONE UI NOW BAR PAUSED", color = if (pinned) Color(0xFF4CAF50) else Color.Gray, fontSize = 10.sp, fontWeight = FontWeight.Black)
                                  Text("${m.fighterA} (${m.oddsA}) vs ${m.fighterB} (${m.oddsB})", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                                  Text("R${m.round} • ${m.prediction}", color = Color(0xFFFFD700), fontSize = 11.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                              }
                              Button(onClick = onPin, colors = ButtonDefaults.buttonColors(containerColor = if (pinned) Color(0xFF2B2B38) else Color(0xFFD20A0A))) {
                                  Text(if (pinned) "Unpin" else "Pin Bar", fontSize = 11.sp, color = Color.White)
                              }
                          }
                      }
                  }
                  item {
                      Card(Modifier.fillMaxWidth().border(1.dp, Color(0xFFD20A0A), RoundedCornerShape(12.dp)), colors = CardDefaults.cardColors(containerColor = Color(0xFF16161B)), shape = RoundedCornerShape(12.dp)) {
                          Column(Modifier.padding(16.dp)) {
                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                  Text("● LIVE OCTAGON TRACKER", color = Color(0xFFFF4500), fontSize = 11.sp, fontWeight = FontWeight.Black)
                                  Text("Round ${m.round} • ${m.time}", color = Color(0xFF4CAF50), fontSize = 12.sp, fontWeight = FontWeight.ExtraBold)
                              }
                              Text("${m.eventTitle} • ${m.weightClass}", color = Color.Gray, fontSize = 12.sp)
                              Spacer(Modifier.height(12.dp))
                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                  Column(Modifier.weight(1f)) {
                                      Text(m.fighterA, color = Color.White, fontSize = 17.sp, fontWeight = FontWeight.Black)
                                      Text("Record: ${m.recordA}", color = Color.Gray, fontSize = 12.sp)
                                      Text("Live Odds: ${m.oddsA}", color = Color(0xFFFFD700), fontSize = 13.sp, fontWeight = FontWeight.Bold)
                                  }
                                  Text("VS", color = Color(0xFFD20A0A), fontSize = 15.sp, fontWeight = FontWeight.Black)
                                  Column(Modifier.weight(1f), horizontalAlignment = Alignment.End) {
                                      Text(m.fighterB, color = Color.White, fontSize = 17.sp, fontWeight = FontWeight.Black)
                                      Text("Record: ${m.recordB}", color = Color.Gray, fontSize = 12.sp)
                                      Text("Live Odds: ${m.oddsB}", color = Color(0xFFFFD700), fontSize = 13.sp, fontWeight = FontWeight.Bold)
                                  }
                              }
                              Spacer(Modifier.height(12.dp))
                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                  Text("${m.fighterA} (${m.probA}%)", color = Color(0xFFD20A0A), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                  Text("${m.fighterB} (${m.probB}%)", color = Color(0xFF2196F3), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              }
                              Spacer(Modifier.height(4.dp))
                              Row(Modifier.fillMaxWidth().height(10.dp).clip(RoundedCornerShape(5.dp))) {
                                  Box(Modifier.weight(m.probA.coerceAtLeast(5).toFloat()).fillMaxHeight().background(Color(0xFFD20A0A)))
                                  Box(Modifier.weight(m.probB.coerceAtLeast(5).toFloat()).fillMaxHeight().background(Color(0xFF2196F3)))
                              }
                              Spacer(Modifier.height(12.dp))
                              Row(Modifier.fillMaxWidth().background(Color(0xFF1E1E26), RoundedCornerShape(8.dp)).padding(10.dp), Arrangement.SpaceBetween) {
                                  Text("Strikes: ${m.strikesA}", color = Color.White, fontSize = 12.sp)
                                  Text("TD: ${m.tdA} - ${m.tdB}", color = Color(0xFFFFD700), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                  Text("Strikes: ${m.strikesB}", color = Color.White, fontSize = 12.sp)
                              }
                              Spacer(Modifier.height(12.dp))
                              Card(Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = Color(0xFF20202A)), shape = RoundedCornerShape(8.dp)) {
                                  Column(Modifier.padding(12.dp)) {
                                      Text("LIVE RESULT PREDICTION AS FIGHT PLAYS OUT", color = Color(0xFF4CAF50), fontSize = 10.sp, fontWeight = FontWeight.Black)
                                      Text(m.prediction, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold)
                                      Text(m.status, color = Color(0xFFC0C0C8), fontSize = 12.sp)
                                  }
                              }
                              Spacer(Modifier.height(12.dp))
                              Button(onClick = onStep, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFD20A0A))) {
                                  Text("Simulate Next Live Round & Update Now Bar ➔", color = Color.White, fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun NewsPane(list: List<NewsItem>, onClick: (NewsItem) -> Unit) {
              LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxSize()) {
                  items(list) { item ->
                      Card(Modifier.fillMaxWidth().clickable { onClick(item) }, colors = CardDefaults.cardColors(containerColor = Color(0xFF16161B)), shape = RoundedCornerShape(10.dp)) {
                          Column(Modifier.padding(14.dp)) {
                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                  Text(item.source, color = Color(0xFFD20A0A), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                  Text(item.pubDate, color = Color.Gray, fontSize = 11.sp)
                              }
                              Spacer(Modifier.height(4.dp))
                              Text(item.title, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                              if (item.summary.isNotBlank()) Text(item.summary, color = Color(0xFFB0B0B8), fontSize = 13.sp, maxLines = 2)
                          }
                      }
                  }
              }
          }

          @Composable
          fun EventsPane(list: List<UfcEvent>, filter: String) {
              val filtered = list.filter { filter == "ALL" || it.type == filter }
              LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxSize()) {
                  items(filtered) { ev ->
                      Card(Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = Color(0xFF16161B)), shape = RoundedCornerShape(10.dp)) {
                          Column(Modifier.padding(14.dp)) {
                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                  Text(ev.type, color = if (ev.type == "PPV") Color(0xFFFFD700) else Color(0xFFD20A0A), fontSize = 11.sp, fontWeight = FontWeight.ExtraBold)
                                  Text(ev.localTime, color = Color(0xFF4CAF50), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                              }
                              Text(ev.title, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                              Text(ev.venue, color = Color.Gray, fontSize = 12.sp)
                              Spacer(Modifier.height(8.dp))
                              ev.bouts.forEach { b ->
                                  Column(Modifier.fillMaxWidth().padding(vertical = 3.dp)) {
                                      Text("• ${b.boutName}", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                                      Row(Modifier.fillMaxWidth().padding(start = 10.dp), Arrangement.SpaceBetween) {
                                          Text("Odds: ${b.odds}", color = Color(0xFFFFD700), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                          Text(b.prediction, color = Color(0xFF4CAF50), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun RosterPane(list: List<Fighter>, q: String, onQ: (String) -> Unit, div: String, onDiv: (String) -> Unit, cols: Int) {
              val divs = listOf("ALL", "CHAMPS", "HW", "LHW", "MW", "WW", "LW", "FW", "BW", "FLW", "WMMA")
              Column(Modifier.fillMaxSize()) {
                  OutlinedTextField(q, onQ, label = { Text("Search fighter or division") }, modifier = Modifier.fillMaxWidth().padding(bottom = 8.dp), singleLine = true)
                  Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()).padding(bottom = 8.dp), Arrangement.spacedBy(6.dp)) {
                      divs.forEach { d ->
                          Button(onClick = { onDiv(d) }, colors = ButtonDefaults.buttonColors(containerColor = if (div == d) Color(0xFFD20A0A) else Color(0xFF22222A)), contentPadding = PaddingValues(10.dp, 2.dp)) {
                              Text(d, fontSize = 11.sp, color = Color.White)
                          }
                      }
                  }
                  val filtered = list.filter { (it.name.contains(q, true) || it.division.contains(q, true)) && (div == "ALL" || (div == "CHAMPS" && it.isChamp) || it.code == div) }
                  LazyVerticalGrid(GridCells.Fixed(cols), verticalArrangement = Arrangement.spacedBy(8.dp), horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxSize()) {
                      items(filtered) { f ->
                          Card(Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = Color(0xFF16161B)), shape = RoundedCornerShape(8.dp)) {
                              Row(Modifier.fillMaxWidth().padding(12.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                  Column(Modifier.weight(1f)) {
                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          Text(f.name, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold)
                                          if (f.isChamp) {
                                              Spacer(Modifier.width(6.dp))
                                              Text("CHAMP", color = Color(0xFFFFD700), fontSize = 9.sp, fontWeight = FontWeight.Black)
                                          }
                                      }
                                      Text("${f.division} • Odds: ${f.odds}", color = Color.Gray, fontSize = 11.sp)
                                  }
                                  Column(horizontalAlignment = Alignment.End) {
                                      Text(f.record, color = Color(0xFF4CAF50), fontSize = 15.sp, fontWeight = FontWeight.ExtraBold)
                                      Text("W - L - D", color = Color.Gray, fontSize = 9.sp)
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: UFC-Pulse-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
