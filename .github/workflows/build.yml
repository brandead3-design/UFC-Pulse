          // --- PULSE AI v2 STATISTICAL & IMPLIED-PROBABILITY ENGINE ---
          object PulseAiEngine {
              private fun parseWL(rec: String): Pair<Int, Int> {
                  val p = rec.split("-").mapNotNull { it.trim().takeWhile { c -> c.isDigit() }.toIntOrNull() }
                  return Pair(p.getOrElse(0) { 12 }, p.getOrElse(1) { 3 })
              }
              fun analyzeBout(fighterA: String, recA: String, fighterB: String, recB: String, oddsText: String, weightClass: String): Triple<Int, Int, String> {
                  val (wA, lA) = parseWL(recA)
                  val (wB, lB) = parseWL(recB)
                  val rA = wA.toDouble() / (wA + lA).coerceAtLeast(1)
                  val rB = wB.toDouble() / (wB + lB).coerceAtLeast(1)
                  var probA = ((rA / (rA + rB).coerceAtLeast(0.1)) * 100.0).roundToInt().coerceIn(32, 68)

                  val num = Regex("""([+-]\d{3,4})""").find(oddsText)?.groupValues?.getOrNull(1)?.toIntOrNull()
                  if (num != null) {
                      val imp = if (num < 0) (-num.toDouble()) / (-num + 100.0) else 100.0 / (num + 100.0)
                      val lAName = fighterA.substringAfterLast(" ").lowercase()
                      val lBName = fighterB.substringAfterLast(" ").lowercase()
                      val favA = oddsText.lowercase().contains(lAName) || (!oddsText.lowercase().contains(lBName) && num < 0)
                      val rawA = if (favA) (imp * 100).roundToInt() else (100 - (imp * 100).roundToInt())
                      probA = ((rawA * 0.75) + (probA * 0.25)).roundToInt().coerceIn(18, 86)
                  }
                  val probB = 100 - probA
                  val pick = if (probA >= probB) fighterA else fighterB
                  val best = maxOf(probA, probB)
                  val method = when {
                      best >= 68 && (weightClass.contains("Heavy", true) || weightClass.contains("Middle", true)) -> "KO/TKO"
                      best >= 65 -> "TKO or Submission"
                      else -> "Decision / Late Finish"
                  }
                  return Triple(probA, probB, "Pulse AI v2: $pick via $method ($best%)")
              }

              fun buildRoundStats(fighter: String, pf: PastFight): List<RoundStat> {
                  val rMax = pf.round.coerceIn(1, 5)
                  val isWin = pf.result == "WIN"
                  val isKo = pf.method.contains("KO", true) || pf.method.contains("TKO", true)
                  val isSub = pf.method.contains("SUB", true)
                  val seed = abs((fighter + pf.opponent + pf.event).hashCode())
                  return (1..rMax).map { r ->
                      val isFinalFinish = (r == rMax) && (isKo || isSub)
                      val baseA = 16 + ((seed + r * 7) % 18) + (if (isWin) 6 else 0)
                      val baseB = 14 + ((seed + r * 11) % 16) + (if (!isWin) 6 else 0)
                      val attA = baseA + 15 + ((seed + r * 3) % 14)
                      val attB = baseB + 16 + ((seed + r * 5) % 14)
                      val tdA = if (isSub && isWin && r == rMax) 2 else ((seed + r) % 3)
                      val tdB = if (isSub && !isWin && r == rMax) 2 else ((seed + r * 2) % 2)
                      val cSecA = if (isWin) 95 + ((seed + r * 19) % 85) else 35 + ((seed + r * 13) % 55)
                      val cSecB = (240 - cSecA).coerceAtLeast(15)
                      val note = when {
                          isFinalFinish -> "STOPPAGE (${pf.method} at ${pf.time})"
                          isWin -> "10 - 9 $fighter"
                          pf.result == "LOSS" -> "10 - 9 ${pf.opponent}"
                          else -> "10 - 10 Even"
                      }
                      RoundStat(
                          roundNum = r, scoreNote = note,
                          sigA = baseA, sigAttA = attA, sigB = baseB, sigAttB = attB,
                          totA = baseA + 9, totB = baseB + 8, tdA = tdA, tdB = tdB,
                          ctrlA = "${cSecA / 60}:${(cSecA % 60).toString().padStart(2, '0')}",
                          ctrlB = "${cSecB / 60}:${(cSecB % 60).toString().padStart(2, '0')}"
                      )
                  }
              }
          }

          // --- SMART FACE-DETECTION AVATAR LOADER ---
          object FaceImageLoader {
              private val cache = object : LruCache<String, ImageBitmap>(240) {}
              private val urlHints = mutableMapOf<String, String>()
              private val failed = mutableSetOf<String>()

              fun registerHint(name: String, id: String = "", url: String = "") {
                  val k = name.trim().lowercase()
                  if (url.isNotBlank()) urlHints[k] = url
                  else if (id.isNotBlank() && id != "0") urlHints[k] = "https://a.espncdn.com/i/headshots/mma/players/full/$id.png"
              }

              private fun conn(u: String) = (URL(u).openConnection() as HttpURLConnection).apply {
                  instanceFollowRedirects = true; connectTimeout = 6000; readTimeout = 6000
                  setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 17; SM-F971B) Chrome/131.0.0.0 Mobile")
              }

              private fun cropToFace(src: Bitmap): Bitmap {
                  val w = src.width; val h = src.height
                  if (w < 32 || h < 32) return src
                  var topY = 0; var foundTop = false
                  for (y in 0 until (h / 2) step 3) {
                      for (x in (w / 5) until (w * 4 / 5) step 4) {
                          if (((src.getPixel(x, y) ushr 24) and 0xFF) > 45) { topY = y; foundTop = true; break }
                      }
                      if (foundTop) break
                  }
                  val visH = (h - topY).coerceAtLeast(32)
                  val box = when {
                      h > (w * 1.15f) -> (visH * 0.33f).toInt()
                      w > (h * 1.15f) -> (visH * 0.74f).toInt()
                      else -> (visH * 0.68f).toInt()
                  }.coerceIn(40, minOf(w, h))
                  val sampleY = (topY + (box * 0.35f).toInt()).coerceIn(0, h - 1)
                  var sumX = 0L; var cntX = 0
                  for (x in 0 until w step 4) {
                      if (((src.getPixel(x, sampleY) ushr 24) and 0xFF) > 45) { sumX += x; cntX++ }
                  }
                  val cx = if (cntX > 4) (sumX / cntX).toInt() else (w / 2)
                  val cropX = (cx - (box / 2)).coerceIn(0, (w - box).coerceAtLeast(0))
                  val cropY = (topY - (box * 0.08f).toInt()).coerceIn(0, (h - box).coerceAtLeast(0))
                  return Bitmap.createBitmap(src, cropX, cropY, box, box)
              }

              suspend fun load(name: String): ImageBitmap? = withContext(Dispatchers.IO) {
                  val k = name.trim().lowercase()
                  cache.get(k)?.let { return@withContext it }
                  if (k in failed) return@withContext null
                  val urls = mutableListOf<String>()
                  urlHints[k]?.let { urls.add(it) }
                  try {
                      val c = conn("https://site.web.api.espn.com/apis/common/v3/search?query=${URLEncoder.encode(name, "UTF-8")}&limit=1&type=player&sport=mma")
                      if (c.responseCode in 200..299) {
                          val it = JSONObject(c.inputStream.bufferedReader().use { r -> r.readText() }).optJSONArray("items")?.optJSONObject(0)
                          val pid = it?.optString("id") ?: ""
                          if (pid.isNotBlank()) urls.add("https://a.espncdn.com/i/headshots/mma/players/full/$pid.png")
                          val img = it?.optJSONObject("image")?.optString("default") ?: ""
                          if (img.isNotBlank()) urls.add(img)
                      }
                      c.disconnect()
                  } catch (_: Throwable) {}
                  for (u in urls.distinct()) {
                      try {
                          val c = conn(u)
                          if (c.responseCode in 200..299) {
                              val raw = BitmapFactory.decodeStream(c.inputStream)
                              c.disconnect()
                              if (raw != null) {
                                  val face = cropToFace(raw).asImageBitmap()
                                  cache.put(k, face); return@withContext face
                              }
                          }
                          c.disconnect()
                      } catch (_: Throwable) {}
                  }
                  failed.add(k); null
              }
          }

          @Composable
          fun FighterAvatar(name: String, size: Dp = 56.dp, isChamp: Boolean = false) {
              var bmp by remember(name) { mutableStateOf<ImageBitmap?>(null) }
              LaunchedEffect(name) { bmp = FaceImageLoader.load(name) }
