              private fun httpGet(u: String): String = try {
                  val c = (URL(u).openConnection() as HttpURLConnection).apply { connectTimeout = 6000; readTimeout = 6000; setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 17)") }
                  if (c.responseCode in 200..299) c.inputStream.bufferedReader().use { it.readText() } else ""
              } catch (_: Throwable) { "" }

              suspend fun fetchNews(): List<NewsItem> = withContext(Dispatchers.IO) {
                  val out = mutableListOf<NewsItem>()
                  try {
                      val arr = JSONObject(httpGet("https://site.api.espn.com/apis/site/v2/sports/mma/ufc/news")).optJSONArray("articles")
                      if (arr != null) for (i in 0 until arr.length()) {
                          val a = arr.getJSONObject(i)
                          val h = a.optString("headline").trim()
                          if (h.isNotBlank()) out.add(NewsItem(h, "ESPN UFC", a.optString("published").take(16).replace("T", " "), a.optJSONObject("links")?.optJSONObject("web")?.optString("href") ?: "https://www.ufc.com", a.optString("description").trim()))
                      }
                  } catch (_: Throwable) {}
                  try {
                      val xml = httpGet("https://www.sherdog.com/rss/news.xml")
                      if (xml.isNotBlank()) {
                          val xp = Xml.newPullParser().apply { setInput(StringReader(xml)) }
                          var ev = xp.eventType; var inIt = false; var t = ""; var l = ""; var d = ""
                          while (ev != XmlPullParser.END_DOCUMENT) {
                              val n = xp.name ?: ""
                              if (ev == XmlPullParser.START_TAG) {
                                  if (n.equals("item", true)) { inIt = true; t = ""; l = ""; d = "" }
                                  else if (inIt && n.equals("title", true)) t = try { xp.nextText().trim() } catch (_: Throwable) { "" }
                                  else if (inIt && n.equals("link", true)) l = try { xp.nextText().trim() } catch (_: Throwable) { "" }
                                  else if (inIt && n.equals("description", true)) d = try { xp.nextText().replace(Regex("<.*?>"), "").trim() } catch (_: Throwable) { "" }
                              } else if (ev == XmlPullParser.END_TAG && n.equals("item", true) && inIt) {
                                  if (t.isNotBlank()) out.add(NewsItem(t, "Sherdog RSS", "Latest", l.ifBlank { "https://www.sherdog.com" }, d))
                                  inIt = false
                              }
                              ev = xp.next()
                          }
                      }
                  } catch (_: Throwable) {}
                  if (out.isEmpty()) listOf(
                      NewsItem("Tom Nolan Stops Renato Moicano in Round 3 at UFC Fight Night", "UFC Official", "Final Result", "https://www.ufc.com", "Australia's Tom Nolan finished Renato Moicano via third-round TKO at 1:28."),
                      NewsItem("Waldo Cortes-Acosta vs. Johnny Walker Main Event Set for Nov. 7", "UFC Official", "Fight Week", "https://www.ufc.com", "Heavyweights headline Meta APEX following Sean Brady's injury withdrawal.")
                  ) else out
              }
          }

          object Notifier {
              private const val BAR_CH = "ufc_bar_v12"
              fun init(ctx: Context) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                          nm.createNotificationChannel(NotificationChannel(BAR_CH, "One UI Live Fight Ticker", NotificationManager.IMPORTANCE_DEFAULT).apply { setSound(null, null) })
                      }
                  } catch (_: Throwable) {}
              }
              fun updateLiveBar(ctx: Context, m: LiveMatchState, active: Boolean) {
                  try {
                      val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      if (!active) { nm.cancel(12001); return }
                      if (Build.VERSION.SDK_INT >= 33 && ContextCompat.checkSelfPermission(ctx, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) return
                      init(ctx)
                      val pi = PendingIntent.getActivity(ctx, 12001, Intent(ctx, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                      val n = NotificationCompat.Builder(ctx, BAR_CH)
                          .setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentTitle("${if (m.isEventOver) "FINAL" else m.round} • ${m.fighterA} vs ${m.fighterB}")
                          .setContentText("${m.prediction} | ${m.status}")
                          .setSubText(if (m.isEventOver) "Official Final Result" else "One UI Live Ticker • ${m.probA}%/${m.probB}%")
                          .setOngoing(true).setOnlyAlertOnce(true).setProgress(100, m.probA.coerceIn(0, 100), false).setContentIntent(pi).build()
                      nm.notify(12001, n)
                  } catch (_: Throwable) {}
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  try {
                      WindowCompat.setDecorFitsSystemWindows(window, false)
                      WindowInsetsControllerCompat(window, window.decorView).apply {
                          systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          hide(WindowInsetsCompat.Type.statusBars())
                      }
                      Notifier.init(this)
                      if (Build.VERSION.SDK_INT >= 33 && ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 101)
                      }
                  } catch (_: Throwable) {}
                  setContent {
                      MaterialTheme(darkColorScheme(primary = Color(0xFFD20A0A), background = Color(0xFF0A0A0C), surface = Color(0xFF16161B))) { UfcApp() }
                  }
              }
          }

          fun simNextRound(m: LiveMatchState): LiveMatchState {
              if (m.isEventOver) return m
              return when (m.round) {
                  "PRE-FIGHT" -> m.copy(round = "R1", time = "3:40", oddsA = "-175", oddsB = "+145", probA = 64, probB = 36, strikesA = 16, strikesB = 11, status = "${m.fighterA} lands heavy low kicks and counters ${m.fighterB}.", prediction = "Live AI Pick: ${m.fighterA} via KO/TKO (64% prob)")
                  "R1" -> m.copy(round = "R2", time = "2:12", oddsA = "-260", oddsB = "+210", probA = 73, probB = 27, strikesA = 38, strikesB = 22, status = "${m.fighterA} rocks ${m.fighterB} with a right cross against the fence.", prediction = "Live AI Pick: ${m.fighterA} Heavy Favorite (73% prob)")
                  "R2" -> m.copy(round = "SIM FINAL", time = "1:45", oddsA = "-800", oddsB = "+550", probA = 94, probB = 6, strikesA = 54, strikesB = 26, status = "SIMULATED FINISH: ${m.fighterA} finishes ${m.fighterB} via Round 3 TKO.", prediction = "Simulation Complete • Tap Again to Reset Pre-Fight Line")
                  else -> UfcData.upcomingNov7
              }
          }

          @Composable
          fun UfcApp() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              val isFold8 = LocalConfiguration.current.screenWidthDp >= 600
              var tab by remember { mutableIntStateOf(0) }
              var threePane by remember { mutableStateOf(false) }
              var pinBar by remember { mutableStateOf(true) }
              var hideBars by remember { mutableStateOf(true) }
              var showUpcoming by remember { mutableStateOf(false) }
              var live by remember { mutableStateOf(UfcData.completedOct31) }
              var news by remember { mutableStateOf<List<NewsItem>>(emptyList()) }
              var loading by remember { mutableStateOf(true) }
              var search by remember { mutableStateOf("") }
              var divFilter by remember { mutableStateOf("MEN'S P4P") }
              var evFilter by remember { mutableStateOf("ALL") }
              var selEvent by remember { mutableStateOf<UfcEvent?>(null) }
              var selFighter by remember { mutableStateOf<Fighter?>(null) }

              fun findFighter(name: String): Fighter = UfcData.seedRoster.find { it.name.equals(name, true) }
                  ?: Fighter(name, "UFC Contender", "UFC Division", "MMA", "15-4-0", "International", "5'11\"", "72\"", "Orthodox", 7, 3, 5, "-120", false, 0, 0, listOf(PastFight("WIN", "UFC Opponent", "Decision (R3 5:00)", "UFC Fight Night")))

              fun sync() {
                  loading = true
                  scope.launch { news = UfcData.fetchNews(); loading = false; Notifier.updateLiveBar(ctx, live, pinBar) }
              }
              LaunchedEffect(Unit) { sync() }

              if (selFighter != null) FighterProfileDialog(selFighter!!) { selFighter = null }

              Column(Modifier.fillMaxSize().background(Color(0xFF0A0A0C)).windowInsetsPadding(WindowInsets.safeDrawing)) {
                  Row(Modifier.fillMaxWidth().background(Color(0xFF121216)).padding(horizontal = 12.dp, vertical = 10.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                      Column(Modifier.weight(1f)) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text("UFC PULSE PRO", color = Color(0xFFD20A0A), fontSize = 17.sp, fontWeight = FontWeight.Black)
                              Spacer(Modifier.width(6.dp))
                              Text(if (isFold8) "FOLD 8 4:3" else "COVER", color = Color(0xFFFFD700), fontSize = 10.sp, fontWeight = FontWeight.Bold)
                          }
                          Text("Live Status • P4P • Full Profiles & Card Odds", color = Color.Gray, fontSize = 11.sp)
                      }
                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          Button(onClick = {
                              hideBars = !hideBars
                              try {
                                  val act = ctx as? Activity ?: return@Button
                                  val c = WindowInsetsControllerCompat(act.window, act.window.decorView)
                                  if (hideBars) c.hide(WindowInsetsCompat.Type.statusBars()) else c.show(WindowInsetsCompat.Type.statusBars())
                              } catch (_: Throwable) {}
                          }, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF262630)), contentPadding = PaddingValues(8.dp, 4.dp)) {
                              Text(if (hideBars) "Bars: Hidden" else "Bars: Shown", fontSize = 10.sp, color = Color.White)
                          }
                          if (isFold8) {
                              Button(onClick = { threePane = !threePane }, colors = ButtonDefaults.buttonColors(containerColor = if (threePane) Color(0xFFFFD700) else Color(0xFF262630)), contentPadding = PaddingValues(10.dp, 4.dp)) {
                                  Text(if (threePane) "3-Pane: ON" else "3-Pane", fontSize = 10.sp, color = if (threePane) Color.Black else Color.White, fontWeight = FontWeight.Bold)
                              }
                          }
                          Button(onClick = { sync() }, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFD20A0A)), contentPadding = PaddingValues(10.dp, 4.dp)) {
                              Text("Sync", fontSize = 11.sp, color = Color.White, fontWeight = FontWeight.Bold)
                          }
                      }
                  }
                  if (loading) LinearProgressIndicator(Modifier.fillMaxWidth(), color = Color(0xFFD20A0A))
                  if (!(isFold8 && threePane)) {
                      TabRow(selectedTabIndex = tab, containerColor = Color(0xFF121216), contentColor = Color(0xFFD20A0A)) {
                          Tab(tab == 0, { tab = 0 }, text = { Text("Live & Results", fontSize = 11.sp) })
                          Tab(tab == 1, { tab = 1 }, text = { Text("Events & Odds", fontSize = 11.sp) })
                          Tab(tab == 2, { tab = 2 }, text = { Text("Roster & P4P", fontSize = 11.sp) })
                          Tab(tab == 3, { tab = 3 }, text = { Text("RSS (${news.size})", fontSize = 11.sp) })
                      }
                  }
                  val toggleMode = {
                      showUpcoming = !showUpcoming
                      live = if (showUpcoming) UfcData.upcomingNov7 else UfcData.completedOct31
                      Notifier.updateLiveBar(ctx, live, pinBar)
                  }
                  if (isFold8 && threePane) {
                      Row(Modifier.fillMaxSize().padding(12.dp), Arrangement.spacedBy(14.dp)) {
                          Box(Modifier.weight(1f)) { LivePane(live, showUpcoming, toggleMode, { live = simNextRound(live); Notifier.updateLiveBar(ctx, live, pinBar) }) { selFighter = findFighter(it) } }
                          Box(Modifier.weight(1f)) { EventsPane(UfcData.seedEvents, evFilter, selEvent, { selEvent = it }) { selFighter = findFighter(it) } }
                          Box(Modifier.weight(1f)) { RosterPane(UfcData.seedRoster, search, { search = it }, divFilter, { divFilter = it }, 1) { selFighter = it } }
                      }
                  } else {
                      when (tab) {
                          0 -> if (isFold8) {
                              Row(Modifier.fillMaxSize().padding(14.dp), Arrangement.spacedBy(16.dp)) {
                                  Box(Modifier.weight(1f)) { LivePane(live, showUpcoming, toggleMode, { live = simNextRound(live); Notifier.updateLiveBar(ctx, live, pinBar) }) { selFighter = findFighter(it) } }
                                  Box(Modifier.weight(1f)) { EventsPane(UfcData.seedEvents, "ALL", selEvent ?: UfcData.seedEvents.getOrNull(1), { selEvent = it }) { selFighter = findFighter(it) } }
                              }
                          } else Box(Modifier.fillMaxSize().padding(12.dp)) { LivePane(live, showUpcoming, toggleMode, { live = simNextRound(live); Notifier.updateLiveBar(ctx, live, pinBar) }) { selFighter = findFighter(it) } }
                          1 -> Column(Modifier.fillMaxSize().padding(12.dp)) {
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.padding(bottom = 8.dp)) {
                                  listOf("ALL", "PPV", "FIGHT NIGHT", "COMPLETED").forEach { f ->
                                      Button(onClick = { evFilter = f; selEvent = null }, colors = ButtonDefaults.buttonColors(containerColor = if (evFilter == f) Color(0xFFD20A0A) else Color(0xFF22222A)), contentPadding = PaddingValues(12.dp, 4.dp)) { Text(f, fontSize = 11.sp, color = Color.White) }
                                  }
                              }
                              EventsPane(UfcData.seedEvents, evFilter, selEvent, { selEvent = it }) { selFighter = findFighter(it) }
                          }
                          2 -> Box(Modifier.fillMaxSize().padding(12.dp)) { RosterPane(UfcData.seedRoster, search, { search = it }, divFilter, { divFilter = it }, if (isFold8) 2 else 1) { selFighter = it } }
                          3 -> Box(Modifier.fillMaxSize().padding(12.dp)) { NewsPane(news) { openUrlSafely(ctx, it.link) } }
                      }
                  }
              }
          }

