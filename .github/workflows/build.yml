              private fun httpGet(u: String): String = try {
                  val c = (URL(u).openConnection() as HttpURLConnection).apply {
                      instanceFollowRedirects = true; connectTimeout = 7000; readTimeout = 7000
                      setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 17; SM-F971B) Chrome/131.0.0.0 Mobile")
                  }
                  if (c.responseCode in 200..299) c.inputStream.bufferedReader().use { it.readText() } else ""
              } catch (_: Throwable) { "" }

              fun mapDivCode(divName: String): String {
                  val d = divName.lowercase()
                  return when {
                      d.contains("women") -> "WMMA"
                      d.contains("light heavyweight") -> "LHW"
                      d.contains("heavyweight") -> "HW"
                      d.contains("middleweight") -> "MW"
                      d.contains("welterweight") -> "WW"
                      d.contains("lightweight") -> "LW"
                      d.contains("featherweight") -> "FW"
                      d.contains("bantamweight") -> "BW"
                      d.contains("flyweight") -> "FLW"
                      else -> "MMA"
                  }
              }

              private fun compMatchesEventTitle(comp: JSONObject, evTitle: String): Boolean {
                  val c = comp.optJSONArray("competitors") ?: return false
                  val n1 = c.optJSONObject(0)?.optJSONObject("athlete")?.optString("displayName") ?: ""
                  val n2 = c.optJSONObject(1)?.optJSONObject("athlete")?.optString("displayName") ?: ""
                  val l1 = n1.substringAfterLast(" ").trim()
                  val l2 = n2.substringAfterLast(" ").trim()
                  return (l1.length > 2 && evTitle.contains(l1, true)) || (l2.length > 2 && evTitle.contains(l2, true))
              }

              fun orderCompsMainEventFirst(rawComps: List<JSONObject>, evTitle: String): List<JSONObject> {
                  if (rawComps.size <= 1) return rawComps
                  val firstMatches = compMatchesEventTitle(rawComps.first(), evTitle)
                  val lastMatches = compMatchesEventTitle(rawComps.last(), evTitle)
                  val base = if (firstMatches && !lastMatches) rawComps else rawComps.reversed()
                  val mainIdx = base.indexOfFirst { compMatchesEventTitle(it, evTitle) }
                  return if (mainIdx > 0) {
                      val mu = base.toMutableList()
                      val mainComp = mu.removeAt(mainIdx)
                      mu.add(0, mainComp)
                      mu
                  } else base
              }

              private fun parseCompetitionToBout(comp: JSONObject, idx: Int, total: Int): BoutDetail? {
                  val competitors = comp.optJSONArray("competitors") ?: return null
                  if (competitors.length() < 2) return null
                  val c1 = competitors.getJSONObject(0); val c2 = competitors.getJSONObject(1)
                  val a1 = c1.optJSONObject("athlete"); val a2 = c2.optJSONObject("athlete")
                  val n1 = a1?.optString("displayName")?.takeIf { it.isNotBlank() } ?: "Fighter A"
                  val n2 = a2?.optString("displayName")?.takeIf { it.isNotBlank() } ?: "Fighter B"
                  val id1 = a1?.optString("id") ?: ""; val id2 = a2?.optString("id") ?: ""
                  FaceImageLoader.registerHint(n1, id1, a1?.optJSONObject("headshot")?.optString("href") ?: "")
                  FaceImageLoader.registerHint(n2, id2, a2?.optJSONObject("headshot")?.optString("href") ?: "")

                  val r1 = c1.optJSONArray("records")?.optJSONObject(0)?.optString("summary") ?: "12-3-0"
                  val r2 = c2.optJSONArray("records")?.optJSONObject(0)?.optString("summary") ?: "11-4-0"
                  val wc = comp.optJSONObject("type")?.optString("text")?.takeIf { it.isNotBlank() } ?: "MMA Bout"
                  val placement = when {
                      idx == 0 -> "MAIN EVENT"
                      idx == 1 -> "CO-MAIN EVENT"
                      idx < 5 -> "MAIN CARD"
                      idx >= total - 3 && total > 8 -> "EARLY PRELIMS"
                      else -> "PRELIMS"
                  }
                  val st = comp.optJSONObject("status")
                  val stType = st?.optJSONObject("type")
                  val completed = stType?.optBoolean("completed", false) ?: false
                  val detail = stType?.optString("detail") ?: "Scheduled"
                  val rd = st?.optInt("period", 3) ?: 3
                  val clk = st?.optString("displayClock", "5:00") ?: "5:00"
                  val w1 = c1.optBoolean("winner", false); val w2 = c2.optBoolean("winner", false)

                  val oddsStr = comp.optJSONArray("odds")?.optJSONObject(0)?.optString("details")?.takeIf { it.isNotBlank() } ?: "Live Line Even"
                  val (pA, pB, aiText) = PulseAiEngine.analyzeBout(n1, r1, n2, r2, oddsStr, wc)
                  val official = when {
                      w1 -> "WINNER: $n1 ($detail • R$rd $clk)"
                      w2 -> "WINNER: $n2 ($detail • R$rd $clk)"
                      completed -> "Official Result: $detail"
                      else -> ""
                  }
                  return BoutDetail(wc, placement, n1, r1, id1, n2, r2, id2, oddsStr, pA, pB, aiText, completed, official)
              }

              fun findConfirmedUpcomingBout(fighterName: String, events: List<MmaEvent>): UpcomingBooking? {
                  val target = fighterName.trim().lowercase()
                  val last = target.substringAfterLast(" ")
                  for (ev in events.filter { !it.isCompleted }) {
                      for (b in ev.bouts) {
                          val aMatch = b.fighterA.equals(fighterName, true) || (last.length > 3 && b.fighterA.lowercase().endsWith(last))
                          val bMatch = b.fighterB.equals(fighterName, true) || (last.length > 3 && b.fighterB.lowercase().endsWith(last))
                          if (aMatch || bMatch) {
                              val opp = if (aMatch) "${b.fighterB} (${b.recordB})" else "${b.fighterA} (${b.recordA})"
                              return UpcomingBooking(opp, ev.title, ev.localTime, ev.venue, b.weightClass, b.placement, b.liveOdds, b.prediction)
                          }
                      }
                  }
                  return null
              }

              suspend fun syncAllMmaData(): Triple<LiveMatchState, List<MmaEvent>, List<Fighter>> = withContext(Dispatchers.IO) {
                  val rosterMap = LinkedHashMap<String, Fighter>()
                  VERIFIED_STARS.forEach { s ->
                      FaceImageLoader.registerHint(s.name, s.id)
                      rosterMap[s.name.lowercase()] = s
                  }
                  val eventsList = mutableListOf<MmaEvent>()
                  var liveOrRecentMatch: LiveMatchState? = null
                  var nextPreviewMatch: LiveMatchState? = null

                  try {
                      val rkJson = httpGet("https://site.api.espn.com/apis/site/v2/sports/mma/ufc/rankings")
                      if (rkJson.isNotBlank()) {
                          val groups = JSONObject(rkJson).optJSONArray("rankings")
                          if (groups != null) {
                              for (i in 0 until groups.length()) {
                                  val g = groups.getJSONObject(i)
                                  val gName = g.optString("name", "")
                                  val isMensP4p = gName.contains("Men's Pound", true) || (gName.contains("Pound", true) && !gName.contains("Women", true))
                                  val isWomensP4p = gName.contains("Women's Pound", true)
                                  val divCode = mapDivCode(gName)
                                  val ranks = g.optJSONArray("ranks") ?: continue
                                  for (j in 0 until ranks.length()) {
                                      val rObj = ranks.getJSONObject(j)
                                      val rankNum = rObj.optInt("current", j + 1)
                                      val rec = rObj.optString("recordSummary", "18-3-0")
                                      val ath = rObj.optJSONObject("athlete") ?: continue
                                      val id = ath.optString("id", "")
                                      val name = ath.optString("displayName", "").trim()
                                      if (name.isBlank()) continue
                                      val nick = ath.optString("nickname", "MMA Pro")
                                      val nat = ath.optJSONObject("flag")?.optString("alt")
                                          ?: ath.optString("citizenship", "").takeIf { it.isNotBlank() }
                                          ?: rosterMap[name.lowercase()]?.nationality
                                          ?: "UFC Roster"
                                      val head = ath.optJSONObject("headshot")?.optString("href") ?: ""
                                      FaceImageLoader.registerHint(name, id, head)
                                      val ex = rosterMap[name.lowercase()]
                                      if (ex != null) {
                                          rosterMap[name.lowercase()] = ex.copy(
                                              id = id.ifBlank { ex.id },
                                              record = if (rec != "0-0-0") rec else ex.record,
                                              nationality = if (nat != "UFC Roster") nat else ex.nationality,
                                              mensP4p = if (isMensP4p) rankNum else ex.mensP4p,
                                              womensP4p = if (isWomensP4p) rankNum else ex.womensP4p,
                                              division = if (!isMensP4p && !isWomensP4p) gName else ex.division,
                                              code = if (!isMensP4p && !isWomensP4p) divCode else ex.code,
                                              rankLabel = if (!isMensP4p && !isWomensP4p) "#$rankNum $divCode" else ex.rankLabel,
                                              isChamp = ex.isChamp || (!isMensP4p && !isWomensP4p && rankNum == 0)
                                          )
                                      } else {
                                          rosterMap[name.lowercase()] = Fighter(
                                              id, name, nick, if (isMensP4p || isWomensP4p) "Pound-for-Pound" else gName,
                                              if (isMensP4p) "LW" else if (isWomensP4p) "WMMA" else divCode,
                                              rec, nat, if (isMensP4p) "#$rankNum Men's P4P" else if (isWomensP4p) "#$rankNum Women's P4P" else "#$rankNum $divCode",
                                              rankNum == 0, if (isMensP4p) rankNum else 0, if (isWomensP4p) rankNum else 0, head
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  } catch (_: Throwable) {}

                  try {
                      val fmt = DateTimeFormatter.ofPattern("yyyyMMdd")
                      val start = LocalDate.now().minusDays(120).format(fmt)
                      val end = LocalDate.now().plusDays(95).format(fmt)
                      val sbJson = httpGet("https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard?dates=$start-$end")
                      if (sbJson.isNotBlank()) {
                          val evArr = JSONObject(sbJson).optJSONArray("events")
                          if (evArr != null) {
                              val recentCutoff = LocalDate.now().minusDays(7)
                              for (i in 0 until evArr.length()) {
                                  val ev = evArr.getJSONObject(i)
                                  val evId = ev.optString("id", "$i")
                                  val evName = ev.optString("name", "MMA Event")
                                  val evDateStr = ev.optString("date", "")
                                  val evLocalDate = try { LocalDate.parse(evDateStr.take(10)) } catch (_: Throwable) { LocalDate.now() }
                                  val isCompleted = ev.optJSONObject("status")?.optJSONObject("type")?.optBoolean("completed", false) ?: evLocalDate.isBefore(LocalDate.now())

                                  val comps = ev.optJSONArray("competitions") ?: continue
                                  val rawComps = mutableListOf<JSONObject>()
                                  for (j in 0 until comps.length()) rawComps.add(comps.getJSONObject(j))

                                  for (comp in rawComps) {
                                      val wc = comp.optJSONObject("type")?.optString("text") ?: "Lightweight"
                                      val dCode = mapDivCode(wc)
                                      val cArr = comp.optJSONArray("competitors") ?: continue
                                      for (k in 0 until cArr.length()) {
                                          val cObj = cArr.getJSONObject(k)
                                          val ath = cObj.optJSONObject("athlete") ?: continue
                                          val fName = ath.optString("displayName", "").trim()
                                          if (fName.isBlank()) continue
                                          val fId = ath.optString("id", "")
                                          val fNat = ath.optJSONObject("flag")?.optString("alt")
                                              ?: ath.optString("citizenship", "").takeIf { it.isNotBlank() }
                                              ?: rosterMap[fName.lowercase()]?.nationality
                                              ?: "UFC Roster"
                                          val fRec = cObj.optJSONArray("records")?.optJSONObject(0)?.optString("summary") ?: "14-4-0"
                                          FaceImageLoader.registerHint(fName, fId, ath.optJSONObject("headshot")?.optString("href") ?: "")
                                          if (!rosterMap.containsKey(fName.lowercase())) {
                                              rosterMap[fName.lowercase()] = Fighter(fId, fName, "Active Pro", wc, dCode, fRec, fNat, dCode)
                                          }
                                      }
                                  }

                                  if (evLocalDate.isBefore(recentCutoff)) continue
                                  val orderedComps = orderCompsMainEventFirst(rawComps, evName)
                                  val bouts = orderedComps.mapIndexedNotNull { idx, c -> parseCompetitionToBout(c, idx, orderedComps.size) }
                                  val venue = orderedComps.firstOrNull()?.optJSONObject("venue")?.optString("fullName") ?: inferVenue(evName)
                                  val evType = when {
                                      isCompleted -> "COMPLETED"
                                      evName.contains(Regex("UFC \\d+")) -> "PPV"
                                      else -> "FIGHT NIGHT"
                                  }
                                  if (bouts.isNotEmpty()) {
                                      val eventObj = MmaEvent(
                                          id = evId, title = evName, type = evType,
                                          localTime = if (isCompleted) "COMPLETED • ${evDateStr.take(10)} (${bouts.size} Bouts)" else "${fmtLocal(evDateStr)} • ${bouts.size} Bouts",
                                          venue = venue, isCompleted = isCompleted, bouts = bouts
                                      )
                                      eventsList.add(eventObj)
                                      val main = bouts.first()
                                      if (isCompleted) {
                                          liveOrRecentMatch = LiveMatchState(
                                              evName, "${main.weightClass} • MAIN EVENT FINAL",
                                              main.fighterA, main.recordA, main.liveOdds, if (main.officialResult.contains(main.fighterA)) 100 else 0,
                                              main.fighterB, main.recordB, "Final", if (main.officialResult.contains(main.fighterB)) 100 else 0,
                                              "FINAL", "Official", main.officialResult.ifBlank { "Event Concluded" },
                                              "Event Completed • Live Predictions Locked", true
                                          )
                                      } else if (nextPreviewMatch == null) {
                                          nextPreviewMatch = LiveMatchState(
                                              evName, "${main.weightClass} • MAIN EVENT (5 RDS)",
                                              main.fighterA, main.recordA, main.liveOdds, main.probA,
                                              main.fighterB, main.recordB, "Live Line", main.probB,
                                              "PRE-FIGHT", "5:00", "Main Event Headliner at $venue.",
                                              main.prediction, false
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  } catch (_: Throwable) {}

                  val finalLive = liveOrRecentMatch ?: nextPreviewMatch ?: LiveMatchState(
                      "MMA Fight Night: Moicano vs. Nolan", "Lightweight Main Event • OFFICIAL FINAL",
                      "Tom Nolan", "12-1-0", "+140 Winner", 100, "Renato Moicano", "21-8-1", "-165", 0,
                      "FINAL (R3)", "1:28", "WINNER: Tom Nolan def. Renato Moicano via TKO (Elbows & Punches) at 1:28 of Round 3.",
                      "Event Completed • Live Predictions Locked", true
                  )
                  Triple(finalLive, eventsList, rosterMap.values.toList())
              }

              suspend fun fetchFullEventBouts(event: MmaEvent): List<BoutDetail> = withContext(Dispatchers.IO) {
                  if (event.bouts.size >= 11 || event.id.isBlank()) return@withContext event.bouts
                  try {
                      val sumJson = httpGet("https://site.api.espn.com/apis/site/v2/sports/mma/ufc/summary?event=${event.id}")
                      val comps = JSONObject(sumJson).optJSONObject("header")?.optJSONArray("competitions")
                      if (comps != null && comps.length() > event.bouts.size) {
                          val list = mutableListOf<JSONObject>()
                          for (i in 0 until comps.length()) list.add(comps.getJSONObject(i))
                          val ordered = orderCompsMainEventFirst(list, event.title)
                          val parsed = ordered.mapIndexedNotNull { idx, c -> parseCompetitionToBout(c, idx, ordered.size) }
                          if (parsed.isNotEmpty()) return@withContext parsed
                      }
                  } catch (_: Throwable) {}
                  event.bouts
              }

              suspend fun searchLiveFighters(query: String): List<Fighter> = withContext(Dispatchers.IO) {
                  if (query.trim().length < 2) return@withContext emptyList()
                  val results = mutableListOf<Fighter>()
                  try {
                      val q = URLEncoder.encode(query.trim(), "UTF-8")
                      val json = httpGet("https://site.web.api.espn.com/apis/common/v3/search?query=$q&limit=25&type=player&sport=mma")
                      val items = JSONObject(json).optJSONArray("items")
                      if (items != null) {
                          for (i in 0 until items.length()) {
                              val it = items.getJSONObject(i)
                              val id = it.optString("id", "")
                              val name = it.optString("displayName", "").trim()
                              if (name.isBlank()) continue
                              val sub = it.optString("subtitle", "UFC Roster")
                              val img = it.optJSONObject("image")?.optString("default") ?: ""
                              FaceImageLoader.registerHint(name, id, img)
                              val starMatch = VERIFIED_STARS.find { s -> s.name.equals(name, true) }
                              results.add(
                                  starMatch ?: Fighter(id, name, "MMA Pro", sub, mapDivCode(sub), "Pro Record", "Tap for Full Bio", "Roster")
                              )
                          }
                      }
                  } catch (_: Throwable) {}
                  results
              }

              private fun cleanWikiCell(raw: String): String = raw
                  .replace(Regex("""<ref[^>]*>.*?</ref>""", setOf(RegexOption.DOT_MATCHES_ALL, RegexOption.IGNORE_CASE)), "")
                  .replace(Regex("""<ref[^/>]*/>""", RegexOption.IGNORE_CASE), "")
                  .replace(Regex("""\{\{(?:flagicon|flag|small|nowrap|sort|sortname|dts|abbr)[^}]*\}\}""", RegexOption.IGNORE_CASE), "")
                  .replace(Regex("""\{\{([^|}]+)\|([^|}]+)\}\}"""), "$2")
                  .replace(Regex("""\{\{.*?\}\}"""), "")
                  .replace(Regex("""\[\[(?:[^|\]]*\|)?([^\]]+)\]\]"""), "$1")
                  .replace(Regex("""<[^>]+>"""), "")
                  .replace("'''", "").replace("''", "").replace("&nbsp;", " ").trim()

              suspend fun fetchFighterBioAndHistory(f: Fighter): FighterBio = withContext(Dispatchers.IO) {
                  val fights = mutableListOf<PastFight>()
                  var nat = if (f.nationality != "UFC Roster" && f.nationality != "International" && f.nationality != "Tap for Full Bio") f.nationality else ""
                  var ht = "5'10\""; var rch = "72\""; var stn = "Orthodox"
                  var rec = f.record; var nick = f.nickname

                  if (f.id.isNotBlank() && f.id != "0") {
                      try {
                          val cJson = httpGet("https://sports.core.api.espn.com/v2/sports/mma/athletes/${f.id}")
                          if (cJson.isNotBlank()) {
                              val o = JSONObject(cJson)
                              val cit = o.optString("citizenship", "").ifBlank { o.optJSONObject("birthPlace")?.optString("country", "") ?: "" }
                              if (cit.isNotBlank()) nat = cit
                              o.optString("displayHeight", "").takeIf { it.isNotBlank() }?.let { ht = it }
                              o.optString("displayReach", "").takeIf { it.isNotBlank() }?.let { rch = it }
                              o.optJSONObject("stance")?.optString("text", "")?.takeIf { it.isNotBlank() }?.let { stn = it }
                              o.optString("nickname", "").takeIf { it.isNotBlank() }?.let { nick = it }
                          }
                      } catch (_: Throwable) {}
                  }

                  try {
                      val searchQ = URLEncoder.encode("${f.name} mixed martial arts", "UTF-8")
                      val sJson = httpGet("https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=$searchQ&format=json")
                      var pageTitle = f.name.replace(" ", "_")
                      if (sJson.isNotBlank()) {
                          val sArr = JSONObject(sJson).optJSONObject("query")?.optJSONArray("search")
                          if (sArr != null && sArr.length() > 0) {
                              val lastName = f.name.substringAfterLast(" ").lowercase()
                              for (i in 0 until minOf(3, sArr.length())) {
                                  val cand = sArr.getJSONObject(i).optString("title", "")
                                  if (cand.lowercase().contains(lastName)) { pageTitle = cand.replace(" ", "_"); break }
                              }
                          }
                      }
                      val wJson = httpGet("https://en.wikipedia.org/w/api.php?action=parse&page=${URLEncoder.encode(pageTitle, "UTF-8")}&prop=wikitext&format=json&redirects=1")
                      if (wJson.isNotBlank()) {
                          val wt = JSONObject(wJson).optJSONObject("parse")?.optJSONObject("wikitext")?.optString("*") ?: ""
                          if (nat.isBlank()) {
                              val bPlace = Regex("""\|\s*(?:nationality|birth_place|fighting_out_of)\s*=\s*([^\n]+)""").find(wt)?.groupValues?.getOrNull(1)?.let { cleanWikiCell(it) } ?: ""
                              if (bPlace.isNotBlank()) nat = bPlace.substringAfterLast(",").trim()
                          }
                          Regex("""\|\s*height\s*=\s*([^\n]+)""").find(wt)?.groupValues?.getOrNull(1)?.let { cleanWikiCell(it).takeIf { c -> c.isNotBlank() }?.let { c -> ht = c.take(14) } }
                          Regex("""\|\s*reach\s*=\s*([^\n]+)""").find(wt)?.groupValues?.getOrNull(1)?.let { cleanWikiCell(it).takeIf { c -> c.isNotBlank() }?.let { c -> rch = c.take(12) } }
                          Regex("""\|\s*stance\s*=\s*([^\n]+)""").find(wt)?.groupValues?.getOrNull(1)?.let { cleanWikiCell(it).takeIf { c -> c.isNotBlank() }?.let { c -> stn = c.take(14) } }

                          val mmaSec = wt.substringAfter("Mixed martial arts record", "").substringBefore("\n==", "")
                          if (mmaSec.isNotBlank()) {
                              val rows = mmaSec.split("|-")
                              for (r in rows) {
                                  val rawCells = mutableListOf<String>()
                                  for (line in r.lines()) {
                                      val t = line.trim()
                                      if (t.startsWith("|") && !t.startsWith("|}")) {
                                          t.drop(1).split("||").forEach { c -> rawCells.add(cleanWikiCell(c.substringAfterLast("|"))) }
                                      }
                                  }
                                  if (rawCells.size >= 7) {
                                      val r0 = rawCells[0].uppercase()
                                      if (r0 == "WIN" || r0 == "LOSS" || r0 == "DRAW" || r0 == "NC") {
                                          if ((rec == "Pro Record" || rec == "Active Pro") && rawCells[1].contains("-")) rec = rawCells[1]
                                          val opp = rawCells[2]; val meth = rawCells[3]; val ev = rawCells[4]; val dt = rawCells[5]
                                          val rnd = rawCells[6].filter { it.isDigit() }.toIntOrNull() ?: 3
                                          val tm = rawCells.getOrElse(7) { "5:00" }.ifBlank { "5:00" }
                                          val loc = rawCells.getOrElse(8) { "" }
                                          if (opp.isNotBlank()) fights.add(PastFight(r0, opp, meth, rnd, tm, ev, dt, inferVenue(ev, loc)))
                                      }
                                  }
                              }
                          }
                      }
                  } catch (_: Throwable) {}

                  FighterBio(nat.ifBlank { "International" }, ht, rch, stn, rec, nick, fights)
              }

              suspend fun fetchNews(): List<NewsItem> = withContext(Dispatchers.IO) {
                  val out = mutableListOf<NewsItem>()
                  try {
                      val arr = JSONObject(httpGet("https://site.api.espn.com/apis/site/v2/sports/mma/ufc/news")).optJSONArray("articles")
                      if (arr != null) for (i in 0 until arr.length()) {
                          val a = arr.getJSONObject(i)
                          val h = a.optString("headline").trim()
                          if (h.isNotBlank()) out.add(NewsItem(h, "ESPN MMA", a.optString("published").take(16).replace("T", " "), a.optJSONObject("links")?.optJSONObject("web")?.optString("href") ?: "https://www.espn.com/mma/", a.optString("description").trim()))
                      }
                  } catch (_: Throwable) {}
                  try {
                      val xml = httpGet("https://www.sherdog.com/rss/news.xml")
                      if (xml.isNotBlank()) {
                          val xp = Xml.newPullParser().apply { setInput(StringReader(xml)) }
                          var ev = xp.eventType; var inIt = false; var t = ""; var l = ""; var d = ""
                          while (ev != XmlPullParser.END_DOCUMENT) {
                              val n = xp.name ?: ""
                              if (ev == XmlPullParser.START_TAG) {
                                  if (n.equals("item", true)) { inIt = true; t = ""; l = ""; d = "" }
                                  else if (inIt && n.equals("title", true)) t = try { xp.nextText().trim() } catch (_: Throwable) { "" }
                                  else if (inIt && n.equals("link", true)) l = try { xp.nextText().trim() } catch (_: Throwable) { "" }
                                  else if (inIt && n.equals("description", true)) d = try { xp.nextText().replace(Regex("<.*?>"), "").trim() } catch (_: Throwable) { "" }
                              } else if (ev == XmlPullParser.END_TAG && n.equals("item", true) && inIt) {
                                  if (t.isNotBlank()) out.add(NewsItem(t, "Sherdog MMA", "Latest", l.ifBlank { "https://www.sherdog.com" }, d))
                                  inIt = false
                              }
                              ev = xp.next()
                          }
                      }
                  } catch (_: Throwable) {}
                  out
              }
          }

