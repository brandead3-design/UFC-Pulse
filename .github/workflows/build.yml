                                  modifier = Modifier.fillMaxWidth().height(48.dp),
                                  shape = RoundedCornerShape(50),
                                  colors = ButtonDefaults.buttonColors(containerColor = if (m.isEventOver) Color(0xFF2B2B3C) else Color(0xFFE51937))
                              ) {
                                  Text(if (m.isEventOver) "Event Finished • Load Next Upcoming Headliner ➔" else "Simulate Next Live Round (Pulse AI v2) ➔", color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun EventsSection(list: List<MmaEvent>, filter: String, sel: MmaEvent?, onSel: (MmaEvent?) -> Unit, onFighter: (String) -> Unit) {
              if (sel != null) {
                  var fullBouts by remember(sel.id) { mutableStateOf(sel.bouts) }
                  LaunchedEffect(sel.id) { fullBouts = MmaRepository.fetchFullEventBouts(sel) }

                  Column(Modifier.fillMaxSize()) {
                      Button(
                          onClick = { onSel(null) },
                          shape = RoundedCornerShape(50),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF252534)),
                          modifier = Modifier.padding(bottom = 10.dp)
                      ) { Text("← Back to All Events", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold) }

                      Card(Modifier.fillMaxSize(), shape = RoundedCornerShape(22.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF171720))) {
                          Column(Modifier.fillMaxSize().padding(16.dp)) {
                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                  Text(sel.type, color = Color(0xFFFFD700), fontSize = 12.sp, fontWeight = FontWeight.Black)
                                  Text("FULL CARD • ${fullBouts.size} BOUTS SYNCED", color = Color(0xFF4CAF50), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              }
                              Text(sel.title, color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.ExtraBold)
                              Text("${sel.localTime} • ${sel.venue}", color = Color(0xFFB0B0C0), fontSize = 13.sp)
                              Spacer(Modifier.height(12.dp))

                              LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxSize()) {
                                  items(fullBouts) { b ->
                                      Card(Modifier.fillMaxWidth(), shape = RoundedCornerShape(18.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF21212E))) {
                                          Column(Modifier.padding(14.dp)) {
                                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                                  Text("${b.placement} • ${b.weightClass}", color = if (b.placement.contains("PRELIM")) Color(0xFFFF9800) else Color(0xFFE51937), fontSize = 12.sp, fontWeight = FontWeight.Black)
                                                  Text(b.liveOdds, color = Color(0xFFFFD700), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                              }
                                              Spacer(Modifier.height(10.dp))
                                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                                  Row(Modifier.weight(1f).clickable { onFighter(b.fighterA) }, verticalAlignment = Alignment.CenterVertically) {
                                                      FighterAvatar(b.fighterA, 54.dp)
                                                      Spacer(Modifier.width(10.dp))
                                                      Column {
                                                          Text(b.fighterA, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                                                          Text(b.recordA, color = Color(0xFFB0B0C0), fontSize = 12.sp)
                                                      }
                                                  }
                                                  Text("VS", color = Color(0xFFE51937), fontSize = 13.sp, fontWeight = FontWeight.Black, modifier = Modifier.padding(horizontal = 6.dp))
                                                  Row(Modifier.weight(1f).clickable { onFighter(b.fighterB) }, Arrangement.End, Alignment.CenterVertically) {
                                                      Column(horizontalAlignment = Alignment.End) {
                                                          Text(b.fighterB, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold, textAlign = TextAlign.End)
                                                          Text(b.recordB, color = Color(0xFFB0B0C0), fontSize = 12.sp)
                                                      }
                                                      Spacer(Modifier.width(10.dp))
                                                      FighterAvatar(b.fighterB, 54.dp)
                                                  }
                                              }
                                              Spacer(Modifier.height(8.dp))
                                              Text(if (b.isCompleted) b.officialResult else b.prediction, color = Color(0xFF4CAF50), fontSize = 13.sp, fontWeight = FontWeight.Bold)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              } else {
                  val filtered = list.filter { filter == "ALL" || it.type == filter }
                  LazyColumn(verticalArrangement = Arrangement.spacedBy(12.dp), modifier = Modifier.fillMaxSize()) {
                      items(filtered) { ev ->
                          Card(Modifier.fillMaxWidth().clickable { onSel(ev) }, shape = RoundedCornerShape(20.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF171720))) {
                              Column(Modifier.padding(16.dp)) {
                                  Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                      Text(ev.type, color = if (ev.isCompleted) Color(0xFF4CAF50) else Color(0xFFFFD700), fontSize = 12.sp, fontWeight = FontWeight.Black)
                                      Text(ev.localTime, color = Color(0xFF4CAF50), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                  }
                                  Spacer(Modifier.height(4.dp))
                                  Text(ev.title, color = Color.White, fontSize = 19.sp, fontWeight = FontWeight.ExtraBold)
                                  Text(ev.venue, color = Color(0xFFB0B0C0), fontSize = 13.sp)
                                  Spacer(Modifier.height(10.dp))
                                  ev.bouts.firstOrNull()?.let { mb ->
                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          FighterAvatar(mb.fighterA, 44.dp); Spacer(Modifier.width(8.dp)); FighterAvatar(mb.fighterB, 44.dp); Spacer(Modifier.width(10.dp))
                                          Text("Tap for Full ${ev.bouts.size}-Bout Card & Live Odds ➔", color = Color(0xFFFFD700), fontSize = 13.sp, fontWeight = FontWeight.Bold)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun RosterSection(list: List<Fighter>, q: String, onQ: (String) -> Unit, div: String, onDiv: (String) -> Unit, cols: Int, onSel: (Fighter) -> Unit) {
              val divs = listOf("ALL", "MEN'S P4P", "WOMEN'S P4P", "CHAMPS", "HW", "LHW", "MW", "WW", "LW", "FW", "BW", "FLW", "WMMA")
              Column(Modifier.fillMaxSize()) {
                  Row(Modifier.fillMaxWidth().padding(bottom = 10.dp), verticalAlignment = Alignment.CenterVertically) {
                      OutlinedTextField(
                          value = q,
                          onValueChange = onQ,
                          label = { Text("Search any MMA / UFC fighter name, division, or country", fontSize = 13.sp) },
                          modifier = Modifier.weight(1f),
                          shape = RoundedCornerShape(18.dp),
                          singleLine = true
                      )
                      if (q.isNotBlank()) {
                          Spacer(Modifier.width(8.dp))
                          Button(onClick = { onQ("") }, shape = RoundedCornerShape(50), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF252534))) {
                              Text("Clear", color = Color.White, fontSize = 12.sp)
                          }
                      }
                  }

                  Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()).padding(bottom = 10.dp), Arrangement.spacedBy(8.dp)) {
                      divs.forEach { d ->
                          Button(
                              onClick = { onDiv(d) },
                              shape = RoundedCornerShape(50),
                              colors = ButtonDefaults.buttonColors(containerColor = if (div == d && q.isBlank()) Color(0xFFE51937) else Color(0xFF222230)),
                              contentPadding = PaddingValues(horizontal = 14.dp, vertical = 6.dp)
                          ) { Text(d, fontSize = 12.sp, color = Color.White, fontWeight = FontWeight.Bold) }
                      }
                  }

                  // When searching, search across ALL fighters regardless of division tab!
                  val filtered = list.filter { f ->
                      if (q.isNotBlank()) {
                          f.name.contains(q, true) || f.division.contains(q, true) || f.nationality.contains(q, true) || f.nickname.contains(q, true)
                      } else {
                          when (div) {
                              "ALL" -> true
                              "MEN'S P4P" -> f.mensP4p > 0
                              "WOMEN'S P4P" -> f.womensP4p > 0
                              "CHAMPS" -> f.isChamp
                              else -> f.code.equals(div, true)
                          }
                      }
                  }.sortedWith(
                      when {
                          q.isNotBlank() -> compareBy({ !it.name.startsWith(q, true) }, { it.name })
                          div == "MEN'S P4P" -> compareBy { it.mensP4p }
                          div == "WOMEN'S P4P" -> compareBy { it.womensP4p }
                          else -> compareBy({ !it.isChamp }, { it.name })
                      }
                  )

                  LazyVerticalGrid(GridCells.Fixed(cols), verticalArrangement = Arrangement.spacedBy(10.dp), horizontalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxSize()) {
                      items(filtered) { f ->
                          Card(Modifier.fillMaxWidth().clickable { onSel(f) }, shape = RoundedCornerShape(20.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF171720))) {
                              Row(Modifier.fillMaxWidth().padding(14.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                  Row(Modifier.weight(1f), verticalAlignment = Alignment.CenterVertically) {
                                      FighterAvatar(f.name, 60.dp, f.isChamp)
                                      Spacer(Modifier.width(12.dp))
                                      Column {
                                          Text(f.name, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.ExtraBold)
                                          Text("${f.division} • ${f.nationality}", color = Color(0xFFB0B0C0), fontSize = 12.sp)
                                          Text("Tap for Full Career Fight History", color = Color(0xFFE51937), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                      }
                                  }
                                  Column(horizontalAlignment = Alignment.End) {
                                      Text(f.rankLabel, color = Color(0xFFFFD700), fontSize = 11.sp, fontWeight = FontWeight.Black)
                                      Text(f.record, color = Color(0xFF4CAF50), fontSize = 15.sp, fontWeight = FontWeight.ExtraBold)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun FighterProfileModal(f: Fighter, onDismiss: () -> Unit) {
              var career by remember(f.name) { mutableStateOf<List<PastFight>>(emptyList()) }
              var extraMeta by remember(f.name) { mutableStateOf("") }
              var loading by remember(f.name) { mutableStateOf(true) }

              LaunchedEffect(f.name) {
                  loading = true
                  val (meta, list) = MmaRepository.fetchCareerHistory(f.name)
                  extraMeta = meta
                  career = list
                  loading = false
              }

              Dialog(onDismissRequest = onDismiss, properties = DialogProperties(usePlatformDefaultWidth = false)) {
                  Card(Modifier.fillMaxWidth(0.95f).fillMaxHeight(0.90f).border(1.5.dp, Color(0xFFE51937), RoundedCornerShape(24.dp)), shape = RoundedCornerShape(24.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF12121A))) {
                      Column(Modifier.fillMaxSize().padding(18.dp)) {
                          Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                              Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.weight(1f)) {
                                  FighterAvatar(f.name, 84.dp, f.isChamp)
                                  Spacer(Modifier.width(14.dp))
                                  Column {
                                      Text(f.name, color = Color.White, fontSize = 21.sp, fontWeight = FontWeight.Black)
                                      Text("${f.division} • Record: ${f.record}", color = Color(0xFF4CAF50), fontSize = 14.sp, fontWeight = FontWeight.Bold)
                                      Text(extraMeta.ifBlank { f.nationality }, color = Color(0xFFB0B0C0), fontSize = 13.sp)
                                  }
                              }
                              Button(onClick = onDismiss, shape = RoundedCornerShape(50), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF252534))) {
                                  Text("Close", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                              }
                          }
                          Spacer(Modifier.height(14.dp))
                          Text(if (loading) "LOADING COMPLETE PRO FIGHT HISTORY..." else "COMPLETE PRO FIGHT HISTORY (${career.size} BOUTS)", color = Color(0xFFFFD700), fontSize = 13.sp, fontWeight = FontWeight.Black)
                          Spacer(Modifier.height(8.dp))
                          if (loading) LinearProgressIndicator(Modifier.fillMaxWidth(), color = Color(0xFFE51937))
                          LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.weight(1f)) {
                              items(career) { h ->
                                  Card(Modifier.fillMaxWidth(), shape = RoundedCornerShape(16.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF1C1C28))) {
                                      Row(Modifier.fillMaxWidth().padding(12.dp), Arrangement.SpaceBetween, Alignment.CenterVertically) {
                                          Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.weight(1f)) {
                                              Box(Modifier.background(if (h.result == "WIN") Color(0xFF1B5E20) else if (h.result == "LOSS") Color(0xFFB71C1C) else Color(0xFF424242), RoundedCornerShape(8.dp)).padding(horizontal = 10.dp, vertical = 5.dp)) {
                                                  Text(h.result, color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Black)
                                              }
                                              Spacer(Modifier.width(12.dp))
                                              Column {
                                                  Text("vs. ${h.opponent}", color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                                                  Text("${h.method} • ${h.event}", color = Color(0xFFB0B0C0), fontSize = 12.sp)
                                              }
                                          }
                                          FighterAvatar(h.opponent, 44.dp)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun NewsSection(list: List<NewsItem>, onClick: (NewsItem) -> Unit) {
              LazyColumn(verticalArrangement = Arrangement.spacedBy(12.dp), modifier = Modifier.fillMaxSize()) {
                  items(list) { item ->
                      Card(Modifier.fillMaxWidth().clickable { onClick(item) }, shape = RoundedCornerShape(20.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF171720))) {
                          Column(Modifier.padding(16.dp)) {
                              Row(Modifier.fillMaxWidth(), Arrangement.SpaceBetween) {
                                  Text(item.source, color = Color(0xFFE51937), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                  Text(item.pubDate, color = Color(0xFFB0B0C0), fontSize = 12.sp)
                              }
                              Spacer(Modifier.height(6.dp))
                              Text(item.title, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                              if (item.summary.isNotBlank()) {
                                  Spacer(Modifier.height(4.dp))
                                  Text(item.summary, color = Color(0xFFB0B0C0), fontSize = 13.sp, maxLines = 2)
                              }
                          }
                      }
                  }
              }
          }
